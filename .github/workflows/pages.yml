# typhoon-app を GitHub Pages に配信する
# 初回のみ：リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: Deploy typhoon-app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['typhoon-app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: typhoon-app
      - id: deployment
        uses: actions/deploy-pages@v4
