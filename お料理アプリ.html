<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>わが家のごはん帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* レイアウト: 1カラムの献立帳。主役は「お膳」を真上から見た図（奥左=副菜・奥右=主菜・手前左=ご飯・手前右=汁もの）。
   色: 藍染めの藍と和紙の地、器は染付・漆・青磁、アレンジだけ山吹色。書体: 見出しは明朝（品書き）、本文は角ゴシック */
:root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#e4e9ef;
    --ink:#172033;
    --muted:#5b6679;
    --line:#d4dbe4;
    --accent:#22406b;          /* 藍 */
    --accent-ink:#ffffff;
    --accent-soft:#dde6f2;
    --yolk:#c98e0c;            /* 山吹: ひとひねり専用 */
    --yolk-soft:#f6ecd2;
    --yolk-ink:#5b3f00;
    --danger:#b23a2a;
    --sun:#b23a2a; --sat:#2d5b9a;
    /* 器と膳（イラスト。どちらのテーマでも同じ色） */
    --tray:#2b211d; --tray-2:#3a2b25; --tray-edge:#7d2a1f; --tray-ink:#f5eee3; --tray-muted:#c9b9a6;
    --porcelain:#fbfaf6; --rim:#2c4c7c; --lacquer:#8f2b1f; --lacquer-dark:#1c1210; --celadon:#a4c3b2; --celadon-dark:#7e9f8d; --rice:#f6f3ea;
    --shadow:0 1px 2px rgba(23,32,51,.06),0 8px 24px rgba(23,32,51,.08);
    --font-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
    --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;
    --r:12px;
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --bg:#10151d;--surface:#18202b;--surface-2:#212b38;--ink:#e6eaf0;--muted:#94a1b3;--line:#2c3746;
        --accent:#9dbbe6;--accent-ink:#0c1522;--accent-soft:#1f2d42;
        --yolk:#e9b53c;--yolk-soft:#33290f;--yolk-ink:#f6e0a6;--danger:#ef8b7a;--sun:#ef8b7a;--sat:#9dbbe6;
        --tray:#231a17;--tray-2:#30241f;
        --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
        color-scheme:dark;
    }
}
:root[data-theme="dark"]{
    --bg:#10151d;--surface:#18202b;--surface-2:#212b38;--ink:#e6eaf0;--muted:#94a1b3;--line:#2c3746;
    --accent:#9dbbe6;--accent-ink:#0c1522;--accent-soft:#1f2d42;
    --yolk:#e9b53c;--yolk-soft:#33290f;--yolk-ink:#f6e0a6;--danger:#ef8b7a;--sun:#ef8b7a;--sat:#9dbbe6;
    --tray:#231a17;--tray-2:#30241f;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;padding-inline:16px}
.wrap{max-width:680px;margin:0 auto;padding-block:18px 124px;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.35;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダー: 品書きの題字＋落款 */
.top{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;flex-shrink:0;border:2px solid var(--lacquer);color:var(--lacquer);border-radius:6px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1;transform:rotate(-4deg)}
.top h1{font-size:1.45rem}
.top .date{font-size:.8rem;color:var(--muted);letter-spacing:.12em}

/* 見出し */
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-direction:column;gap:2px}
.sec-head h2{font-size:1.3rem}
.sec-head h3{font-size:1.08rem}
.sec-head .hint{font-size:.8rem;color:var(--muted)}
.sec-head.split{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label{font-size:.72rem;letter-spacing:.16em;color:var(--muted);font-weight:700}

/* ボタン */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5rem 1rem;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;transition:background .15s,border-color .15s,transform .1s;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.yolk{background:var(--yolk);border-color:var(--yolk);color:#231800;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.sm{min-height:34px;padding:.25rem .75rem;font-size:.8rem}
.btn.danger{color:var(--danger)}
.btn.wide{flex:1 1 auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* チップ */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .85rem;font-size:.84rem;display:inline-flex;align-items:center;gap:.35rem;min-height:36px;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.yolk[aria-pressed="true"]{background:var(--yolk);border-color:var(--yolk);color:#231800}
.chip .x{border:0;background:transparent;padding:0 0 0 .1rem;font-size:1rem;line-height:1;color:inherit;opacity:.7}
.chip.have{background:var(--accent-soft);border-color:transparent}
.badge{display:inline-block;font-size:.7rem;padding:.02rem .5rem;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-right:4px;vertical-align:1px;white-space:nowrap}
.badge.fav{background:var(--yolk-soft);color:var(--yolk-ink)}
.badge.new{background:var(--accent-soft);color:var(--accent)}

/* お膳 */
.tray{
    background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%);
    border-radius:18px;padding:18px 14px 16px;box-shadow:inset 0 0 0 2px var(--tray-edge),inset 0 0 0 7px var(--tray),inset 0 0 0 8px rgba(255,255,255,.06),0 14px 30px rgba(20,12,8,.25);
    display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"side main" "rice soup";gap:14px 10px;color:var(--tray-ink)
}
.spot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.spot.side{grid-area:side;justify-content:flex-end}.spot.main{grid-area:main}.spot.rice{grid-area:rice}.spot.soup{grid-area:soup}
.vessel{position:relative;aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--porcelain);transition:transform .2s ease;max-width:100%}
.vessel:hover{transform:translateY(-2px) scale(1.02)}
.vessel .food{position:absolute;border-radius:47% 53% 50% 50%/55% 45% 55% 45%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.4),transparent 42%),var(--food,#a8652b);background-size:cover;background-position:center}
.vessel .food.photo{border-radius:50%;background-image:var(--img)}
.v-plate{width:92%;box-shadow:inset 0 0 0 6px var(--porcelain),inset 0 0 0 8px var(--rim),inset 0 -8px 18px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.45)}
.v-plate .food{inset:20%}.v-plate .food.photo{inset:11%}
.v-donburi{width:92%;background:repeating-conic-gradient(var(--rim) 0 5deg,var(--porcelain) 5deg 15deg);box-shadow:0 8px 16px rgba(0,0,0,.45)}
.v-donburi::before{content:"";position:absolute;inset:7%;border-radius:50%;background:var(--porcelain)}
.v-donburi .food{inset:14%}
.v-donburi.noodle .food:not(.photo){background:repeating-linear-gradient(35deg,rgba(255,255,255,.45) 0 2px,transparent 2px 6px),var(--food)}
.v-kobachi{width:68%;background:radial-gradient(circle,var(--celadon) 0 62%,var(--celadon-dark) 63% 100%);box-shadow:0 6px 12px rgba(0,0,0,.45)}
.v-kobachi .food{inset:22%}.v-kobachi .food.photo{inset:14%}
.v-wan{width:72%;background:var(--lacquer);box-shadow:inset 0 0 0 5px var(--lacquer-dark),0 6px 12px rgba(0,0,0,.5)}
.v-wan .food{inset:13%;border-radius:50%}
.v-chawan{width:62%;box-shadow:inset 0 0 0 4px var(--porcelain),inset 0 0 0 6px var(--rim),inset 0 0 0 9px var(--porcelain),inset 0 0 0 10px var(--rim),0 6px 12px rgba(0,0,0,.45)}
.v-chawan .food{inset:17%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 1.5px,transparent 2px) 0 0/7px 7px,radial-gradient(circle at 70% 60%,#e9e3d3 0 1.5px,transparent 2px) 0 0/9px 9px,var(--rice)}
.v-konomono{width:50%;border-radius:14%;box-shadow:inset 0 0 0 3px var(--porcelain),inset 0 0 0 4px var(--rim),0 5px 10px rgba(0,0,0,.45)}
.v-konomono .food{inset:26%;border-radius:4px;background:repeating-linear-gradient(90deg,#e7c34a 0 7px,#d9af2a 7px 8px)}
.spot-label{display:flex;flex-direction:column;gap:0;min-width:0;max-width:100%}
.spot-label .slot{font-size:.66rem;letter-spacing:.2em;color:var(--tray-muted)}
.spot-label .nm{font-family:var(--font-display);font-weight:700;font-size:.98rem;line-height:1.35;overflow-wrap:anywhere}
.spot-label .mt{font-size:.7rem;color:var(--tray-muted)}
.spot-label .last{font-size:.66rem;color:#f0c874}
.swap-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.swap-row .btn{min-height:38px;font-size:.78rem;padding:.25rem .3rem}
.credit{font-size:.7rem;color:var(--muted)}

/* ひとひねり: 短冊 */
.tanzaku{display:grid;grid-template-columns:34px 1fr;background:var(--yolk-soft);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tanzaku .band{background:var(--yolk);color:#231800;writing-mode:vertical-rl;font-family:var(--font-display);font-weight:700;letter-spacing:.3em;display:flex;align-items:center;justify-content:center;font-size:.85rem;padding-block:12px}
.tanzaku .body{padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tw-item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding-block:10px;border-top:1px dashed color-mix(in srgb,var(--yolk) 55%,transparent)}
.tw-item:first-child{border-top:0;padding-top:0}
.thumb{width:64px;height:64px;border-radius:50%;background:var(--surface-2);background-size:cover;background-position:center;box-shadow:inset 0 0 0 3px var(--porcelain),0 2px 6px rgba(0,0,0,.15);flex-shrink:0;position:relative}
.thumb.none{background:radial-gradient(circle,var(--food,#a8652b) 0 36%,var(--porcelain) 37%)}
.tw-name{font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.4;cursor:pointer;color:var(--ink)}
.from{font-size:.78rem;color:var(--muted)}
.changes{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.changes li{font-size:.72rem;background:var(--surface);border-radius:999px;padding:.05rem .55rem;color:var(--yolk-ink);border:1px solid color-mix(in srgb,var(--yolk) 40%,transparent)}

/* リスト */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500;cursor:pointer;min-width:0}
.item .t:hover{color:var(--accent)}
.item .s{font-size:.76rem;color:var(--muted);font-weight:400}
.empty{padding:18px 14px;color:var(--muted);font-size:.88rem}
.note{font-size:.85rem;background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* 入力 */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:.8rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .75rem;width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
.inputbar{display:grid;grid-template-columns:1fr auto auto;gap:8px}
@media (max-width:420px){.inputbar{grid-template-columns:1fr auto}.inputbar #mic-btn{grid-column:1/-1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted);cursor:pointer}
.check input{margin-top:.3rem;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}

/* 材料マッチ */
.match{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.match:first-child{border-top:0}
.match .thumb{width:52px;height:52px;cursor:pointer}
.match .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.match .head{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.match .head .name{font-family:var(--font-display);font-weight:700;font-size:1rem}
.meter{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;width:64px;flex-shrink:0}
.meter i{display:block;height:100%;background:var(--accent)}
.ings{font-size:.8rem;color:var(--muted);line-height:1.8}
.ings b{color:var(--accent);font-weight:700}
.ings .miss{color:var(--danger)}
.ings .sub{color:var(--yolk-ink);background:var(--yolk-soft);border-radius:4px;padding:0 .25rem}

/* 週プラン */
.week .item{grid-template-columns:48px 1fr auto}
.day{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.day .dd{font-family:var(--font-display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.day .wd{font-size:.68rem;color:var(--muted)}
.day.sun .wd,.day.sun .dd{color:var(--sun)}.day.sat .wd,.day.sat .dd{color:var(--sat)}
.day.today .dd{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* 統計 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.stat .n{font-family:var(--font-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:.72rem;color:var(--muted)}

details.box{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0 14px}
details.box>summary{padding:14px 0;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:'＋';color:var(--muted)}
details.box[open]>summary::after{content:'－'}
details.box .inner{padding-bottom:14px;display:flex;flex-direction:column;gap:12px}

/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:520px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:.35rem 0;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
nav.tabs button[aria-selected="true"] svg{stroke-width:2}

/* 詳細シート */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
.sheet>*{flex-shrink:0}
.hero{position:relative;background:var(--tray);min-height:120px}
.hero img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.hero .noimg{display:grid;place-items:center;padding:28px 0}
.hero .noimg .vessel{width:150px}
.hero .close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;min-height:36px;padding:.2rem .9rem;font-size:.8rem}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.66rem;line-height:1.4}
.hero .cap a{color:#fff}
.sheet-body{padding:18px 16px 0;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:1.5rem}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;background:var(--surface)}
.recipe-ings{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.recipe-ings li{display:flex;justify-content:space-between;gap:10px;padding:.55rem .9rem;border-top:1px dashed var(--line);font-size:.92rem}
.recipe-ings li:first-child{border-top:0}
.recipe-ings li.add{background:var(--yolk-soft)}
.recipe-ings li .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.recipe-ings li .ok{color:var(--accent);font-weight:700;margin-right:.3rem}
.seasoning{font-size:.86rem;color:var(--muted);background:var(--surface);border-radius:var(--r);padding:.7rem .9rem;box-shadow:var(--shadow)}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.9rem;margin-top:1px}
.steps li.add{background:var(--yolk-soft);border-radius:10px;padding:.35rem .5rem .35rem .35rem}
.steps li.add::before{background:var(--yolk);color:#231800}
.confirm{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:.55rem 1.1rem;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.muted{color:var(--muted)}
.small{font-size:.8rem}
/* 料理イラスト */
.vessel .food.svg{background:none;border-radius:0;overflow:visible}
.vessel .food.svg svg,.thumb svg,.hero .noimg svg{width:100%;height:100%;display:block}
.v-plate .food.svg{inset:9%}.v-donburi .food.svg{inset:10%}.v-kobachi .food.svg{inset:12%}.v-wan .food.svg{inset:11%}
.thumb.svg{background:var(--porcelain);overflow:hidden}
.thumb.svg svg{transform:scale(1.08)}
.hero.illust{background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%)}
/* あいさつ */
.greet{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.greet .mark{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--accent)}
.greet .hello{font-family:var(--font-display);font-weight:700;font-size:1rem}
.greet .line{font-size:.86rem;color:var(--muted);line-height:1.6}
/* ひと手間 */
.skill{display:grid;grid-template-columns:34px 1fr;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.skill .band{background:var(--accent);color:var(--accent-ink);writing-mode:vertical-rl;font-family:var(--font-display);font-weight:700;letter-spacing:.18em;display:flex;align-items:center;justify-content:center;font-size:.85rem;padding-block:12px}
.skill.done .band{background:var(--yolk);color:#231800}
.skill .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.skill .add{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.skill .plus{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.9rem;margin-right:6px;vertical-align:2px}
.skill .why{font-size:.86rem}
.skill .how{font-size:.82rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:.45rem .6rem}
.skill .how b{color:var(--ink)}
/* 買い足し提案 */
.hint-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.hint-row:first-child{border-top:0}
.hint-row .k{font-family:var(--font-display);font-weight:700;font-size:1rem;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:.15rem .6rem;white-space:nowrap}
.hint-row .v{font-size:.8rem;color:var(--muted)}
.hint-row .v b{color:var(--ink)}
/* ふりかえり・称号 */
.review{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.review p{margin:0;font-family:var(--font-display);font-weight:700;font-size:1rem;line-height:1.6}
.review .stat{box-shadow:none;background:var(--surface-2)}
.titles{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.title-row{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.title-row:first-child{border-top:0}
.title-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.title-name{font-weight:700}
.title-lv{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.title-foot{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.toast.praise{border-radius:14px;padding:.8rem 1.1rem;font-family:var(--font-display);font-weight:700;font-size:.95rem;line-height:1.5}

@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.pop{animation:rise .28s ease-out}
.tray .vessel{animation:rise .35s ease-out backwards}
.tray .spot.main .vessel{animation-delay:.04s}.tray .spot.rice .vessel{animation-delay:.08s}.tray .spot.soup .vessel{animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
'use strict';
/* =========================================================
   レシピデータ（2人分）
   材料は「名前 分量」。末尾に ? を付けたものは「なくても作れる」扱い。
   ========================================================= */
const RECIPES = [];
function R(id, name, genre, type, method, min, ings, seas, steps){
    RECIPES.push({id, name, genre, type, method, min, ings: ings.split('|'), seas, steps: steps.split('|')});
}
// ---- 主菜 ----
R('nikujaga','肉じゃが','和','主菜','煮',30,'豚こま切れ肉 200g|じゃがいも 3個|玉ねぎ 1個|にんじん 1本|しらたき 1袋?','だし 300ml・醤油 大さじ3・砂糖 大さじ2・みりん 大さじ2・酒 大さじ2・サラダ油 大さじ1','じゃがいもは大きめの一口大、玉ねぎはくし切り、にんじんは乱切りにする。しらたきは下ゆでして食べやすく切る。|鍋に油を熱して豚肉を炒め、色が変わったら野菜としらたきを加えて全体に油を回す。|だし・砂糖・酒・みりんを加え、落としぶたをして中火で10分煮る。|醤油を加えてさらに10分、じゃがいもが柔らかくなるまで煮る。火を止めて少しおくと味がしみる。');
R('shogayaki','豚の生姜焼き','和','主菜','焼',15,'豚ロース薄切り肉 250g|玉ねぎ 1/2個|キャベツ 1/8個?','おろし生姜 小さじ2・醤油 大さじ2・みりん 大さじ2・酒 大さじ1・サラダ油 小さじ2','キャベツは千切りにして器に盛る。玉ねぎは薄切りにする。|生姜・醤油・みりん・酒を混ぜてタレを作る。|フライパンに油を熱し、豚肉を広げて両面を焼き、玉ねぎも加えて炒める。|タレを回し入れ、からめながら照りが出るまで煮詰める。');
R('karaage','鶏の唐揚げ','和','主菜','揚',30,'鶏もも肉 2枚（500g）|レモン 1/4個?','醤油 大さじ2・酒 大さじ1・おろしにんにく 小さじ1・おろし生姜 小さじ1・片栗粉 大さじ5・揚げ油 適量','鶏肉は一口大に切り、醤油・酒・にんにく・生姜をもみ込んで15分おく。|汁気を軽く切って片栗粉をまぶす。|170℃の油で3分揚げていったん取り出し、3分休ませる。|190℃に上げて1分、カラッと二度揚げする。');
R('teriyaki','照り焼きチキン','和','主菜','焼',20,'鶏もも肉 1枚（300g）|ブロッコリー 1/2株?','醤油 大さじ2・みりん 大さじ2・砂糖 小さじ1・酒 大さじ1・サラダ油 小さじ1','鶏肉は厚い部分を開き、フォークで皮に穴をあける。ブロッコリーは塩ゆでする。|フライパンに皮目を下にして入れ、中火で6分、皮がパリッとするまで焼く。|裏返してふたをし、弱火で5分蒸し焼きにする。|余分な脂を拭き取り、調味料を加えて煮からめる。切り分けてブロッコリーを添える。');
R('hamburg','ハンバーグ','洋','主菜','焼',30,'合いびき肉 300g|玉ねぎ 1/2個|卵 1個|パン粉 大さじ4?|牛乳 大さじ3?','塩 小さじ1/3・こしょう 少々・ナツメグ 少々・ケチャップ 大さじ3・中濃ソース 大さじ2・サラダ油 小さじ1','玉ねぎはみじん切りにして炒め、冷ます。パン粉は牛乳に浸す。|ひき肉に塩を入れて粘りが出るまでこね、玉ねぎ・卵・パン粉・こしょう・ナツメグを加えて混ぜる。|2等分して空気を抜きながら小判形にし、中央をくぼませる。|中火で両面に焼き色をつけ、ふたをして弱火で8分蒸し焼き。残った肉汁にケチャップとソースを加えて煮立て、ソースにする。');
R('stew','クリームシチュー','洋','主菜','煮',35,'鶏もも肉 250g|じゃがいも 2個|玉ねぎ 1個|にんじん 1本|ブロッコリー 1/2株?|牛乳 200ml|シチュールウ 1/2箱','水 400ml・サラダ油 大さじ1','鶏肉と野菜を一口大に切る。ブロッコリーは小房に分けて下ゆでする。|鍋に油を熱して鶏肉を炒め、玉ねぎ・にんじん・じゃがいもを加えて炒める。|水を加え、アクを取りながら15分煮る。|火を止めてルウを溶かし、牛乳を加えて弱火で5分煮る。ブロッコリーを加える。');
R('mapo','麻婆豆腐','中','主菜','炒',20,'木綿豆腐 1丁|豚ひき肉 150g|長ねぎ 1/2本','豆板醤 小さじ1・甜麺醤 大さじ1・おろしにんにく 小さじ1/2・おろし生姜 小さじ1/2・鶏ガラスープの素 小さじ1・水 150ml・醤油 小さじ2・水溶き片栗粉 大さじ2・ごま油 小さじ1','豆腐は2cm角に切って塩少々を入れた湯で2分ゆで、ざるに上げる。長ねぎはみじん切りにする。|フライパンでひき肉をカリッとするまで炒め、豆板醤・甜麺醤・にんにく・生姜を加えて香りを出す。|水・鶏ガラスープの素・醤油を加えて煮立て、豆腐を入れて3分煮る。|長ねぎを加え、水溶き片栗粉でとろみをつけ、ごま油を回しかける。');
R('hoikoro','回鍋肉','中','主菜','炒',15,'豚バラ薄切り肉 200g|キャベツ 1/4個|ピーマン 2個','甜麺醤 大さじ1.5・豆板醤 小さじ1/2・醤油 小さじ1・酒 大さじ1・おろしにんにく 小さじ1/2・サラダ油 小さじ1','キャベツはざく切り、ピーマンは乱切り、豚肉は4cm幅に切る。調味料は混ぜておく。|豚肉を炒めて脂を出し、いったん取り出す。|同じフライパンでキャベツとピーマンを強火でさっと炒める。|豚肉を戻し、合わせ調味料を加えて手早くからめる。');
R('chinjao','青椒肉絲','中','主菜','炒',15,'豚もも薄切り肉 200g|ピーマン 4個|たけのこ水煮 100g?','醤油・酒・片栗粉 各小さじ1（下味）・オイスターソース 大さじ1・醤油 小さじ1・砂糖 小さじ1/2・ごま油 小さじ1・サラダ油 大さじ1','豚肉・ピーマン・たけのこは細切りにする。豚肉に下味をもみ込む。|油を熱して豚肉をほぐしながら炒め、色が変わったら取り出す。|ピーマンとたけのこを強火で1分炒める。|豚肉を戻し、オイスターソース・醤油・砂糖で味をつけ、ごま油で香りづけする。');
R('gyoza','焼き餃子','中','主菜','焼',40,'豚ひき肉 150g|キャベツ 1/8個|ニラ 1/2束|餃子の皮 24枚','醤油 小さじ2・酒 小さじ1・ごま油 小さじ2・おろし生姜 小さじ1・おろしにんにく 小さじ1/2・塩 少々・サラダ油 大さじ1','キャベツはみじん切りにして塩少々でもみ、水気を絞る。ニラは細かく刻む。|ひき肉と調味料をよく練り、野菜を混ぜてあんを作る。|皮にあんをのせ、ふちに水をつけてひだを寄せながら包む。|油を熱して餃子を並べ、焼き色がついたら水50mlを入れてふたをし、水気がなくなるまで蒸し焼きにする。最後にごま油少々を回してパリッと焼く。');
R('meuniere','鮭のムニエル','洋','主菜','焼',15,'生鮭 2切れ|レモン 1/4個?','塩 少々・こしょう 少々・小麦粉 大さじ1・バター 15g・サラダ油 小さじ1','鮭に塩をふって10分おき、出てきた水気を拭く。|こしょうをふり、小麦粉を薄くまぶす。|油とバター半量を熱し、盛りつける面から中火で3分焼き、裏返して2分焼く。|残りのバターを加えて溶かし、スプーンで鮭にかけながら仕上げる。レモンを添える。');
R('sabamiso','さばの味噌煮','和','主菜','煮',25,'さば 2切れ|生姜 1かけ?','水 150ml・酒 50ml・味噌 大さじ2・砂糖 大さじ1.5・みりん 大さじ1・醤油 小さじ1','さばは皮に切り目を入れ、熱湯を回しかけて臭みを取る。生姜は薄切りにする。|鍋に水・酒・砂糖・生姜を煮立て、さばを皮目を上にして入れる。|落としぶたをして中火で8分煮る。|煮汁で溶いた味噌とみりん・醤油を加え、煮汁をかけながら5分、とろりとするまで煮詰める。');
R('buriteri','ぶりの照り焼き','和','主菜','焼',20,'ぶり 2切れ|ししとう 6本?','醤油 大さじ2・みりん 大さじ2・酒 大さじ1・砂糖 小さじ1・小麦粉 少々・サラダ油 小さじ1','ぶりに塩少々をふって10分おき、水気を拭いて小麦粉を薄くまぶす。|油を熱し、ぶりを両面こんがり焼く。ししとうも一緒に焼いて取り出す。|余分な油を拭き取り、調味料を加えて煮立てる。|ぶりにタレをからめ、照りが出たら盛りつけてししとうを添える。');
R('nanban','チキン南蛮','和','主菜','揚',30,'鶏むね肉 1枚|卵 2個|玉ねぎ 1/4個|キャベツ 1/8個?','小麦粉 大さじ2・酢 大さじ3・砂糖 大さじ2・醤油 大さじ2・マヨネーズ 大さじ4・揚げ油 適量','卵1個はゆで卵にして刻み、玉ねぎのみじん切り・マヨネーズと混ぜてタルタルソースを作る。|鶏肉はそぎ切りにして塩こしょうし、小麦粉をまぶして残りの溶き卵にくぐらせる。|多めの油で両面を揚げ焼きにする。|酢・砂糖・醤油を煮立てた甘酢に熱いうちにくぐらせ、タルタルをかける。千切りキャベツを添える。');
R('butakimu','豚キムチ炒め','韓','主菜','炒',10,'豚バラ薄切り肉 200g|白菜キムチ 150g|玉ねぎ 1/2個|ニラ 1/2束?','醤油 小さじ1・みりん 小さじ1・ごま油 大さじ1','豚肉は4cm幅、玉ねぎは薄切り、ニラは4cm長さに切る。|ごま油で豚肉を炒め、色が変わったら玉ねぎを加える。|キムチを加えて炒め合わせ、醤油・みりんで味をととのえる。|ニラを入れてさっと炒め、火を止める。');
R('japchae','チャプチェ','韓','主菜','炒',20,'牛こま切れ肉 150g|春雨 50g|ピーマン 2個|にんじん 1/3本|しいたけ 3枚?','醤油 大さじ2・砂糖 大さじ1・ごま油 大さじ1・おろしにんにく 小さじ1/2・白ごま 少々','春雨はゆでて食べやすく切る。野菜は細切りにする。|ごま油で牛肉を炒め、野菜を加えてしんなりするまで炒める。|春雨・醤油・砂糖・にんにくを加え、汁気がなくなるまで炒め合わせる。|白ごまをふる。');
R('ebichili','エビチリ','中','主菜','炒',20,'むきえび 200g|長ねぎ 1/2本','片栗粉 大さじ1・酒 小さじ1・ケチャップ 大さじ3・豆板醤 小さじ1/2・鶏ガラスープの素 小さじ1/2・水 100ml・砂糖 小さじ1・おろしにんにく/生姜 各小さじ1/2・水溶き片栗粉 大さじ1・サラダ油 大さじ1','えびは背わたを取り、片栗粉と水少々でもみ洗いして水気を拭く。酒と片栗粉少々をまぶす。|油でえびを両面焼いて取り出す。|にんにく・生姜・豆板醤を炒め、ケチャップ・鶏ガラスープの素・水・砂糖を加えて煮立てる。|えびとみじん切りの長ねぎを戻し、水溶き片栗粉でとろみをつける。');
R('happosai','八宝菜','中','主菜','炒',20,'豚こま切れ肉 150g|白菜 1/8個|にんじん 1/3本|しいたけ 3枚|うずらの卵（水煮） 6個?','鶏ガラスープの素 小さじ2・水 200ml・オイスターソース 大さじ1・醤油 小さじ1・酒 大さじ1・水溶き片栗粉 大さじ2・ごま油 小さじ1','白菜はそぎ切り、にんじんは短冊切り、しいたけは薄切りにする。|油で豚肉を炒め、にんじん・白菜の芯・しいたけを加えて炒める。|白菜の葉・うずらの卵・水と調味料を加えて3分煮る。|水溶き片栗粉でとろみをつけ、ごま油をたらす。');
R('chanchan','鮭のちゃんちゃん焼き','和','主菜','焼',20,'生鮭 2切れ|キャベツ 1/6個|玉ねぎ 1/2個|にんじん 1/3本?|しめじ 1/2パック?','味噌 大さじ2・みりん 大さじ1・酒 大さじ1・砂糖 小さじ1・バター 15g','キャベツはざく切り、玉ねぎは薄切り、にんじんは短冊切り、しめじはほぐす。|味噌・みりん・酒・砂糖を混ぜる。|フライパンに野菜を広げ、中央に鮭をのせて合わせ味噌をかける。|ふたをして中弱火で10分蒸し焼きにし、バターをのせて崩しながら混ぜる。');
R('champuru','ゴーヤチャンプルー','和','主菜','炒',15,'ゴーヤ 1/2本|木綿豆腐 1/2丁|豚バラ薄切り肉 120g|卵 2個','醤油 小さじ2・かつお節 1パック・塩 少々・ごま油 大さじ1','ゴーヤは種とわたを取って薄切りにし、塩少々でもんで5分おき、水気を絞る。豆腐は水切りする。|ごま油で豆腐を手でちぎって焼き色をつけ、取り出す。|豚肉とゴーヤを炒め、豆腐を戻して醤油で味をつける。|溶き卵を回し入れてざっくり混ぜ、かつお節をふる。');
R('reishabu','冷しゃぶサラダ','和','主菜','和え',15,'豚しゃぶしゃぶ用肉 200g|レタス 3枚|トマト 1個|きゅうり 1本?','酒 少々・ポン酢 大さじ3・ごま油 小さじ1','野菜を食べやすく切って器に盛る。|沸騰直前（80℃くらい）の湯に酒を入れ、豚肉を1枚ずつ広げて色が変わるまでゆでる。|ざるに上げて自然に冷ます（氷水に入れると固くなる）。|野菜の上に盛り、ポン酢とごま油を合わせてかける。');
R('atsuage','厚揚げと豚肉の味噌炒め','和','主菜','炒',15,'厚揚げ 1枚|豚こま切れ肉 150g|キャベツ 1/6個|ピーマン 2個?','味噌 大さじ1.5・みりん 大さじ1・酒 大さじ1・砂糖 小さじ1・醤油 小さじ1・サラダ油 小さじ2','厚揚げは熱湯をかけて油抜きし、一口大に切る。キャベツはざく切り、ピーマンは乱切りにする。|調味料を混ぜておく。|油で豚肉を炒め、厚揚げを加えて焼き色をつける。|野菜を加えて炒め、合わせ調味料を回し入れてからめる。');
R('gratin','マカロニグラタン','洋','主菜','焼',35,'マカロニ 80g|鶏もも肉 150g|玉ねぎ 1/2個|しめじ 1/2パック?|牛乳 400ml|ピザ用チーズ 50g','バター 30g・小麦粉 大さじ3・コンソメ 小さじ1・塩 こしょう 少々・パン粉 少々','マカロニは表示どおりゆでる。鶏肉は一口大、玉ねぎは薄切りにする。|バターで鶏肉・玉ねぎ・しめじを炒め、小麦粉をふり入れて粉っぽさがなくなるまで炒める。|牛乳を少しずつ加えて混ぜ、コンソメ・塩・こしょうを入れてとろみがつくまで煮る。マカロニを混ぜる。|耐熱皿に入れてチーズとパン粉をのせ、トースターで焼き色がつくまで10分焼く。');
R('negishio','鶏むね肉のねぎ塩焼き','中','主菜','焼',15,'鶏むね肉 1枚|長ねぎ 1本|レモン 1/4個?','片栗粉 大さじ1・酒 小さじ1・ごま油 大さじ2・鶏ガラスープの素 小さじ1/2・塩 小さじ1/4・黒こしょう 少々','長ねぎはみじん切りにし、ごま油大さじ1・鶏ガラスープの素・塩・黒こしょうと混ぜてねぎ塩だれを作る。|鶏肉はそぎ切りにして酒をもみ込み、片栗粉をまぶす。|残りのごま油で鶏肉を両面焼き、ふたをして弱火で3分蒸し焼きにする。|器に盛ってねぎ塩だれをのせ、レモンを添える。');
R('subuta','酢豚','中','主菜','揚',30,'豚肩ロース肉 250g|玉ねぎ 1/2個|ピーマン 2個|にんじん 1/2本?','醤油・酒 各小さじ1（下味）・片栗粉 大さじ2・ケチャップ 大さじ2・酢 大さじ2・砂糖 大さじ2・醤油 大さじ1・水 大さじ4・片栗粉 小さじ1・揚げ油 適量','豚肉は一口大に切って下味をもみ込み、片栗粉をまぶす。野菜は乱切りにし、にんじんは下ゆでする。|甘酢の材料（ケチャップ・酢・砂糖・醤油・水・片栗粉）を混ぜておく。|多めの油で豚肉をカリッと揚げ焼きにし、野菜もさっと炒める。|甘酢を加えて手早く混ぜ、とろみとつやが出たら火を止める。');
R('rollcabbage','ロールキャベツ','洋','主菜','煮',50,'キャベツ 6枚|合いびき肉 250g|玉ねぎ 1/2個|卵 1個?|ベーコン 2枚?','パン粉 大さじ3・塩 こしょう 少々・コンソメ 小さじ2・水 500ml・ローリエ 1枚','キャベツの葉は芯をそいでゆで、しんなりさせる。|ひき肉・みじん切りの玉ねぎ・卵・パン粉・塩・こしょうを練り、6等分する。|キャベツでたねを包み、巻き終わりを下にして鍋にすき間なく並べる。|ベーコン・水・コンソメ・ローリエを加え、落としぶたをして弱火で30分煮る。');
R('chikuzen','筑前煮','和','主菜','煮',40,'鶏もも肉 1枚|れんこん 100g|ごぼう 1/2本|にんじん 1/2本|こんにゃく 1/2枚?|しいたけ 3枚?','だし 200ml・醤油 大さじ2.5・砂糖 大さじ1.5・みりん 大さじ2・酒 大さじ2・サラダ油 大さじ1','鶏肉と野菜は一口大の乱切りにする。こんにゃくはちぎって下ゆでする。|油で鶏肉を炒め、野菜とこんにゃくを加えて全体に油を回す。|だし・酒・砂糖を加え、落としぶたをして10分煮る。|醤油・みりんを加え、煮汁が少なくなるまで鍋をゆすりながら煮からめる。');
R('buridaikon','ぶり大根','和','主菜','煮',45,'ぶり 2切れ|大根 1/3本|生姜 1かけ?','水 400ml・酒 100ml・醤油 大さじ3・砂糖 大さじ2・みりん 大さじ2','大根は2cm厚さの半月切りにし、米のとぎ汁（または水）で15分下ゆでする。|ぶりは熱湯を回しかけて臭みを取る。|鍋に水・酒・砂糖・生姜を煮立て、大根とぶりを入れて落としぶたで10分煮る。|醤油・みりんを加え、ときどき煮汁をかけながらさらに15分煮る。');
R('okonomi','お好み焼き','和','主菜','焼',25,'キャベツ 1/4個|豚バラ薄切り肉 100g|卵 2個|天かす 大さじ3?','小麦粉 100g・だし 120ml・お好みソース/マヨネーズ/かつお節/青のり 各適量・サラダ油 小さじ2','キャベツは粗みじん切りにする。|小麦粉とだしを混ぜ、卵・キャベツ・天かすを加えてざっくり混ぜる。|油を熱して生地を丸く広げ、豚肉をのせて中火で4分焼く。|裏返してふたをし、弱火で5分焼く。ソース・マヨネーズ・かつお節・青のりをかける。');
R('mabonasu','麻婆なす','中','主菜','炒',20,'なす 3本|豚ひき肉 150g|長ねぎ 1/2本?','豆板醤 小さじ1・甜麺醤 大さじ1・醤油 小さじ2・鶏ガラスープの素 小さじ1・水 120ml・水溶き片栗粉 大さじ1・サラダ油 大さじ2・ごま油 少々','なすは乱切りにし、多めの油で焼いてしんなりさせて取り出す。|ひき肉を炒め、豆板醤・甜麺醤を加えて香りを出す。|水・鶏ガラスープの素・醤油を加えて煮立て、なすを戻して2分煮る。|みじん切りの長ねぎを加え、水溶き片栗粉でとろみをつけ、ごま油をたらす。');

R('curry','カレーライス','洋','ごはん','煮',40,'豚こま切れ肉 200g|じゃがいも 2個|玉ねぎ 2個|にんじん 1本|カレールウ 1/2箱|ご飯 2杯分','水 600ml・サラダ油 大さじ1','野菜と肉を一口大に切る。|鍋に油を熱し、玉ねぎを炒めてしんなりしたら肉・にんじん・じゃがいもを炒める。|水を加えて沸騰したらアクを取り、弱めの中火で15分煮る。|火を止めてルウを溶かし、とろみがつくまで5分煮る。ご飯にかける。');
R('oyakodon','親子丼','和','ごはん','煮',15,'鶏もも肉 200g|玉ねぎ 1/2個|卵 3個|ご飯 2杯分|三つ葉 少々?','だし 150ml・醤油 大さじ2・みりん 大さじ2・砂糖 小さじ1','鶏肉は小さめの一口大、玉ねぎは薄切りにする。|小さめのフライパンにだしと調味料を煮立て、鶏肉と玉ねぎを入れて5分煮る。|溶き卵の2/3を回し入れ、ふたをして30秒。残りを加えて半熟で火を止める。|ご飯にすべらせるようにのせ、三つ葉を散らす。');
R('gyudon','牛丼','和','ごはん','煮',15,'牛こま切れ肉 200g|玉ねぎ 1個|ご飯 2杯分|紅しょうが 適量?','だし 150ml・醤油 大さじ3・みりん 大さじ2・酒 大さじ2・砂糖 大さじ1','玉ねぎは1cm幅のくし切りにする。|鍋にだしと調味料を煮立て、玉ねぎを入れて3分煮る。|牛肉をほぐしながら加え、アクを取って5分煮る。|ご飯に煮汁ごとのせ、紅しょうがを添える。');
R('omurice','オムライス','洋','ごはん','炒',25,'鶏もも肉 100g|玉ねぎ 1/2個|卵 4個|ご飯 2杯分','ケチャップ 大さじ5・バター 20g・塩 こしょう 少々・牛乳 大さじ2','鶏肉は1cm角、玉ねぎはみじん切りにする。|バター半量で鶏肉と玉ねぎを炒め、ケチャップを加えて水分を飛ばし、ご飯を混ぜてケチャップライスにする。|卵2個と牛乳大さじ1を溶き、残りのバター半量で半熟に焼く。|ケチャップライスの半量をのせて包み、皿に返す。もう1人分も同様に作り、ケチャップをかける。');
R('gapao','ガパオライス','エスニック','ごはん','炒',15,'鶏ひき肉 200g|パプリカ 1/2個|玉ねぎ 1/2個|卵 2個|ご飯 2杯分|バジル 10枚?','ナンプラー 大さじ1・オイスターソース 大さじ1・砂糖 小さじ1・おろしにんにく 小さじ1・赤唐辛子 1本・サラダ油 適量','玉ねぎとパプリカは1cm角に切る。|多めの油で卵を焼き、ふちがカリッとした目玉焼きを作る。|にんにくと唐辛子を炒め、ひき肉と野菜を加えて炒め、調味料で味をつける。|バジルをちぎって加えてさっと混ぜ、ご飯に盛って目玉焼きをのせる。');
R('tacorice','タコライス','エスニック','ごはん','炒',15,'合いびき肉 200g|玉ねぎ 1/2個|レタス 3枚|トマト 1個|ピザ用チーズ 40g?|ご飯 2杯分','ケチャップ 大さじ2・中濃ソース 大さじ1・カレー粉 小さじ1・おろしにんにく 小さじ1/2・サラダ油 小さじ1','玉ねぎはみじん切り、レタスは細切り、トマトは角切りにする。|油でにんにくと玉ねぎを炒め、ひき肉を加えてポロポロに炒める。|ケチャップ・ソース・カレー粉で味をつけ、汁気を飛ばす。|ご飯にレタス・ひき肉・チーズ・トマトの順にのせる。');
R('chahan','チャーハン','中','ごはん','炒',10,'ご飯 2杯分|卵 2個|長ねぎ 1/2本|ハム 4枚','鶏ガラスープの素 小さじ1・醤油 小さじ1・塩 こしょう 少々・サラダ油 大さじ2','長ねぎはみじん切り、ハムは1cm角に切る。|油を強火で熱して溶き卵を入れ、すぐにご飯を加えて卵をからめながら炒める。|ハムと長ねぎを加え、ご飯がパラッとするまで炒める。|鶏ガラスープの素・塩・こしょうで味をつけ、鍋肌から醤油を回し入れる。');
R('takikomi','きのこの炊き込みご飯','和','ごはん','炊',60,'米 2合|しめじ 1パック|まいたけ 1パック?|油揚げ 1枚|にんじん 1/3本?','醤油 大さじ2・みりん 大さじ1・酒 大さじ1・塩 小さじ1/3・だし 適量','米は洗ってざるに上げ、30分おく。|しめじ・まいたけはほぐし、油揚げとにんじんは細切りにする。|炊飯器に米と調味料を入れ、だしを2合の目盛りまで注ぐ。|具をのせて普通に炊き、炊き上がったら全体を混ぜる。');
R('napolitan','ナポリタン','洋','麺','炒',20,'スパゲッティ 200g|ウインナー 4本|玉ねぎ 1/2個|ピーマン 2個','ケチャップ 大さじ6・バター 10g・粉チーズ 適量・サラダ油 小さじ2・塩 少々','スパゲッティは表示時間どおりゆでる。|ウインナーは斜め切り、玉ねぎは薄切り、ピーマンは輪切りにする。|油でウインナーと野菜を炒め、ケチャップを加えて酸味を飛ばすように1分炒める。|スパゲッティとバターを加えてからめ、粉チーズをふる。');
R('yakisoba','ソース焼きそば','和','麺','炒',15,'焼きそば麺 2玉|豚こま切れ肉 120g|キャベツ 1/8個|もやし 1/2袋?|にんじん 1/4本?','ウスターソース 大さじ3・中濃ソース 大さじ1・青のり/紅しょうが 適量・サラダ油 大さじ1','キャベツはざく切り、にんじんは短冊切りにする。|油で豚肉を炒め、野菜ともやしを加えて炒める。|麺と水大さじ2を加え、ほぐしながら炒める。|ソースを加えて全体にからめ、青のりと紅しょうがを添える。');
R('carbonara','カルボナーラ','洋','麺','炒',15,'スパゲッティ 200g|ベーコン 80g|卵 2個|粉チーズ 30g','黒こしょう たっぷり・オリーブオイル 小さじ2・塩 適量','ボウルに卵・粉チーズ・黒こしょうを混ぜておく。|スパゲッティを塩を入れた湯でゆでる。|フライパンでベーコンをカリッと炒め、火を止めて少し冷ます。|ゆでたてのスパゲッティとゆで汁大さじ2を加えて混ぜ、卵液を加えて余熱で手早くからめる。');
R('kinokopasta','きのこの和風パスタ','和','麺','炒',15,'スパゲッティ 200g|しめじ 1パック|まいたけ 1パック?|ベーコン 60g?|大葉 4枚?','醤油 大さじ1.5・バター 15g・おろしにんにく 小さじ1/2・オリーブオイル 大さじ1','スパゲッティをゆで始める。きのこはほぐし、ベーコンは1cm幅に切る。|オリーブオイルとにんにくを弱火で熱し、ベーコンときのこを炒める。|ゆでたスパゲッティとゆで汁大さじ3を加えてからめる。|醤油とバターで味をつけ、千切りの大葉をのせる。');
R('nikuudon','肉うどん','和','麺','煮',15,'ゆでうどん 2玉|牛こま切れ肉 150g|長ねぎ 1/2本','だし 700ml・醤油 大さじ3・みりん 大さじ3・砂糖 大さじ1','長ねぎは斜め切りにする。|小鍋に醤油大さじ1・みりん大さじ1・砂糖で牛肉を甘辛く煮る。|残りのだし・醤油・みりんでつゆを作り、うどんを温める。|器にうどんとつゆを入れ、牛肉と長ねぎをのせる。');

R('ohitashi','ほうれん草のおひたし','和','副菜','和え',10,'ほうれん草 1束','だし 大さじ3・醤油 小さじ2・かつお節 適量','ほうれん草は根元に十字の切り込みを入れて洗う。|塩少々を入れた湯で根元から30秒、葉まで入れて30秒ゆでる。|冷水にとって水気を絞り、4cm長さに切る。|だしと醤油を合わせてかけ、かつお節をのせる。');
R('kinpira','きんぴらごぼう','和','副菜','炒',15,'ごぼう 1本|にんじん 1/3本','醤油 大さじ1.5・砂糖 大さじ1・みりん 大さじ1・酒 大さじ1・ごま油 大さじ1・赤唐辛子 少々・白ごま 少々','ごぼうとにんじんは細切りにし、ごぼうは水にさらす。|ごま油と唐辛子を熱し、ごぼう・にんじんを中火で3分炒める。|調味料を加え、汁気がなくなるまで炒める。|白ごまをふる。');
R('potesala','ポテトサラダ','洋','副菜','和え',25,'じゃがいも 3個|きゅうり 1/2本|玉ねぎ 1/4個?|ハム 3枚?','マヨネーズ 大さじ4・酢 小さじ1・塩 こしょう 少々','じゃがいもは皮をむいて一口大に切り、柔らかくなるまでゆでる。|湯を捨てて火にかけ、水分を飛ばして粗くつぶし、熱いうちに酢をふる。|きゅうりと玉ねぎは薄切りにして塩もみし、水気を絞る。ハムは短冊切り。|粗熱が取れたらすべてを合わせ、マヨネーズ・塩・こしょうで和える。');
R('hijiki','ひじきの煮物','和','副菜','煮',25,'芽ひじき（乾燥） 15g|にんじん 1/3本|油揚げ 1枚','だし 150ml・醤油 大さじ1.5・砂糖 大さじ1・みりん 大さじ1・サラダ油 小さじ2','ひじきは水で15分もどし、水気を切る。|にんじんと油揚げは細切りにする。|油でひじき・にんじんを炒め、油揚げを加える。|だしと調味料を加え、汁気がほぼなくなるまで煮る。');

const PANTRY = new Set(['ご飯']);   // いつもある前提のもの
function norm(s){
    return String(s).normalize('NFKC').toLowerCase()
        .replace(/[（(][^）)]*[）)]/g,'')
        .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
        .replace(/[\s　]/g,'');
}
// 長い表記から順に照合する（「たまねぎ」を「ねぎ」より先に、「牛乳」を「牛」より先に）
const VARIANTS = [];
CANON.forEach(([c, vs], order) => vs.forEach(v => VARIANTS.push({c, v: norm(v), order})));
VARIANTS.sort((a,b) => b.v.length - a.v.length || a.order - b.order);
function canonOf(name){
    const n = norm(name);
    for (const {c, v} of VARIANTS) if (n.includes(v)) return c;
    return null;
}
function keyOf(name){ return canonOf(name) || norm(name); }
function labelOf(name){ return canonOf(name) || String(name).replace(/[（(][^）)]*[）)]/g,'').trim(); }
// 自由入力（「豚肉と玉ねぎとキャベツ」など）から食材を取り出す
function extractIngredients(text){
    const out = [];
    String(text).split(/[、,，。・\/\n]+|\s+/).forEach(tok => {
        tok = tok.trim(); if (!tok) return;
        let t = norm(tok); const found = [];
        for (const {c, v} of VARIANTS){
            if (t.includes(v)){ found.push(c); t = t.split(v).join('｜'); }
        }
        if (found.length) found.forEach(c => { if (!out.includes(c)) out.push(c); });
        else if (tok.length <= 12 && !out.includes(tok)) out.push(tok);
    });
    return out;
}
function parseIng(s){
    const opt = s.endsWith('?'); if (opt) s = s.slice(0,-1);
    const i = s.indexOf(' ');
    const name = i < 0 ? s : s.slice(0,i), qty = i < 0 ? '' : s.slice(i+1);
    return {name, qty, opt, key: keyOf(name), label: labelOf(name)};
}

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ymd(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function daysBetween(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const WD = ['日','月','火','水','木','金','土'];
function jpDate(s){ const d = parseYmd(s); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
const TODAY = ymd();
function byId(id){ return RECIPES.find(r => r.id === id) || (String(id).startsWith('a~') ? buildTwist(id) : null); }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg, praise=false){
    const root = $('#toast-root'); root.innerHTML = `<div class="toast pop${praise?' praise':''}" role="status">${esc(msg)}</div>`;
    clearTimeout(toast.t); toast.t = setTimeout(() => root.innerHTML = '', praise ? 4200 : 2400);
}
// 最後に食べた日からの日数（食べていなければ Infinity）
function daysSince(id){
    let best = Infinity;
    for (const h of S.history) if (h.id === id){ const d = daysBetween(h.d, TODAY); if (d >= 0 && d < best) best = d; }
    return best;
}
function lastLabel(id){
    const d = daysSince(id);
    if (d === Infinity) return '';
    return d === 0 ? '今日作った' : `${d}日前に作った`;
}
function recentMainFamilies(days){
    const res = [];
    for (let i = 0; i <= days; i++){
        const d = addDays(TODAY, -i);
        S.history.filter(h => h.d === d && h.slot === '主菜').forEach(h => { const r = byId(h.id); if (r) res.push({ago:i, family:r.family, genre:r.genre}); });
    }
    return res;
}
function fridgeKeys(){ return new Set([...S.fridge, ...S.staples].map(keyOf)); }

/* =========================================================
   材料マッチ
   ========================================================= */
function matchRecipe(r, have){
    const req = r.items.filter(i => !i.opt && !PANTRY.has(i.key));
    const got = [], miss = [], subs = [];
    req.forEach(i => {
        if (have.has(i.key)) got.push(i);
        else {
            const alt = (SUBS[i.key]||[]).find(k => have.has(k));
            if (alt) subs.push({i, alt}); else miss.push(i);
        }
    });
    const optGot = r.items.filter(i => i.opt && have.has(i.key));
    const ratio = req.length ? (got.length + subs.length*0.6) / req.length : 0;
    return {r, got, miss, subs, optGot, ratio, used: got.length + subs.length + optGot.length};
}

/* =========================================================
   献立の提案（同じ料理が続かない仕組み）
   - 決まった日数以内に作った料理は候補から外す
   - その倍の期間内なら点数を下げる
   - 前日・直近の主菜と同じ肉・魚、同じジャンルは点数を下げる
   - 「今は出さない」にした料理は出さない
   ========================================================= */
let session = {rejected:new Set(), mood:'all', useFridge:false, menu:null, twist:null};
const MOODS = [
    {k:'all', label:'おまかせ'}, {k:'quick', label:'20分以内'}, {k:'和', label:'和食'}, {k:'洋', label:'洋食'},
    {k:'中', label:'中華'}, {k:'asia', label:'韓国・エスニック'}, {k:'fish', label:'魚の日'}, {k:'meat', label:'がっつり肉'},
];
function moodOk(r, mood){
    switch(mood){
        case 'quick': return r.min <= 20;
        case 'asia': return r.genre === '韓' || r.genre === 'エスニック';
        case 'fish': return ['魚','魚介'].includes(r.family);
        case 'meat': return ['豚','鶏','牛','ひき肉'].includes(r.family);
        case '和': case '洋': case '中': return r.genre === mood;
        default: return true;
    }
}
function scoreRecipe(r, ctx){
    if (S.hidden.includes(r.id) || session.rejected.has(r.id)) return -Infinity;
    const avoid = S.settings.avoidDays;
    const ds = daysSince(r.id);
    if (ds < avoid && !ctx.relax) return -Infinity;
    let s = 1;
    if (ds < avoid*2) s -= 0.35 * (1 - (ds - avoid) / avoid);
    if (ds === Infinity) s += 0.1;
    if (S.favs.includes(r.id)) s += 0.3;
    if (ctx.recent){
        ctx.recent.forEach(x => {
            if (x.family === r.family && r.family !== '野菜') s -= x.ago <= 1 ? 0.6 : 0.2;
            if (x.genre === r.genre && x.ago <= 1) s -= 0.2;
        });
    }
    if (ctx.main){
        if (ctx.main.genre === r.genre) s += 0.3;
        else if ((ctx.main.genre === '韓' && r.genre === '中') || (ctx.main.genre === 'エスニック' && r.genre === '中')) s += 0.15;
        if (r.family === ctx.main.family && r.family !== '野菜') s -= 0.5;
        const overlap = r.items.filter(i => ctx.main.items.some(m => m.key === i.key)).length;
        s -= overlap * 0.15;
    }
    if (ctx.fridge && ctx.fridge.size){ s += matchRecipe(r, ctx.fridge).ratio * 0.8; }
    return s;
}
function pick(cands, ctx){
    let scored = cands.map(r => ({r, s: scoreRecipe(r, ctx)})).filter(x => x.s > -Infinity);
    if (!scored.length) scored = cands.filter(r => !S.hidden.includes(r.id)).map(r => ({r, s: scoreRecipe(r, Object.assign({}, ctx, {relax:true}))})).filter(x => x.s > -Infinity);
    if (!scored.length) return null;
    scored.forEach(x => x.s += Math.random() * 0.7);
    scored.sort((a,b) => b.s - a.s);
    return scored[0].r;
}
function suggestMain(){
    const cands = RECIPES.filter(r => r.main && moodOk(r, session.mood));
    return pick(cands, {recent: recentMainFamilies(3), fridge: session.useFridge ? fridgeKeys() : null});
}
function suggestSide(main, exclude=[]){
    return pick(RECIPES.filter(r => r.type === '副菜' && !exclude.includes(r.id)), {main, fridge: session.useFridge ? fridgeKeys() : null});
}
function suggestSoup(main, side){
    if (main && main.id === 'nikuudon') return null;
    return pick(RECIPES.filter(r => r.type === '汁物'), {main, fridge: session.useFridge ? fridgeKeys() : null});
}
function newMenu(){
    const main = suggestMain();
    const side = main ? suggestSide(main) : null;
    const soup = main ? suggestSoup(main, side) : null;
    session.menu = {main, side, soup};
    session.twist = suggestTwist();
}

/* =========================================================
   ひとひねり（アレンジ）生成
   id 形式: a~元のID~味~かたち~主役  → いつでも同じレシピに戻せる
   ========================================================= */
function twistOptions(base){
    const flavors = Object.entries(FLAVORS).filter(([k,f]) =>
        f.methods.includes(base.method) && !(f.skipGenre||[]).includes(base.genre) && !(f.skipId||[]).includes(base.id)).map(([k]) => k);
    const forms = Object.entries(FORMS).filter(([k,f]) =>
        f.types.includes(base.type) && f.methods.includes(base.method) && !(f.skipFamily||[]).includes(base.family)).map(([k]) => k);
    const swaps = (SWAPS[base.family] || []).map((s,i) => `${base.family}:${i}`)
        .filter(k => { const s = swapOf(k); return !base.items.some(i => i.key === s.to); });
    return {flavors, forms, swaps};
}
function swapOf(k){ if (!k) return null; const [f,i] = k.split(':'); return (SWAPS[f]||[])[+i] || null; }
function twistId(baseId, fl, fo, sw){ return ['a', baseId, fl||'', fo||'', sw||''].join('~'); }
function buildTwist(id){
    const [, baseId, fl, fo, sw] = String(id).split('~');
    const base = RECIPES.find(r => r.id === baseId); if (!base) return null;
    const F = FLAVORS[fl], M = FORMS[fo], W = swapOf(sw);
    const re = W ? FAMILY_RE[base.family] : null;
    const repl = t => re ? t.replace(re, W.word) : t;
    const items = base.items.map(i => {
        if (W && i.key === base.protein) return Object.assign({}, i, {name:W.word, key:keyOf(W.word), label:labelOf(W.word), changed:true});
        return i;
    });
    const addItems = [...(F ? F.add : []), ...(M ? M.add : [])].map(s => Object.assign(parseIng(s), {opt:false, added:true}));
    const steps = base.steps.map(t => ({t: repl(t)}));
    if (F){
        steps.splice(Math.max(steps.length-1, 1), 0, {t:F.step, add:true});
    }
    if (M) M.steps.forEach(t => steps.push({t, add:true}));
    if (F && F.garnish) steps.push({t:`仕上げに${F.garnish}を添える。`, add:true});
    let name = base.name;
    if (W && ['豚肉','鶏肉','牛肉'].includes(W.to)) name = name.replace(/^(豚|鶏|牛)の/, W.to[0] + 'の');
    if (M) name = name + M.suffix;
    if (F) name = `${F.prefix} ${name}`;
    if (W) name = `${name}（${W.label}）`;
    const changes = [];
    if (F) changes.push(`味: ${F.label}`);
    if (M) changes.push(`かたち: ${M.label}`);
    if (W) changes.push(`主役: ${W.to}に`);
    const genreMap = {kr:'韓', it:'洋', cn:'中', et:'エスニック', wa:'和'};
    const r = {
        id, name, base, isTwist:true, changes,
        genre: (F && genreMap[fl]) || base.genre,
        type: M && ['don','onigiri'].includes(fo) ? 'ごはん' : M && fo === 'pasta' ? '麺' : base.type,
        method: base.method, min: base.min + (M ? 10 : 0),
        items: [...items, ...addItems], seas: base.seas, steps: steps,
        note: W ? W.note : '',
    };
    const p = r.items.find(i => FAMILY[i.key] && i.key !== '卵');
    r.protein = p ? p.key : null; r.family = p ? FAMILY[p.key] : '野菜';
    r.main = ['主菜','ごはん','麺'].includes(r.type);
    return r;
}
// 変化の数: 1=ちょっとだけ 2=しっかり 3=大胆に
function generateTwists(opts={}){
    const {baseId=null, level=2, flavor='any', form='any', swap='any', count=3, fromIds=null} = opts;
    let bases = baseId ? [RECIPES.find(r => r.id === baseId)] :
        (fromIds && fromIds.length ? fromIds.map(id => RECIPES.find(r => r.id === id)) : RECIPES.filter(r => r.type !== '汁物'));
    bases = bases.filter(Boolean);
    const all = [];
    bases.forEach(b => {
        const o = twistOptions(b);
        const fls = flavor === 'none' ? [''] : flavor === 'any' ? ['', ...o.flavors] : (o.flavors.includes(flavor) ? [flavor] : []);
        const fos = form === 'none' ? [''] : form === 'any' ? ['', ...o.forms] : (o.forms.includes(form) ? [form] : []);
        const sws = swap === 'none' ? [''] : swap === 'any' ? ['', ...o.swaps] : o.swaps;
        fls.forEach(fl => fos.forEach(fo => sws.forEach(sw => {
            const n = [fl,fo,sw].filter(Boolean).length;
            if (!n) return;
            all.push({id: twistId(b.id, fl, fo, sw), n, base:b});
        })));
    });
    const seen = new Set(S.seenTwists);
    const eaten = new Set(S.history.map(h => h.id));
    const scored = all.map(x => {
        let s = Math.random();
        s -= Math.abs(x.n - level) * 0.8;
        if (seen.has(x.id)) s -= 1.2;
        if (eaten.has(x.id)) s -= 1.5;
        if (S.favs.includes(x.base.id)) s += 0.25;
        if (daysSince(x.base.id) < 3) s -= 0.3;
        return {x, s};
    }).sort((a,b) => b.s - a.s);
    // 同じ元料理ばかりにならないように
    const out = [], usedBase = new Set();
    for (const {x} of scored){
        if (out.length >= count) break;
        if (usedBase.has(x.base.id) && !baseId) continue;
        usedBase.add(x.base.id); out.push(buildTwist(x.id));
    }
    for (const {x} of scored){
        if (out.length >= count) break;
        if (!out.some(t => t.id === x.id)) out.push(buildTwist(x.id));
    }
    return out;
}
function markSeen(list){
    list.forEach(t => { if (t && !S.seenTwists.includes(t.id)) S.seenTwists.push(t.id); });
    if (S.seenTwists.length > 300) S.seenTwists = S.seenTwists.slice(-300);
    save();
}
function suggestTwist(){
    // よく作る定番やお気に入りをベースに、今日のひとひねりを1品
    const counts = {};
    S.history.forEach(h => { if (!String(h.id).startsWith('a~')) counts[h.id] = (counts[h.id]||0) + 1; });
    const favBases = [...new Set([...S.favs.filter(id => !String(id).startsWith('a~')), ...Object.keys(counts)])];
    const res = generateTwists({level:2, count:1, fromIds: favBases.length ? shuffle(favBases).slice(0,8) : null});
    return res[0] || null;
}

/* =========================================================
   1週間の主菜プラン
   ========================================================= */
function makeWeek(){
    const days = [], used = new Set();
    for (let i = 0; i < 7; i++){
        const d = addDays(TODAY, i);
        const recent = [];
        for (let k = 1; k <= 2 && days.length - k >= 0; k++){ const r = byId(days[days.length-k].id); if (r) recent.push({ago:k, family:r.family, genre:r.genre}); }
        if (i === 0) recent.push(...recentMainFamilies(2).map(x => Object.assign({}, x, {ago:x.ago+1})));
        const cands = RECIPES.filter(r => r.main && !used.has(r.id));
        const r = pick(cands, {recent, fridge: i < 2 && session.useFridge ? fridgeKeys() : null});
        if (r){ used.add(r.id); days.push({d, id:r.id}); }
    }
    S.week = {start:TODAY, days}; save();
}
function weekToday(){
    if (!S.week) return null;
    const x = S.week.days.find(x => x.d === TODAY);
    return x ? byId(x.id) : null;
}

function record(id, slot, d=TODAY){
    const r = byId(id); if (!r) return;
    if (S.history.some(h => h.id === id && h.d === d)) return;
    S.history.push({d, id, name:r.name, slot});
    S.history.sort((a,b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0);
    if (r.isTwist && !S.seenTwists.includes(id)) S.seenTwists.push(id);
    save();
}

const WIKI = {

const PHOTO_KEY = 'gohancho.photos.v1';
let PHOTOS = {}, photoStatus = 'idle';
try{
    const c = JSON.parse(localStorage.getItem(PHOTO_KEY) || 'null');
    if (c && c.v === 1 && Date.now() - c.t < 30*864e5){ PHOTOS = c.data || {}; photoStatus = 'done'; }
}catch(e){}
function stripHtml(h){ try{ return (new DOMParser().parseFromString(String(h||''), 'text/html').body.textContent || '').trim().replace(/\s+/g,' '); }catch(e){ return ''; } }
async function loadPhotos(){
    if (photoStatus === 'done' || photoStatus === 'loading') return;
    photoStatus = 'loading';
    try{
        const titles = [...new Set(Object.values(WIKI))], fileOf = {};
        for (let k = 0; k < titles.length; k += 40){
            const chunk = titles.slice(k, k+40);
            const url = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=name&titles=' + encodeURIComponent(chunk.join('|'));
            const j = await (await fetch(url)).json();
            const map = {}; [...(j.query.normalized||[]), ...(j.query.redirects||[])].forEach(n => map[n.from] = n.to);
            const byTitle = {}; (j.query.pages||[]).forEach(pg => { if (pg.pageimage) byTitle[pg.title] = pg.pageimage; });
            chunk.forEach(t => { let x = t; for (let n = 0; n < 3 && map[x]; n++) x = map[x]; if (byTitle[x]) fileOf[t] = byTitle[x]; });
        }
        const files = [...new Set(Object.values(fileOf))].filter(f => /\.(jpe?g|png|webp)$/i.test(f));
        const info = {};
        for (let k = 0; k < files.length; k += 40){
            const chunk = files.slice(k, k+40);
            const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=720&iiextmetadatafilter=Artist|LicenseShortName&titles=' + encodeURIComponent(chunk.map(f => 'File:' + f).join('|'));
            const j = await (await fetch(url)).json();
            const back = {}; (j.query.normalized||[]).forEach(n => back[n.to] = n.from);
            (j.query.pages||[]).forEach(pg => {
                const ii = pg.imageinfo && pg.imageinfo[0]; if (!ii || pg.missing) return;
                const em = ii.extmetadata || {};
                const rec = {src: ii.thumburl || ii.url, page: ii.descriptionurl,
                    artist: stripHtml(em.Artist && em.Artist.value).slice(0, 80), license: stripHtml(em.LicenseShortName && em.LicenseShortName.value)};
                [pg.title, back[pg.title] || pg.title].forEach(t => { const f = t.replace(/^File:/,''); info[f] = rec; info[f.replace(/_/g,' ')] = rec; });
            });
        }
        const out = {};
        Object.entries(WIKI).forEach(([id, t]) => { const f = fileOf[t]; const rec = f && (info[f] || info[f.replace(/_/g,' ')]); if (rec && rec.src && /^https:\/\//.test(rec.src)) out[id] = rec; });
        PHOTOS = out; photoStatus = 'done';
        try{ localStorage.setItem(PHOTO_KEY, JSON.stringify({v:1, t:Date.now(), data:out})); }catch(e){}
    }catch(e){ photoStatus = 'blocked'; }
    const a = document.activeElement;
    if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
    if (modalId) renderModal();
}

    if (Object.keys(PHOTOS).length) return '写真: Wikipedia / Wikimedia Commons。撮影者とライセンスは各料理の詳細に表示しています。';

}

function seeded(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

    if (art){ base = art.base; items = art.items.map(i => ({z: i[0]==='dot' && i[3] > 20 ? 0 : 2, item:i})); }
    else {
        base = baseColor(r);
        items = [];
        const seen = new Set();
        r.items.forEach(i => {
            const a = ING_ART[i.key] || ING_ART[i.label]; if (!a || seen.has(i.key)) return; seen.add(i.key);
            const n = i.opt ? Math.max(1, Math.round(a.n*.6)) : a.n;
            items.push({z:a.z, item:[a.g, a.c, a.c2, a.s, n, 0, 0, 0]});
        });
        if (!items.length) items.push({z:2, item:['chunk', '#b57a52', '#e9c4a4', 12, 4, 0, 0, 0]});
    }
    // かたちのアレンジ: ご飯・麺・パン・卵・チーズなどを足す
    let under = '', over = '';
    const fo = r.isTwist ? String(r.id).split('~')[3] : '';
    const fl = r.isTwist ? String(r.id).split('~')[2] : '';
    const riceUnder = `<circle cx="50" cy="50" r="${R}" fill="#f7f3e8"/>${Array.from({length:26},()=>{const a=rng()*6.28,d=Math.sqrt(rng())*30;return `<ellipse cx="${(50+Math.cos(a)*d).toFixed(1)}" cy="${(50+Math.sin(a)*d).toFixed(1)}" rx="2.2" ry="1.3" transform="rotate(${(rng()*180).toFixed(0)} ${(50+Math.cos(a)*d).toFixed(1)} ${(50+Math.sin(a)*d).toFixed(1)})" fill="#ffffff" stroke="#e3dccb" stroke-width=".4"/>`;}).join('')}`;
    const isRiceDish = !art && (r.type === 'ごはん');
    const isNoodle = !art && (r.type === '麺');
    if (fo === 'don' || isRiceDish || (art && art.rice)){ under = riceUnder; }
    if (art && art.roux){ under += `<path d="M46,14 C70,10 90,30 86,56 C82,78 62,88 44,84 C60,70 62,30 46,14 Z" fill="#8a5a2b"/>`; }
    if (fo === 'pasta' || isNoodle){ under = `<circle cx="50" cy="50" r="${R}" fill="#f1e6c2"/>` + Array.from({length:12},()=>G.strand(50+(rng()-.5)*40, 50+(rng()-.5)*40, 22, rng()*180, '#f1de9a')).join(''); }
    if (fo === 'sand'){ under = `<rect x="14" y="14" width="72" height="72" rx="6" fill="#e8c98f"/><rect x="18" y="18" width="64" height="64" rx="4" fill="#f5e6c8"/>`; }
    if (fo === 'omelet'){ over = `<path d="M22,58 Q20,30 50,28 Q80,30 78,58 Q50,70 22,58 Z" fill="#f7cf3f" opacity=".92"/><path d="M30,56 Q50,64 70,56" stroke="#e9b62a" stroke-width="1.4" fill="none"/>`; }
    if (fo === 'gratin' || fo === 'cheese' || fl === 'it'){ over += Array.from({length: fo ? 7 : 4},()=>G.dot(50+(rng()-.5)*44, 50+(rng()-.5)*44, 7+rng()*5, 0, '#f6d76a')).join('') + (fo ? Array.from({length:5},()=>G.dot(50+(rng()-.5)*40, 50+(rng()-.5)*40, 4, 0, '#b96b2a')).join('') : ''); }
    if (fo === 'harumaki'){ over = Array.from({length:3},(_,k)=>G.roll(50, 36+k*14, 40, -12, '#e0a85a', '#f3d4a0')).join(''); }
    if (fo === 'onigiri'){ under = `<circle cx="50" cy="50" r="${R}" fill="#f0e8d4"/>`; over = G.tri(38,52,26,0,'#f7f3e8','#2a2f2a') + G.tri(64,48,26,0,'#f7f3e8','#2a2f2a'); }
    if (fo === 'nabe'){ under = `<circle cx="50" cy="50" r="${R}" fill="#d9c9a6"/>` + G.leaf(30,40,14,20,'#dbe6b7','#f5f8e6') + G.leaf(66,62,14,-30,'#dbe6b7','#f5f8e6') + G.cube(60,36,10,10,'#faf7ef','#fff') + G.cube(36,64,10,-8,'#faf7ef','#fff'); }
    const tint = {kr:'rgba(200,50,30,.28)', curry:'rgba(230,170,30,.35)', cn:'rgba(120,60,20,.18)', et:'rgba(240,120,40,.2)', misobutter:'rgba(150,100,40,.25)', wa:'rgba(90,60,30,.12)', garlic:'rgba(250,220,120,.25)', ume:'rgba(200,40,60,.15)'}[fl] || '';
    const garnish = {kr:Array.from({length:12},()=>G.dot(50+(rng()-.5)*50, 50+(rng()-.5)*50, 1.6, 0, '#f6efd8')).join('') + G.strand(60,40,10,20,'#c8323c'),
        et:G.leaf(62,36,8,20,'#3f8a45','#a8d69d')+G.leaf(36,62,8,-40,'#3f8a45','#a8d69d')+G.wedge(70,66,8,0,'#f6e05a','#fbf2a8'),
        wa:G.dot(62,38,10,0,'#f7f3ea')+G.leaf(36,60,8,-30,'#3f8a45','#a8d69d'),
        ume:G.round(60,38,6,0,'#c8323c','#e8848c')+G.leaf(38,60,9,-30,'#3f8a45','#a8d69d'),
        garlic:G.crescent(62,38,6,20,'#f6f0dc','#d9cfa8')+G.crescent(38,62,6,-50,'#f6f0dc','#d9cfa8')+G.dot(50,50,2,0,'#2a2a2a'),
        misobutter:G.cube(58,42,7,10,'#f8e58a','#fdf6c6'),
        cn:Array.from({length:5},()=>G.ring(50+(rng()-.5)*44, 50+(rng()-.5)*44, 3.4, 0, '#5e9a4f','#eef7e6')).join(''),
        it:G.leaf(62,36,8,20,'#2f7a3a','#7fbb75')+Array.from({length:10},()=>G.dot(50+(rng()-.5)*50, 50+(rng()-.5)*50, 1.8, 0, '#f8efc8')).join(''),
        curry:''}[fl] || '';
    items.sort((a,b) => a.z - b.z);
    const body = items.map(x => place(x.item)).join('');
    const baseOp = art ? .95 : ({'煮':.95,'炒':.5,'焼':.42,'揚':.35,'和え':.55,'炊':.9,'汁':1}[r.method] || .6);
    const baseShape = under || (opts.plain ? '' : `<path opacity="${baseOp}" d="M50,${cy-R} C${cx+R*.9},${cy-R*.9} ${cx+R*1.05},${cy+R*.5} ${cx+R*.55},${cy+R*.85} C${cx-R*.2},${cy+R*1.1} ${cx-R*1.05},${cy+R*.4} ${cx-R*.95},${cy-R*.3} C${cx-R*.85},${cy-R*.95} ${cx-R*.2},${cy-R*1.05} 50,${cy-R} Z" fill="${base}"/>`);
    const tintShape = tint ? `<circle cx="50" cy="50" r="${R}" fill="${tint}"/>` : '';
    const gloss = `<ellipse cx="38" cy="30" rx="12" ry="6" fill="#fff" opacity=".18" transform="rotate(-25 38 30)"/>`;
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="dish" aria-hidden="true"><defs><clipPath id="c${String(r.id).replace(/[^a-z0-9]/gi,'')}"><circle cx="50" cy="50" r="${R+2}"/></clipPath></defs><g clip-path="url(#c${String(r.id).replace(/[^a-z0-9]/gi,'')})">${baseShape}<g stroke="rgba(40,20,10,.16)" stroke-width=".5">${body}</g>${over}${tintShape}${garnish}${gloss}</g></svg>`;
}

const STAPLE_QUICK = ['卵','玉ねぎ','にんじん','じゃがいも','長ねぎ','豆腐','キャベツ','ベーコン','ハム','ウインナー','しめじ','ツナ','コーン','わかめ','油揚げ','チーズ','キムチ','うどん','スパゲッティ','牛乳'];
function stapleKeys(){ return new Set(S.staples.map(keyOf)); }
// 買い足すとレパートリーが広がる食材: その1品を足すと「今すぐ作れる」に変わる料理を数える
function shoppingHints(have, limit=3){
    const gain = {};
    RECIPES.forEach(r => {
        if (S.hidden.includes(r.id)) return;
        const m = matchRecipe(r, have);
        if (m.miss.length === 1 && (m.got.length + m.subs.length) >= 1){
            const k = m.miss[0].key, lbl = m.miss[0].label;
            (gain[k] = gain[k] || {label:lbl, names:[]}).names.push(r.name);
        }
    });
    return Object.entries(gain).map(([k,v]) => ({key:k, label:v.label, n:v.names.length, names:v.names.slice(0,3)}))
        .sort((a,b) => b.n - a.n).slice(0, limit);
}

function upgradeOf(r){
    const base = r.isTwist ? r.base : r;
    return UPGRADES[base.id] || UPGRADE_BY_METHOD[base.method] || UPGRADE_BY_METHOD['炒'];
}
function skillDone(r){ const base = r.isTwist ? r.base : r; return S.skills.some(s => s.id === base.id); }
function upgradeHtml(r, compact=false){
    const u = upgradeOf(r); if (!u) return '';
    const done = skillDone(r);
    const base = r.isTwist ? r.base : r;
    return `<div class="skill${done?' done':''}">
        <div class="band">ひと手間</div>
        <div class="body">
            <div class="add"><span class="plus">＋</span>${esc(u.add)}</div>
            <div class="why">${esc(u.why)}</div>
            <div class="how"><b>${esc(u.skill)}</b>　${esc(u.how)}</div>
            ${compact ? '' : `<div class="row">${done
                ? `<span class="badge fav">習得済み</span><span class="small muted">「${esc(u.skill)}」はもう身についています</span>`
                : `<button class="btn sm primary" data-act="skill-done" data-id="${esc(base.id)}">やってみた</button><span class="small muted">できたら押してください。記録に残ります</span>`}</div>`}
        </div>
    </div>`;
}

   励まし（あいさつ・ねぎらい・ふりかえり・称号）
   ========================================================= */
function recordedDays(){ return [...new Set(S.history.map(h => h.d))].sort().reverse(); }
function streak(){
    const days = new Set(S.history.map(h => h.d));
    let n = 0, d = TODAY;
    if (!days.has(d)) d = addDays(d, -1);
    while (days.has(d)){ n++; d = addDays(d, -1); }
    return n;
}
function weekStart(d=TODAY){ const dt = parseYmd(d); const wd = (dt.getDay() + 6) % 7; return addDays(d, -wd); }   // 月曜はじまり
function weekStats(){
    const from = weekStart();
    const hs = S.history.filter(h => h.d >= from && h.d <= TODAY);
    const days = new Set(hs.map(h => h.d)).size;
    const firstOf = {};
    S.history.slice().sort((a,b) => a.d < b.d ? -1 : 1).forEach(h => { if (!firstOf[h.id]) firstOf[h.id] = h.d; });
    const fresh = [...new Set(hs.map(h => h.id))].filter(id => firstOf[id] >= from);
    const skills = S.skills.filter(s => s.d >= from).length;
    const genres = new Set(hs.map(h => { const r = byId(h.id); return r && r.genre; }).filter(Boolean)).size;
    return {days, dishes:hs.length, fresh, skills, genres};
}
function greeting(){
    const h = new Date().getHours();
    const hello = h < 5 ? 'こんばんは。遅くまでおつかれさまです' : h < 11 ? 'おはようございます' : h < 17 ? 'こんにちは' : 'こんばんは';
    const todayDone = S.history.some(x => x.d === TODAY);
    const st = streak();
    const ws = weekStats();
    let line;
    if (!S.history.length) line = 'まずは今日の献立を決めるところから。決めるだけでも、立派なひと仕事です。';
    else if (todayDone && st >= 3) line = `${st}日続けて献立が決まっています。この調子は、ちゃんとすごいことです。`;
    else if (todayDone) line = '今日の献立は決まっています。あとは作るだけ。';
    else if (st >= 3) line = `${st}日続いています。今日の分を決めれば${st+1}日目です。`;
    else if (ws.days) line = `今週は${ws.days}日分、${ws.dishes}品を記録しています。今日はどうしましょう。`;
    else line = 'きのうまでのごはん、おつかれさまでした。今日の分をいっしょに考えましょう。';
    return {hello, line};
}
const PRAISE = ['今日もおつかれさまです。', '献立が決まれば、半分は終わったようなものです。', '毎日のごはんが、ちゃんと回っています。', '記録しました。いつかの自分を助けます。', '今日の分、決まりました。あとは作るだけ。'];
function praiseFor(ids){
    const st = streak();
    const firstTimers = ids.filter(id => S.history.filter(h => h.id === id).length === 1);
    if (firstTimers.length) return `初めての料理に挑戦です。レパートリーが${firstTimers.length}品増えました。`;
    if ([7,14,30,50,100].includes(st)) return `${st}日連続で献立を記録しました。すごい継続力です。`;
    if (st >= 3 && Math.random() < .5) return `${st}日続けて記録しています。今日もおつかれさまです。`;
    return rand(PRAISE);
}
const TITLES = [
    {k:'days', label:'台所の日々', unit:'日', steps:[1,7,30,100], names:['はじめの一日','一週間の台所','ひと月の台所','百日の台所'], hint:'献立を記録した日数'},

function titleValues(){
    const genres = new Set(S.history.map(h => { const r = byId(h.id); return r && r.genre; }).filter(Boolean));
    return {days: recordedDays().length, fresh: new Set(S.history.map(h => h.id)).size, skill: S.skills.length, genre: genres.size,
        twist: new Set(S.history.filter(h => String(h.id).startsWith('a~')).map(h => h.id)).size};
}
function titlesHtml(){
    const v = titleValues();
    return TITLES.map(t => {
        const val = v[t.k] || 0;
        let lv = 0; while (lv < t.steps.length && val >= t.steps[lv]) lv++;
        const next = t.steps[lv], prev = lv ? t.steps[lv-1] : 0;
        const pct = next ? Math.round(((val - prev) / (next - prev)) * 100) : 100;
        return `<div class="title-row">
            <div class="title-head"><span class="title-name">${esc(t.label)}</span><span class="title-lv">${lv ? esc(t.names[lv-1]) : '（まだ）'}</span></div>
            <div class="bar" role="img" aria-label="${esc(t.label)} ${val}${t.unit}"><i style="width:${Math.min(100,Math.max(2,pct))}%"></i></div>
            <div class="title-foot"><span>${val}${t.unit}</span><span>${next ? `あと${next - val}${t.unit}で「${esc(t.names[lv])}」` : '最高位に到達しています'}</span></div>
            <div class="small muted">${esc(t.hint)}</div>
        </div>`;
    }).join('');
}
function reviewHtml(){
    const ws = weekStats();
    const from = weekStart();
    let msg;
    if (!S.history.length) msg = '記録がたまると、ここに一週間のふりかえりが出ます。最初の一日を記録してみてください。';
    else if (!ws.days) msg = '今週はまだ記録がありません。忙しい週もあります。今日の分だけ、決めてみませんか。';
    else {
        const parts = [`今週は${ws.days}日分、${ws.dishes}品`];
        if (ws.fresh.length) parts.push(`新しい料理が${ws.fresh.length}つ増えました`);
        if (ws.skills) parts.push(`ひと手間を${ws.skills}つ試しました`);
        if (ws.genres >= 3) parts.push(`${ws.genres}つのジャンルを行き来しています`);
        msg = parts.join('。') + '。' + (ws.days >= 5 ? 'よく回した一週間です。' : ws.days >= 3 ? 'いいペースです。' : '一日一日が積み重なっています。');
    }
    return `<div class="review">
        <div class="label">今週のふりかえり（${esc(jpDate(from).replace(/（.*/,''))}〜）</div>
        <p>${esc(msg)}</p>
        <div class="stats">
            <div class="stat"><div class="n">${ws.days}</div><div class="k">記録した日</div></div>
            <div class="stat"><div class="n">${ws.fresh.length}</div><div class="k">新しい料理</div></div>
            <div class="stat"><div class="n">${ws.skills}</div><div class="k">ひと手間</div></div>
        </div>
    </div>`;
}

function matchRow(m){

    return `<div class="match">
        <span data-act="open" data-id="${esc(r.id)}">${thumbHtml(r)}</span>

}

function runTwist(){
    const lv = Number(twistState.level);
    twistState.results = generateTwists({baseId: twistState.baseId || null, level: lv, flavor: twistState.flavor, form: twistState.form, swap: twistState.swap, count: 3, fromIds: twistState.baseId ? null : twistState.fromIds});
    markSeen(twistState.results);
}

function addIngredients(text){
    const found = extractIngredients(text);
    let added = 0;
    found.forEach(f => { if (!S.fridge.some(x => keyOf(x) === keyOf(f))){ S.fridge.push(f); added++; } });
    save();
    if (found.length) toast(added ? `${found.join('・')} を追加しました` : 'すでに登録されています');
    else toast('食材の名前が読み取れませんでした');
}
let recog = null;
function startMic(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ toast('この端末では声の入力が使えません。文字で入力してください'); return; }
    if (recog){ recog.stop(); return; }
    try{
        recog = new SR(); recog.lang = 'ja-JP'; recog.interimResults = false; recog.maxAlternatives = 1;
        const btn = $('#mic-btn'); if (btn) btn.textContent = '聞いています…';
        recog.onresult = e => { const t = e.results[0][0].transcript; addIngredients(t); };
        recog.onerror = e => { toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'マイクが使えませんでした。文字で入力してください' : '聞き取れませんでした。もう一度どうぞ'); };
        recog.onend = () => { recog = null; render(); };
        recog.start();
    }catch(e){ recog = null; toast('マイクが使えませんでした。文字で入力してください'); }
}

document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === 'modal-bg' && e.target !== el) return;
    switch(act){
        case 'open': openModal(id); break;
        case 'close': case 'modal-bg': closeModal(); break;
        case 'mood': session.mood = el.dataset.k; session.rejected.clear(); newMenu(); render(); break;
        case 'use-fridge': session.useFridge = el.checked; newMenu(); render(); break;
        case 'reroll': {
            const k = el.dataset.k, m = session.menu;
            if (m[k]) session.rejected.add(m[k].id);
            if (k === 'main'){ m.main = suggestMain(); m.side = m.main ? suggestSide(m.main) : null; m.soup = m.main ? suggestSoup(m.main, m.side) : null; }
            if (k === 'side') m.side = suggestSide(m.main);
            if (k === 'soup') m.soup = suggestSoup(m.main, m.side);
            render(); break;
        }
        case 'new-menu':
            ['main','side','soup'].forEach(k => session.menu[k] && session.rejected.add(session.menu[k].id));
            newMenu(); render(); break;
        case 'decide': {
            const m = session.menu;
            const ids = [m.main, m.side, m.soup].filter(Boolean).map(r => r.id);
            ids.forEach(id => record(id, slotOf(byId(id))));
            toast(praiseFor(ids), true); render(); break;
        }
        case 'use-plan': {
            const p = weekToday(); if (!p) break;
            session.menu.main = p; session.menu.side = suggestSide(p); session.menu.soup = suggestSoup(p, session.menu.side); render(); break;
        }
        case 'new-twist': if (session.twist) markSeen([session.twist]); session.twist = suggestTwist(); render(); break;
        case 'twist-main': {
            const t = session.twist; if (!t) break;
            session.menu.main = t; session.menu.side = suggestSide(t); session.menu.soup = suggestSoup(t, session.menu.side);
            markSeen([t]); toast('主菜をひとひねり案にしました'); render(); break;
        }
        case 'make-week': makeWeek(); render(); break;
        case 'week-reroll': {
            const d = el.dataset.d, w = S.week; const idx = w.days.findIndex(x => x.d === d);
            const used = new Set(w.days.map(x => x.id));
            const recent = []; [idx-1, idx+1].forEach(j => { const x = w.days[j]; const r = x && byId(x.id); if (r) recent.push({ago:1, family:r.family, genre:r.genre}); });
            const r = pick(RECIPES.filter(r => r.main && !used.has(r.id)), {recent});
            if (r){ w.days[idx].id = r.id; save(); } render(); break;
        }
        case 'toggle-ing': {
            const v = el.dataset.v, k = keyOf(v);
            const i = S.fridge.findIndex(x => keyOf(x) === k);
            if (i >= 0) S.fridge.splice(i,1); else S.fridge.push(canonOf(v) || v);
            save(); render(); break;
        }
        case 'rm-ing': S.fridge = S.fridge.filter(x => x !== el.dataset.v); save(); render(); break;
        case 'clear-ing': S.fridge = []; save(); render(); break;
        case 'sample-ing': S.fridge = ['豚肉','キャベツ','卵']; save(); render(); break;
        case 'mic': startMic(); break;
        case 'fridge-twist': {
            const have = fridgeKeys();
            const top = RECIPES.filter(r => r.type !== '汁物').map(r => matchRecipe(r, have)).sort((a,b) => b.ratio - a.ratio || b.used - a.used).slice(0,6).map(m => m.r.id);
            twistState = Object.assign(twistState, {baseId:'', fromIds: top, results:null});
            setTab('twist'); break;
        }
        case 'tw-set': {
            const key = el.dataset.key; let v = el.dataset.v; if (key === 'level') v = Number(v);
            twistState[key] = v; runTwist(); render(); break;
        }
        case 'tw-run': runTwist(); render(); break;
        case 'twist-this':
            twistState = Object.assign(twistState, {baseId:id, fromIds:null, results:null});
            closeModal(); setTab('twist'); break;
        case 'fav': {
            const i = S.favs.indexOf(id);
            if (i >= 0){ S.favs.splice(i,1); toast('お気に入りから外しました'); } else { S.favs.push(id); toast('お気に入りに入れました'); }
            save(); if (modalId) renderModal(); render(); break;
        }
        case 'cooked': { const r = byId(id); record(id, slotOf(r)); toast(praiseFor([id]), true); renderModal(); render(); break; }
        case 'cooked-date': {
            const d = $('#cook-date').value || TODAY; const r = byId(id);
            if (d > TODAY){ toast('未来の日付には記録できません'); break; }
            record(id, slotOf(r), d); toast(`${jpDate(d)}に記録しました`); renderModal(); render(); break;
        }
        case 'hide': modalConfirmHide = true; renderModal(); break;
        case 'hide-no': modalConfirmHide = false; renderModal(); break;
        case 'hide-yes':
            if (!S.hidden.includes(id)) S.hidden.push(id); save();
            closeModal(); if (session.menu && ['main','side','soup'].some(k => session.menu[k] && session.menu[k].id === id)) newMenu();
            toast('献立の候補から外しました'); render(); break;
        case 'unhide': S.hidden = S.hidden.filter(x => x !== id); save(); render(); break;
        case 'rm-hist': S.history = S.history.filter(h => !(h.d === el.dataset.d && h.id === id)); save(); render(); break;
        case 'rm-custom': {
            S.custom = S.custom.filter(r => r.id !== id);
            const i = RECIPES.findIndex(r => r.id === id); if (i >= 0) RECIPES.splice(i,1);
            save(); render(); break;
        }
        case 'toggle-staple': {
            const v = el.dataset.v, k = keyOf(v);
            const i = S.staples.findIndex(x => keyOf(x) === k);
            if (i >= 0) S.staples.splice(i,1); else S.staples.push(canonOf(v) || v);
            save(); render(); break;
        }
        case 'rm-staple': S.staples = S.staples.filter(x => x !== el.dataset.v); save(); render(); break;
        case 'skill-done': {
            const r = byId(id); const u = upgradeOf(r);
            if (!S.skills.some(sk => sk.id === id)){ S.skills.push({d:TODAY, id, skill:u.skill}); save(); }
            const n = S.skills.length;
            toast(n === 1 ? `「${u.skill}」を習得しました。最初のひと手間です。` : `「${u.skill}」を習得しました。これで${n}つ目のコツです。`, true);
            renderModal(); render(); break;
        }
        case 'export': {
            const ta = $('#backup-text'); ta.value = JSON.stringify(S);
            const done = () => toast('コピーしました');
            try{ navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast('文字を選択しました。コピーしてください'); }); }
            catch(err){ ta.select(); toast('文字を選択しました。コピーしてください'); }
            break;
        }
        case 'import': {
            const txt = $('#backup-text').value.trim();
            try{ const d = JSON.parse(txt); if (!d || !Array.isArray(d.history)) throw 0; pendingConfirm = 'import'; importBuffer = txt; render(); keepDetailsOpen(); }
            catch(err){ toast('読み込めませんでした。コピーした文字をそのまま貼りつけてください'); }
            break;
        }
        case 'import-yes': {
            try{
                const d = JSON.parse(importBuffer);
                S = Object.assign(structuredClone(DEFAULT_STATE), d, {settings:Object.assign({}, DEFAULT_STATE.settings, d.settings||{})});
                for (let i = RECIPES.length-1; i >= 0; i--) if (String(RECIPES[i].id).startsWith('u')) RECIPES.splice(i,1);
                S.custom.forEach(r => RECIPES.push(prepRecipe(Object.assign({}, r))));
                save(); toast('読み込みました');
            }catch(err){ toast('読み込めませんでした'); }
            pendingConfirm = null; session.menu = null; render(); break;
        }
        case 'reset': pendingConfirm = 'reset'; render(); keepDetailsOpen(); break;
        case 'reset-yes':
            for (let i = RECIPES.length-1; i >= 0; i--) if (String(RECIPES[i].id).startsWith('u')) RECIPES.splice(i,1);
            S = structuredClone(DEFAULT_STATE); save(); pendingConfirm = null; session.menu = null; toast('すべて消しました'); render(); break;
        case 'cancel-confirm': pendingConfirm = null; render(); keepDetailsOpen(); break;
    }
});
let importBuffer = '';
function keepDetailsOpen(){ const b = document.querySelectorAll('details.box'); if (b.length) b[b.length-1].open = true; }
document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'tw-base'){ twistState.baseId = el.value; twistState.fromIds = null; runTwist(); render(); }
    if (el.id === 'avoid-days'){ S.settings.avoidDays = Number(el.value); save(); session.menu = null; toast(`${el.value}日以内に作った料理は出さないようにしました`); }
});
document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.dataset.form;
    if (f === 'add-ing'){ const inp = $('#ing-input'); if (inp.value.trim()){ addIngredients(inp.value); inp.value = ''; render(); $('#ing-input').focus(); } }
    if (f === 'add-staple'){
        const inp = $('#staple-input'); const found = extractIngredients(inp.value); let added = 0;
        found.forEach(x => { if (!S.staples.some(y => keyOf(y) === keyOf(x))){ S.staples.push(x); added++; } });
        save(); toast(added ? `${found.join('・')} を常備品に登録しました` : '食材の名前が読み取れませんでした'); render();
    }
    if (f === 'custom'){
        const name = $('#c-name').value.trim(); if (!name) return;
        const ings = $('#c-ings').value.split('\n').map(s => s.trim().replace(/[\s　]+/, ' ')).filter(Boolean);
        const steps = $('#c-steps').value.split('\n').map(s => s.trim()).filter(Boolean);
        const r = {id:'u'+Date.now(), name, genre:$('#c-genre').value, type:$('#c-type').value, method:$('#c-method').value,
            min:Number($('#c-min').value)||20, ings: ings.length ? ings : [name], seas:$('#c-seas').value.trim(), steps: steps.length ? steps : ['（作り方は未入力です）']};
        S.custom.push(r); RECIPES.push(prepRecipe(Object.assign({}, r))); save();
        toast(`「${name}」を追加しました`); render();
    }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalId) closeModal(); });
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
setTab(tab);
loadPhotos();
</script>
</body>
