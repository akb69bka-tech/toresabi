<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栽培管理システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f8f9fb; --surface-3:#eef1f5;
  --border:#e2e5ea; --border-strong:#c8cdd5;
  --ink:#16191d; --ink-2:#3f4753; --ink-3:#5f6875; --muted:#8a919c;
  --primary:#1f4e79; --primary-hover:#173d5f; --primary-soft:#e7eff7; --primary-ring:rgba(31,78,121,.25);
  --good:#0ca30c; --good-text:#006300; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --rec:#b3261e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --radius:8px; --radius-lg:12px;
  --shadow-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-2:0 8px 24px rgba(16,24,40,.12);
  --sidebar-w:232px; --topbar-h:60px;
  --font:"Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ============================================================
   App shell
   ============================================================ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.brand .name{font-size:15px;font-weight:700;letter-spacing:.01em}
.brand .org{font-size:12px;color:var(--ink-3);margin-top:2px}
.nav{padding:10px 10px;flex:1;overflow:auto}
.nav-sec{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;padding:12px 10px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);color:var(--ink-2);cursor:pointer;user-select:none;font-weight:500}
.nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--primary-soft);color:var(--primary)}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item.active .cnt{color:var(--primary)}
.side-foot{padding:12px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-3)}
.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--surface-3);font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync-pill.on .dot{background:var(--good)}
.sync-pill.err .dot{background:var(--critical)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.cmd{flex:1;display:flex;align-items:center;gap:8px;max-width:760px}
.cmd .box{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);padding:0 8px 0 12px;height:38px;transition:box-shadow .15s,border-color .15s}
.cmd .box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.cmd .box svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cmd input{flex:1;border:0;outline:0;background:transparent;font-size:14px;min-width:0}
.cmd input::placeholder{color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:var(--radius);border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn.mic{background:var(--primary);color:#fff;border-color:var(--primary)}
.icon-btn.mic:hover{background:var(--primary-hover)}
.icon-btn.mic.rec{background:var(--critical);border-color:var(--critical);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(208,59,59,.45)}70%{box-shadow:0 0 0 10px rgba(208,59,59,0)}100%{box-shadow:0 0 0 0 rgba(208,59,59,0)}}
.topbar .status{font-size:12px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}

.content{padding:20px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:20px}
.page-head .sub{font-size:12px;color:var(--ink-3);margin-top:2px}

/* Answer panel */
.answer{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:14px 16px;display:none}
.answer.show{display:block}
.answer.warn{border-left-color:var(--warning)}
.answer .a-head{display:flex;align-items:flex-start;gap:10px}
.answer .a-q{font-size:12px;color:var(--ink-3)}
.answer .a-main{font-size:16px;font-weight:600;margin-top:2px}
.answer .a-detail{margin-top:8px;font-size:13px;color:var(--ink-2);display:grid;gap:2px}
.answer .a-detail .row{padding:4px 0;border-top:1px dashed var(--border)}
.answer .a-tools{margin-left:auto;display:flex;gap:4px;flex:none}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:8px}
.card-b{padding:16px}
.card-b.flush{padding:0}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-1)}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;line-height:1.1}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--critical);border-color:#f1c4c4}
.btn.danger:hover{background:#fdf2f2}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink-3);font-weight:500}
.input,.select,.textarea{height:34px;border:1px solid var(--border-strong);border-radius:var(--radius);padding:0 10px;background:var(--surface);outline:0;width:100%}
.textarea{height:auto;padding:8px 10px;resize:vertical;font-size:13px;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.toolbar .field{min-width:130px}
.toolbar .grow{flex:1;min-width:180px}
.toolbar .spacer{flex:1}

/* Table */
.table-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tbl th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-3);font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.sorted{color:var(--primary)}
.tbl th .arr{font-size:10px;margin-left:4px}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.nw{white-space:nowrap}
.tbl td.wrap{min-width:220px;max-width:520px}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tfoot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--border-strong)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.tag.f{color:#fff}
.tag.good{background:#e6f6e6;color:var(--good-text)}
.tag.warn{background:#fff4d6;color:#7a5200}
.tag.crit{background:#fde8e8;color:#8f1d1d}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.row-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.row-x:hover{color:var(--critical)}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-3)}
.pager .spacer{flex:1}

.empty{padding:40px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Chart */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;box-shadow:var(--shadow-2);white-space:nowrap;display:none;z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 10px;height:30px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.seg button+button{border-left:1px solid var(--border-strong)}

/* Timeline */
.tl{display:grid;gap:0}
.tl .it{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:8px 16px;border-top:1px solid var(--border);font-size:13px}
.tl .it:first-child{border-top:0}
.tl .d{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .k{font-size:11px;color:var(--muted);margin-right:6px}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow-2);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.drawer .dh h2{font-size:15px}
.drawer .db{padding:18px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start}
.drawer .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* Notice / callout */
.callout{border:1px solid var(--border);border-left:4px solid var(--warning);background:#fffbf0;border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.callout.info{border-left-color:var(--primary);background:var(--primary-soft)}
.callout.ok{border-left-color:var(--good);background:#f0faf0}
.callout b{color:var(--ink)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--ink-3)}
details.guide{border:1px solid var(--border);border-radius:var(--radius)}
details.guide summary{padding:10px 12px;cursor:pointer;font-weight:500;background:var(--surface-2);border-radius:var(--radius)}
details.guide .gb{padding:12px;font-size:13px;color:var(--ink-2);line-height:1.8}
details.guide code{background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:12px}
details.guide pre{background:#1e2430;color:#e6e9ef;padding:10px;border-radius:6px;overflow:auto;font-size:12px}

/* Toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-2);z-index:100;transition:transform .25s}
#toast.show{transform:translate(-50%,0)}

/* Responsive */
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand foot" "nav nav";align-items:center;border-right:0;border-bottom:1px solid var(--border)}
  .brand{grid-area:brand;border:0;padding:10px 14px 6px}
  .brand .name{font-size:14px}
  .side-foot{grid-area:foot;border:0;padding:10px 12px 6px}
  .nav{grid-area:nav;display:flex;padding:4px 8px 8px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-sec{display:none}
  .nav-item{padding:6px 10px;white-space:nowrap;flex:none}
  .nav-item .cnt{display:none}
  .chart{overflow-x:auto}
  .chart svg{min-width:640px}
  .topbar{height:auto;padding:10px 14px;flex-wrap:wrap}
  .cmd{max-width:none;width:100%}
  .topbar .right{width:100%;justify-content:space-between;margin:0}
  .content{padding:14px}
  .kv{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.toolbar,.pager,.drawer,.overlay,#toast,.btn{display:none!important}
  .app{display:block}.content{padding:0}.card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <!-- ================= Sidebar ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="name">栽培管理システム</div>
      <div class="org" id="brandOrg">ナス栽培 8圃場</div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-sec">メニュー</div>
      <div class="nav-item" data-view="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>
        <span>ダッシュボード</span></div>
      <div class="nav-item" data-view="harvests">
        <svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
        <span>収穫・出荷</span><span class="cnt" data-cnt="harvests"></span></div>
      <div class="nav-item" data-view="tasks">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></svg>
        <span>作業記録</span><span class="cnt" data-cnt="tasks"></span></div>
      <div class="nav-item" data-view="growth">
        <svg viewBox="0 0 24 24"><path d="M3 17 9 11l4 4 8-8"/><path d="M15 7h6v6"/></svg>
        <span>生育・環境</span><span class="cnt" data-cnt="growth"></span></div>
      <div class="nav-item" data-view="materials">
        <svg viewBox="0 0 24 24"><path d="M9 3h6v5l4 9a3 3 0 0 1-3 4H8a3 3 0 0 1-3-4l4-9z"/><path d="M7 15h10"/></svg>
        <span>資材・農薬</span><span class="cnt" data-cnt="materials"></span></div>
      <div class="nav-item" data-view="fields">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>圃場マスタ</span><span class="cnt" data-cnt="fields"></span></div>
      <div class="nav-sec">分析</div>
      <div class="nav-item" data-view="lastyear">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>去年の今頃</span></div>
      <div class="nav-sec">管理</div>
      <div class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>設定</span></div>
    </nav>
    <div class="side-foot">
      <span class="sync-pill" id="syncPill" onclick="go('settings')"><span class="dot"></span><span id="syncPillText">ローカル保存</span></span>
    </div>
  </aside>

  <!-- ================= Main ================= -->
  <div class="main">
    <header class="topbar">
      <div class="cmd">
        <div class="box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="cmd" placeholder="質問を入力（例：4号の収穫量は？ ／ ダコニールは何回使った？） Enterで実行" autocomplete="off">
          <button class="icon-btn" title="実行" onclick="askFromInput()"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <button class="icon-btn mic" id="micBtn" title="音声で質問" onclick="toggleMic()"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      </div>
      <div class="status" id="voiceStatus"></div>
      <div class="right"><span id="todayLabel"></span></div>
    </header>

    <div class="content">
      <section class="answer" id="answer">
        <div class="a-head">
          <div style="min-width:0;flex:1">
            <div class="a-q" id="answerQ"></div>
            <div class="a-main" id="answerMain"></div>
            <div class="a-detail" id="answerDetail"></div>
          </div>
          <div class="a-tools">
            <button class="icon-btn" title="もう一度読み上げ" onclick="speak(lastAnswerText)"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
            <button class="icon-btn" title="閉じる" onclick="closeAnswer()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
        </div>
      </section>
      <div id="main"></div>
    </div>
  </div>
</div>

<!-- Drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h2 id="drawerTitle">記録を追加</h2><button class="icon-btn" onclick="closeDrawer()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="db" id="drawerBody"></div>
  <div class="df"><button class="btn" onclick="closeDrawer()">キャンセル</button><button class="btn primary" id="drawerSave">保存</button></div>
</aside>
<input type="file" id="importFile" accept="application/json" hidden onchange="importData(event)">
<div id="toast"></div>

<script>
/* ======================================================================
   データ層 ― 保存キー・スキーマは旧版と互換
   ====================================================================== */
const STORE_KEY = 'cultivation_support_v1';
const CLOUD_KEY = 'cultivation_cloud_cfg_v1';
const WX_KEY    = 'cultivation_weather_v1';
const WXLOC_KEY = 'cultivation_wx_loc_v1';
const PREF_KEY  = 'cultivation_prefs_v1';
const TYPES = ['fields','harvests','tasks','growth','materials'];
const TYPE_LABEL = {fields:'圃場', harvests:'収穫', tasks:'作業', growth:'生育', materials:'資材・農薬'};
const FIELD_ORDER = ['1号ハウス','2号ハウス','3号ハウス','4号ハウス','5連','2連','岡','坂'];
const SERIES = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];

function emptyDB(){ return {fields:[],tasks:[],growth:[],harvests:[],materials:[]}; }
function load(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return Object.assign(emptyDB(), JSON.parse(raw)); }catch(e){} return emptyDB(); }
function save(){ if(MODE==='local') localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function uid(){ return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
let DB = load();
let MODE='local', WS='', FB=null;
let PREFS = (()=>{ try{ return Object.assign({tts:true}, JSON.parse(localStorage.getItem(PREF_KEY)||'{}')); }catch(e){ return {tts:true}; } })();
function savePrefs(){ localStorage.setItem(PREF_KEY, JSON.stringify(PREFS)); }

const Store = {
  async add(type, rec){
    if(MODE==='cloud' && FB){ try{ await FB.setDoc(FB.doc(FB.db,'workspaces',WS,type,rec.id), rec); }catch(e){ toast('保存エラー: '+(e.code||e.message)); } }
    else{ DB[type].unshift(rec); save(); renderAll(); }
  },
  async del(type, id){
    if(MODE==='cloud' && FB){ try{ await FB.deleteDoc(FB.doc(FB.db,'workspaces',WS,type,id)); }catch(e){ toast('削除エラー: '+(e.code||e.message)); } }
    else{ DB[type]=DB[type].filter(r=>r.id!==id); save(); renderAll(); }
  }
};

/* 圃場の色（固定順。9件目以降は灰色に畳む） */
function fieldColor(name){
  const known = FIELD_ORDER.indexOf(name);
  if(known>=0) return SERIES[known];
  const extra = DB.fields.map(f=>f.name).filter(n=>!FIELD_ORDER.includes(n));
  const i = extra.indexOf(name);
  const slot = FIELD_ORDER.filter(n=>DB.fields.some(f=>f.name===n)).length + i;
  return slot<8 ? SERIES[slot] : '#898781';
}
function fieldNames(){
  const names = DB.fields.map(f=>f.name);
  return [...FIELD_ORDER.filter(n=>names.includes(n)), ...names.filter(n=>!FIELD_ORDER.includes(n))];
}

/* ======================================================================
   ルーティング / レンダリング
   ====================================================================== */
let VIEW = 'dashboard';
const F = {   // 一覧フィルタ状態
  harvests:{field:'',from:'',to:'',q:'',sort:'date',dir:-1,page:1},
  tasks:{field:'',from:'',to:'',q:'',sort:'date',dir:-1,page:1},
  growth:{field:'',from:'',to:'',q:'',sort:'date',dir:-1,page:1},
  materials:{field:'',from:'',to:'',q:'',sort:'date',dir:-1,page:1},
  fields:{q:'',sort:'name',dir:1,page:1},
};
const PAGE = 50;
let CHART = {unit:'コンテナ', range:'12'};

function go(view){
  VIEW = view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  render();
  window.scrollTo({top:0});
}
function renderAll(){ renderCounts(); render(); }
function renderCounts(){
  document.querySelectorAll('[data-cnt]').forEach(el=>{ el.textContent = (DB[el.dataset.cnt]||[]).length.toLocaleString(); });
  const org = document.getElementById('brandOrg');
  const crops=[...new Set(DB.fields.map(f=>f.crop).filter(Boolean))];
  org.textContent = DB.fields.length ? `${crops.join('・')||'—'} ${DB.fields.length}圃場` : '圃場未登録';
}
function render(){
  const m = document.getElementById('main');
  const fn = {dashboard:viewDashboard, harvests:()=>viewList('harvests'), tasks:()=>viewList('tasks'), growth:()=>viewList('growth'),
              materials:()=>viewList('materials'), fields:()=>viewList('fields'), lastyear:viewLastYear, settings:viewSettings}[VIEW];
  m.innerHTML = fn ? fn() : '';
  if(VIEW==='dashboard') mountChart();
  if(VIEW==='lastyear') renderLastYear();
  if(VIEW==='settings') mountSettings();
}

/* ======================================================================
   ダッシュボード
   ====================================================================== */
function viewDashboard(){
  const t=today(), w=weekRange(0), mo=monthRange(0);
  const hs=DB.harvests;
  const sum=(range)=>sumStr(sumHarvest(filterByDate(hs,range)));
  const lastMat = sortByDate(DB.materials.filter(r=>r.cat==='農薬'))[0];
  const lastH = sortByDate(hs)[0];
  const dates = allRecordDates();
  const total = TYPES.reduce((s,k)=>s+DB[k].length,0);
  // 直近30日の病害虫メモ
  const since = addDays(-30);
  const alerts = {};
  ['growth','harvests','materials'].forEach(k=>DB[k].forEach(r=>{
    if(!r.date || r.date<since) return;
    const blob=(r.note||'')+(r.name||'');
    PESTS.forEach(p=>{ if(blob.includes(p)){ (alerts[p]=alerts[p]||new Set()).add(r.fieldName); } });
  }));
  const alertRows = Object.entries(alerts).slice(0,8).map(([p,fs])=>`<span class="tag warn">${esc(p)}</span> <span class="muted" style="font-size:12px">${[...fs].join('・')}</span>`).join('<br>');
  // 最近の記録
  const recent = [];
  ['harvests','tasks','growth','materials'].forEach(k=>DB[k].forEach(r=>recent.push({k,r})));
  recent.sort((a,b)=>(b.r.date||'').localeCompare(a.r.date||''));
  const tl = recent.slice(0,14).map(x=>`<div class="it"><div class="d">${esc(x.r.date)}</div><div><span class="k">${TYPE_LABEL[x.k]}</span><span class="dot" style="background:${fieldColor(x.r.fieldName)}"></span><b>${esc(x.r.fieldName)}</b> ${esc(recText(x.k,x.r))}</div></div>`).join('');
  // 圃場ランキング（表示中の期間）
  const rankRange = CHART.range==='12' ? [addDays(-365), t] : null;
  const rank = fieldNames().map(f=>{ const l=filterByDate(hs.filter(r=>r.fieldName===f),rankRange); const s=sumHarvest(l); return {f, c:s['コンテナ']||0, kg:s['kg']||0, n:l.length}; })
      .sort((a,b)=>b.c-a.c);
  const rankRows = rank.map((r,i)=>`<tr><td class="n">${i+1}</td><td class="nw"><span class="dot" style="background:${fieldColor(r.f)}"></span>${esc(r.f)}</td><td class="n">${fmtNum(r.c)}</td><td class="n">${fmtNum(r.kg)}</td><td class="n">${r.n}</td></tr>`).join('');

  return `
  <div class="page-head"><div><h1>ダッシュボード</h1><div class="sub">記録期間 ${dates[0]||'—'} 〜 ${dates[dates.length-1]||'—'} ／ 全 ${total.toLocaleString()} 件</div></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="openDrawer('harvests')">${ICON.plus} 収穫を記録</button><button class="btn" onclick="openDrawer('tasks')">${ICON.plus} 作業を記録</button></div></div>
  <div class="kpi-grid">
    <div class="kpi"><div class="l">今日の収穫</div><div class="v">${sum([t,t])}</div><div class="d">${t}</div></div>
    <div class="kpi"><div class="l">今週の収穫</div><div class="v">${sum(w)}</div><div class="d">${w[0]} 〜 ${w[1]}</div></div>
    <div class="kpi"><div class="l">今月の収穫</div><div class="v">${sum(mo)}</div><div class="d">${mo[0].slice(0,7)}</div></div>
    <div class="kpi"><div class="l">直近の収穫</div><div class="v">${lastH?esc(lastH.qty)+'<small>'+esc(lastH.unit)+'</small>':'—'}</div><div class="d">${lastH?esc(lastH.date)+' '+esc(lastH.fieldName):'記録なし'}</div></div>
    <div class="kpi"><div class="l">直近の防除</div><div class="v" style="font-size:16px">${lastMat?esc(lastMat.name):'—'}</div><div class="d">${lastMat?esc(lastMat.date)+' '+esc(lastMat.fieldName):'記録なし'}</div></div>
  </div>
  <div class="card">
    <div class="card-h"><h2>月別収穫量 <span class="sub">圃場別の積み上げ</span></h2>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="seg"><button class="${CHART.unit==='コンテナ'?'on':''}" onclick="setChart('unit','コンテナ')">コンテナ</button><button class="${CHART.unit==='kg'?'on':''}" onclick="setChart('unit','kg')">kg</button></div>
        <div class="seg"><button class="${CHART.range==='12'?'on':''}" onclick="setChart('range','12')">直近12か月</button><button class="${CHART.range==='all'?'on':''}" onclick="setChart('range','all')">全期間</button></div>
      </div></div>
    <div class="card-b" style="padding:12px 8px 0"><div class="chart" id="chart"><div class="tip" id="chartTip"></div></div></div>
    <div class="legend" id="legend"></div>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px" class="dash-cols">
    <div class="card"><div class="card-h"><h2>圃場別ランキング <span class="sub">${CHART.range==='12'?'直近12か月':'全期間'}</span></h2></div>
      <div class="card-b flush table-wrap"><table class="tbl"><thead><tr><th style="width:40px">#</th><th>圃場</th><th style="text-align:right">コンテナ</th><th style="text-align:right">kg</th><th style="text-align:right">回数</th></tr></thead><tbody>${rankRows||'<tr><td colspan="5" class="muted">データなし</td></tr>'}</tbody></table></div></div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><div class="card-h"><h2>病害虫の記録 <span class="sub">直近30日</span></h2></div><div class="card-b" style="line-height:2">${alertRows||'<span class="muted">直近30日に病害虫の記録はありません</span>'}</div></div>
      <div class="card"><div class="card-h"><h2>最近の記録</h2></div><div class="card-b flush tl">${tl||'<div class="empty">記録がありません</div>'}</div></div>
    </div>
  </div>
  <style>@media(max-width:920px){.dash-cols{grid-template-columns:1fr!important}}</style>`;
}
function setChart(k,v){ CHART[k]=v; render(); }
function recText(k,r){
  if(k==='harvests') return `${r.qty}${r.unit} ${r.grade||''} ${r.note||''}`;
  if(k==='tasks') return `${r.type} ${r.content||''}`;
  if(k==='growth') return `${r.stage||''} ${r.note||''}`;
  if(k==='materials') return `${r.cat} ${r.name} ${r.amount||''}`;
  return '';
}

/* ---- 月別積み上げ棒グラフ（SVG） ---- */
function mountChart(){
  const host=document.getElementById('chart'); if(!host) return;
  const unit=CHART.unit;
  let hs=DB.harvests.filter(r=>r.unit===unit && r.date);
  if(CHART.range==='12') hs=hs.filter(r=>r.date>=addDays(-365));
  if(!hs.length){ host.innerHTML=`<div class="tip" id="chartTip"></div><div class="empty"><b>${unit}単位の収穫記録がありません</b>単位を切り替えるか記録を追加してください</div>`; document.getElementById('legend').innerHTML=''; return; }
  const months=[...new Set(hs.map(r=>r.date.slice(0,7)))].sort();
  const names=fieldNames().filter(f=>hs.some(r=>r.fieldName===f));
  const data=months.map(m=>{ const row={m,total:0,by:{}}; names.forEach(f=>{ const v=hs.filter(r=>r.date.startsWith(m)&&r.fieldName===f).reduce((s,r)=>s+(parseFloat(r.qty)||0),0); row.by[f]=v; row.total+=v; }); return row; });
  const maxV=Math.max(...data.map(d=>d.total),1);
  const nice=niceMax(maxV);
  const W=960,H=300,L=52,R=12,T=14,B=34, pw=W-L-R, ph=H-T-B;
  const bw=Math.min(48, pw/months.length*0.62);
  const x=i=>L+(i+0.5)*(pw/months.length)-bw/2;
  const y=v=>T+ph-(v/nice)*ph;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="月別収穫量">`;
  // grid
  const ticks=5;
  for(let i=0;i<=ticks;i++){ const v=nice*i/ticks; const yy=y(v);
    svg+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${i===0?'#c3c2b7':'#e1e0d9'}" stroke-width="1"/>`;
    svg+=`<text x="${L-8}" y="${yy+4}" font-size="11" fill="#898781" text-anchor="end" font-family="inherit">${fmtNum(v)}</text>`; }
  // bars
  data.forEach((d,i)=>{ let acc=0;
    names.forEach(f=>{ const v=d.by[f]; if(!v) return;
      const y0=y(acc+v), y1=y(acc); const h=Math.max(0,y1-y0-2);  // 2px surface gap
      svg+=`<rect x="${x(i)}" y="${y0}" width="${bw}" height="${h}" fill="${fieldColor(f)}" rx="${acc===0?0:0}" data-m="${d.m}" data-f="${f}" data-v="${v}" data-t="${d.total}"/>`;
      acc+=v; });
    // rounded cap on top segment via overlay path
    svg+=`<text x="${x(i)+bw/2}" y="${H-B+16}" font-size="11" fill="#898781" text-anchor="middle" font-family="inherit">${d.m.slice(2).replace('-','/')}</text>`;
    if(d.total>0) svg+=`<text x="${x(i)+bw/2}" y="${y(d.total)-5}" font-size="11" fill="#52514e" text-anchor="middle" font-family="inherit">${fmtNum(d.total)}</text>`;
  });
  svg+='</svg>';
  host.innerHTML=`<div class="tip" id="chartTip"></div>`+svg;
  const tip=document.getElementById('chartTip');
  host.querySelectorAll('rect[data-f]').forEach(r=>{
    r.addEventListener('mousemove',e=>{ const b=host.getBoundingClientRect();
      tip.innerHTML=`<b>${r.dataset.m}</b> ${esc(r.dataset.f)}<br>${fmtNum(+r.dataset.v)} ${unit}<span style="opacity:.7">（月計 ${fmtNum(+r.dataset.t)}）</span>`;
      tip.style.display='block'; tip.style.left=(e.clientX-b.left+12)+'px'; tip.style.top=(e.clientY-b.top-10)+'px'; });
    r.addEventListener('mouseleave',()=>tip.style.display='none');
  });
  document.getElementById('legend').innerHTML=names.map(f=>`<span><i style="background:${fieldColor(f)}"></i>${esc(f)}</span>`).join('');
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
function fmtNum(v){ return (Math.round(v*10)/10).toLocaleString('ja-JP'); }

/* ======================================================================
   一覧ビュー（フィルタ・ソート・ページング・CSV）
   ====================================================================== */
const COLS = {
  harvests:[{k:'date',l:'日付',cls:'nw'},{k:'fieldName',l:'圃場',cls:'nw',f:'field'},{k:'qty',l:'数量',cls:'n',num:1},{k:'unit',l:'単位',cls:'nw'},{k:'grade',l:'等級',cls:'nw'},{k:'note',l:'メモ',cls:'wrap'}],
  tasks:[{k:'date',l:'日付',cls:'nw'},{k:'fieldName',l:'圃場',cls:'nw',f:'field'},{k:'type',l:'種別',cls:'nw',f:'tag'},{k:'content',l:'内容',cls:'wrap'},{k:'worker',l:'担当',cls:'wrap'},{k:'done',l:'状態',cls:'nw',f:'done'}],
  growth:[{k:'date',l:'日付',cls:'nw'},{k:'fieldName',l:'圃場',cls:'nw',f:'field'},{k:'stage',l:'ステージ',cls:'nw'},{k:'height',l:'草丈',cls:'n',num:1,u:'cm'},{k:'temp',l:'気温',cls:'n',num:1,u:'℃'},{k:'humidity',l:'湿度',cls:'n',num:1,u:'%'},{k:'note',l:'メモ',cls:'wrap'}],
  materials:[{k:'date',l:'日付',cls:'nw'},{k:'fieldName',l:'圃場',cls:'nw',f:'field'},{k:'cat',l:'区分',cls:'nw',f:'cat'},{k:'name',l:'名称',cls:'nw'},{k:'amount',l:'使用量',cls:'nw'},{k:'note',l:'メモ',cls:'wrap'}],
  fields:[{k:'name',l:'圃場',cls:'nw',f:'field'},{k:'crop',l:'作物',cls:'nw'},{k:'variety',l:'品種',cls:'nw'},{k:'area',l:'面積',cls:'nw'},{k:'note',l:'メモ',cls:'wrap'},{k:'_cnt',l:'記録数',cls:'n',num:1}],
};
const TITLES={harvests:'収穫・出荷',tasks:'作業記録',growth:'生育・環境',materials:'資材・農薬',fields:'圃場マスタ'};

function filtered(type){
  const f=F[type]; let list=DB[type].slice();
  if(type==='fields'){ list=list.map(r=>Object.assign({},r,{_cnt:['harvests','tasks','growth','materials'].reduce((s,k)=>s+DB[k].filter(x=>x.fieldName===r.name).length,0)})); }
  if(f.field) list=list.filter(r=>r.fieldName===f.field);
  if(f.from) list=list.filter(r=>r.date>=f.from);
  if(f.to) list=list.filter(r=>r.date<=f.to);
  if(f.q){ const q=normalize(f.q); list=list.filter(r=>normalize(Object.values(r).join(' ')).includes(q)); }
  const col=COLS[type].find(c=>c.k===f.sort)||COLS[type][0];
  list.sort((a,b)=>{ let x=a[f.sort],y=b[f.sort]; if(col.num){x=parseFloat(x)||0;y=parseFloat(y)||0; return (x-y)*f.dir;} return String(x||'').localeCompare(String(y||''),'ja')*f.dir; });
  return list;
}
function viewList(type){
  const f=F[type], cols=COLS[type], list=filtered(type);
  const pages=Math.max(1,Math.ceil(list.length/PAGE)); if(f.page>pages) f.page=pages;
  const rows=list.slice((f.page-1)*PAGE,f.page*PAGE);
  const th=cols.map(c=>`<th class="${f.sort===c.k?'sorted':''}" ${c.cls==='n'?'style="text-align:right"':''} onclick="sortBy('${type}','${c.k}')">${c.l}${f.sort===c.k?`<span class="arr">${f.dir>0?'▲':'▼'}</span>`:''}</th>`).join('')+'<th style="width:32px"></th>';
  const tr=rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.cls}">${cell(c,r)}</td>`).join('')+`<td><button class="row-x" title="削除" onclick="delRow('${type}','${r.id}')">×</button></td></tr>`).join('');
  let foot='';
  if(type==='harvests'){ const s=sumHarvest(list); foot=`<tfoot><tr><td colspan="2">合計（絞り込み ${list.length}件）</td><td class="n" colspan="2">${sumStr(s)}</td><td colspan="3"></td></tr></tfoot>`; }
  const fieldOpts=`<option value="">すべての圃場</option>`+fieldNames().map(n=>`<option ${f.field===n?'selected':''}>${esc(n)}</option>`).join('');
  return `
  <div class="page-head"><div><h1>${TITLES[type]}</h1><div class="sub">${DB[type].length.toLocaleString()}件 ／ 絞り込み ${list.length.toLocaleString()}件</div></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="exportCSV('${type}')">${ICON.download} CSV</button><button class="btn primary" onclick="openDrawer('${type}')">${ICON.plus} 追加</button></div></div>
  <div class="card">
    <div class="toolbar">
      ${type!=='fields'?`<div class="field"><label>圃場</label><select class="select" onchange="setF('${type}','field',this.value)">${fieldOpts}</select></div>
      <div class="field"><label>開始日</label><input class="input" type="date" value="${f.from}" onchange="setF('${type}','from',this.value)"></div>
      <div class="field"><label>終了日</label><input class="input" type="date" value="${f.to}" onchange="setF('${type}','to',this.value)"></div>`:''}
      <div class="field grow"><label>キーワード</label><input class="input" placeholder="名称・メモ・担当など" value="${esc(f.q)}" oninput="setF('${type}','q',this.value)"></div>
      <button class="btn sm" onclick="resetF('${type}')">条件クリア</button>
    </div>
    <div class="card-b flush table-wrap"><table class="tbl"><thead><tr>${th}</tr></thead><tbody>${tr||`<tr><td colspan="${cols.length+1}"><div class="empty"><b>該当する記録がありません</b>条件を変えるか「追加」から登録してください</div></td></tr>`}</tbody>${foot}</table></div>
    <div class="pager"><span>${list.length?((f.page-1)*PAGE+1):0}–${Math.min(f.page*PAGE,list.length)} / ${list.length.toLocaleString()}件</span><span class="spacer"></span>
      <button class="btn sm" ${f.page<=1?'disabled':''} onclick="pageF('${type}',-1)">‹ 前へ</button><span>${f.page} / ${pages}</span><button class="btn sm" ${f.page>=pages?'disabled':''} onclick="pageF('${type}',1)">次へ ›</button></div>
  </div>`;
}
function cell(c,r){
  const v=r[c.k];
  if(c.f==='field') return `<span class="dot" style="background:${fieldColor(v)}"></span>${esc(v)}`;
  if(c.f==='tag') return `<span class="tag">${esc(v)}</span>`;
  if(c.f==='done') return `<span class="tag ${v==='完了'?'good':'warn'}">${esc(v)}</span>`;
  if(c.f==='cat') return `<span class="tag ${v==='農薬'?'crit':v==='肥料'?'good':''}">${esc(v)}</span>`;
  if(c.num) return (v===''||v==null)?'—':esc(v)+(c.u||'');
  return esc(v);
}

const LY={base:today(), span:'7', field:''};
function lastYearOf(d){ const x=new Date(d+'T00:00:00'); x.setFullYear(x.getFullYear()-1); return fmt(x); }
function windowAround(d,span){ const a=new Date(d+'T00:00:00'),b=new Date(d+'T00:00:00'); a.setDate(a.getDate()-span); b.setDate(b.getDate()+span); return [fmt(a),fmt(b)]; }
function collectWindow(range, field){
  const out=[]; ['harvests','tasks','growth','materials'].forEach(k=>DB[k].forEach(r=>{ if(!r.date||r.date<range[0]||r.date>range[1]) return; if(field&&r.fieldName!==field) return; out.push({kind:k,rec:r}); }));
  return out.sort((a,b)=>a.rec.date.localeCompare(b.rec.date)||a.kind.localeCompare(b.kind));
}

      <div class="kpi"><div class="l">昨年の記録件数</div><div class="v">${items.length}</div><div class="d">収穫・作業・生育・資材</div></div>
      <div class="kpi"><div class="l">昨年の同日</div><div class="v" style="font-size:18px">${lyBase}</div><div class="d">${wxLine(lyBase)||'気象データなし'}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>昨年同時期の圃場別収穫</h2></div><div class="card-b flush table-wrap"><table class="tbl"><thead><tr><th>圃場</th><th style="text-align:right">収穫量</th><th style="text-align:right">回数</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="muted">収穫記録なし</td></tr>'}</tbody><tfoot><tr><td>合計</td><td class="n">${sumStr(sumHarvest(lyH))}</td><td class="n">${lyH.length}</td></tr></tfoot></table></div></div>`;
  // 気象
  const days=[]; for(let d=new Date(lyR[0]+'T00:00:00'); fmt(d)<=lyR[1]; d.setDate(d.getDate()+1)) days.push(fmt(d));
  const have=days.filter(d=>wxOf(d));
  const wxBox=document.getElementById('lyWeather'), wxDesc=document.getElementById('wxDesc');
  if(wxDesc) wxDesc.textContent = WX.d&&Object.keys(WX.d).length ? `${WX._start}〜${WX._end} 取得済み` : '未取得';
  if(!have.length){ wxBox.innerHTML=`<div class="empty"><b>この期間の気象データがありません</b>「気象を取得」で ${esc(WX_LOC.name)} の観測値を取り込みます（インターネット接続が必要）</div>`; }
  else{
    const maxs=have.map(d=>wxOf(d).max).filter(v=>v!=null), mins=have.map(d=>wxOf(d).min).filter(v=>v!=null), rains=have.map(d=>wxOf(d).rain).filter(v=>v!=null);
    const avg=a=>a.length?round(a.reduce((x,y)=>x+y,0)/a.length):'—';
    wxBox.innerHTML=`<div class="card-b"><div class="kpi-grid">
      <div class="kpi"><div class="l">平均最高気温</div><div class="v">${avg(maxs)}<small>℃</small></div></div>
      <div class="kpi"><div class="l">平均最低気温</div><div class="v">${avg(mins)}<small>℃</small></div></div>
      <div class="kpi"><div class="l">期間最高</div><div class="v">${maxs.length?round(Math.max(...maxs)):'—'}<small>℃</small></div></div>
      <div class="kpi"><div class="l">期間最低</div><div class="v">${mins.length?round(Math.min(...mins)):'—'}<small>℃</small></div></div>
      <div class="kpi"><div class="l">降水量計</div><div class="v">${rains.length?round(rains.reduce((a,b)=>a+b,0)):'—'}<small>mm</small></div></div></div></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>日付</th><th style="text-align:right">最高</th><th style="text-align:right">最低</th><th style="text-align:right">平均</th><th style="text-align:right">降水</th><th style="text-align:right">日照</th></tr></thead><tbody>
      ${days.map(d=>{ const w=wxOf(d), c=d===lyBase; if(!w) return `<tr><td class="nw">${d}${c?' <span class="tag warn">同日</span>':''}</td><td colspan="5" class="muted">—</td></tr>`;
        return `<tr${c?' style="background:#fff8e6"':''}><td class="nw">${d}${c?' <span class="tag warn">同日</span>':''}</td><td class="n"><b>${num(round(w.max),'℃')}</b></td><td class="n">${num(round(w.min),'℃')}</td><td class="n">${num(round(w.mean),'℃')}</td><td class="n">${w.rain?round(w.rain)+'mm':'—'}</td><td class="n">${w.sun!=null?round(w.sun/3600)+'h':'—'}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  }
  // 記録
  const box=document.getElementById('lyRecords');
  if(!items.length){ box.innerHTML=`<div class="empty"><b>昨年同時期の記録はありません</b>基準日や期間を変えてお試しください</div>`; return; }
  const byDate={}; items.forEach(it=>(byDate[it.rec.date]=byDate[it.rec.date]||[]).push(it));
  box.innerHTML='<div class="tl">'+Object.keys(byDate).sort().map(d=>{ const w=wxLine(d);
    return byDate[d].map((it,i)=>`<div class="it"><div class="d">${i===0?d:''}${i===0&&d===lyBase?'<br><span class="tag warn">同日</span>':''}${i===0&&w?`<br><span style="font-size:11px;color:var(--primary)">${w}</span>`:''}</div><div><span class="k">${TYPE_LABEL[it.kind]}</span><span class="dot" style="background:${fieldColor(it.rec.fieldName)}"></span><b>${esc(it.rec.fieldName)}</b> ${esc(recText(it.kind,it.rec))}</div></div>`).join('');
  }).join('')+'</div>';
}

let WX_LOC = (()=>{ try{ return Object.assign({lat:33.514, lon:133.870, name:'穴内（高知県安芸市）'}, JSON.parse(localStorage.getItem(WXLOC_KEY)||'{}')); }catch(e){ return {lat:33.514,lon:133.870,name:'穴内（高知県安芸市）'}; } })();
let WX = (()=>{ try{ return JSON.parse(localStorage.getItem(WX_KEY))||{}; }catch(e){ return {}; } })();
function saveWx(){ try{ localStorage.setItem(WX_KEY, JSON.stringify(WX)); }catch(e){} }
function allRecordDates(){ const s=new Set(); ['harvests','tasks','growth','materials'].forEach(k=>DB[k].forEach(r=>{ if(r.date) s.add(r.date); })); return [...s].sort(); }
async function loadWeather(force){
  const dates=allRecordDates();
  let start=dates.length?dates[0]:addDays(-400), end=today();
  const ly=lastYearOf(LY.base||today()); if(ly<start) start=ly;
  if(!force && WX._start===start && WX._end===end && WX.d){ renderLastYear(); return; }
  toast('気象データを取得しています…');
  const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${WX_LOC.lat}&longitude=${WX_LOC.lon}&start_date=${start}&end_date=${end}&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,sunshine_duration&timezone=Asia%2FTokyo`;
  try{
    const res=await fetch(url); if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json(), dd=j.daily||{}, map={};
    (dd.time||[]).forEach((t,i)=>{ map[t]={max:dd.temperature_2m_max[i],min:dd.temperature_2m_min[i],mean:dd.temperature_2m_mean[i],rain:dd.precipitation_sum[i],sun:dd.sunshine_duration?dd.sunshine_duration[i]:null}; });
    WX={d:map,_start:start,_end:end,_at:today()}; saveWx(); toast(`気象データを取得しました（${Object.keys(map).length}日分）`);
  }catch(e){ toast('気象の取得に失敗: '+e.message); }
  renderLastYear();
}
function wxOf(d){ return (WX.d||{})[d]||null; }
function wxLine(d){ const w=wxOf(d); if(!w) return ''; const t=[]; if(w.max!=null) t.push(`最高${round(w.max)}℃`); if(w.min!=null) t.push(`最低${round(w.min)}℃`); if(w.rain) t.push(`雨${round(w.rain)}mm`); return t.join(' / '); }

function parseFirebaseConfig(text){ const s=text.indexOf('{'), e=text.lastIndexOf('}'); if(s<0||e<=s) throw new Error('firebaseConfig の形式が正しくありません'); const cfg=(new Function('return ('+text.slice(s,e+1)+')'))(); if(!cfg||!cfg.projectId) throw new Error('projectId が見つかりません'); return cfg; }
async function doConnect(){ let cfg; try{ cfg=parseFirebaseConfig(val('cf_config')); }catch(e){ toast(e.message); return; } const ws=val('cf_ws'); if(!ws){ toast('ワークスペースIDを入力してください'); return; } await cloudConnect(cfg, ws, val('cf_name')); }

async function cloudConnect(cfg, wsId, name){
  setSync('connecting','接続中…');
  try{
    const appMod=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
    const fs=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`);
    const appName='cultivation-'+wsId; const app=(appMod.getApps()||[]).find(a=>a.name===appName)||appMod.initializeApp(cfg, appName);
    const db=fs.getFirestore(app);
    try{ const authMod=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`); await authMod.signInAnonymously(authMod.getAuth(app)); }catch(e){}
    if(FB&&FB.unsub) FB.unsub.forEach(u=>u&&u());
    FB={db, doc:fs.doc, setDoc:fs.setDoc, deleteDoc:fs.deleteDoc, unsub:[]}; WS=wsId; MODE='cloud'; DB=emptyDB();
    TYPES.forEach(t=>FB.unsub.push(fs.onSnapshot(fs.collection(db,'workspaces',WS,t), snap=>{ DB[t]=snap.docs.map(d=>Object.assign({id:d.id},d.data())); renderAll(); setSync('on','同期中：'+WS); },
      err=>{ setSync('err','同期エラー: '+(err.code||err.message)); toast('同期エラー: '+(err.code||err.message)); })));
    saveCloudCfg({config:cfg, wsId, name}); setSync('on','同期中：'+WS); renderAll(); toast('クラウドに接続しました');
  }catch(e){ MODE='local'; FB=null; setSync('err','接続失敗: '+(e.code||e.message)); toast('接続に失敗: '+(e.code||e.message)); }
}
function cloudDisconnect(){ if(FB&&FB.unsub) FB.unsub.forEach(u=>u&&u()); FB=null; MODE='local'; WS=''; clearCloudCfg(); DB=load(); setSync('off','ローカル保存'); renderAll(); }
async function cloudReplaceAll(newDB){ if(MODE!=='cloud'||!FB) return; for(const t of TYPES){ for(const r of DB[t].slice()) await FB.deleteDoc(FB.doc(FB.db,'workspaces',WS,t,r.id)); for(const r of (newDB[t]||[])) await FB.setDoc(FB.doc(FB.db,'workspaces',WS,t,r.id||uid()), r); } }

const KANJI_NUM={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
function parseMonthQuery(q){
  const m=q.match(/(去年|昨年|今年)?\s*([0-9０-９]{1,2}|[一二三四五六七八九十]{1,3})月/); if(!m) return null;

  if(!mon||mon<1||mon>12) return null;
  const now=new Date(); let year=now.getFullYear();
  if(m[1]==='去年'||m[1]==='昨年') year-=1; else if(!m[1] && mon>now.getMonth()+1) year-=1;
  return {range:[fmt(new Date(year,mon-1,1)),fmt(new Date(year,mon,0))], label:`${year}年${mon}月`};
}
const CATEGORY_KW=[

  {key:'materials',label:'資材・農薬',kw:['農薬','防除','消毒','散布','肥料','施肥','資材','薬']},

function runQuery(qRaw){
  const q=normalize(qRaw);
  let dateRange=null, dateLabel='', hasDate=false;
  for(const key in REL_DATE){ if(q.includes(key)){ dateRange=REL_DATE[key](); dateLabel=key; hasDate=true; break; } }
  const mq=parseMonthQuery(q); if(mq){ dateRange=mq.range; dateLabel=mq.label; hasDate=true; }
  const field=matchField(q), crop=matchCrop(q), fields2=matchFields(q), material=matchMaterial(q), pest=matchPest(q), worker=matchWorker(q);
  const wantCount=/何回|なんかい|回数|何度/.test(q), wantCompare=/どっち|どちら|くらべ|比べ|比較|一番|いちばん|最も|多い順|ランキング|多かった/.test(q);
  const wantLastYear=/去年の今頃|昨年の今頃|去年の今|昨年の今|一年前|1年前|前年の今/.test(q);
  const wantWeather=/天気|気象|降水|雨量|日照/.test(q)||(/気温|温度|最高|最低/.test(q)&&!/設定|管理/.test(q));
  const wantTemp=/気温|温度|最高|最低/.test(q), wantHumidity=q.includes('湿度'), wantLatest=/最後|直近|いつ|前回|最新/.test(q), wantWhere=/どこ|場所/.test(q);
  const hasWx=!!(WX.d&&Object.keys(WX.d).length);
  if(wantWeather&&hasWx){ if(wantLastYear){ const lyBase=lastYearOf(LY.base||today()); const isDay=/今日|同日|その日/.test(q); return answerWeather(isDay?[lyBase,lyBase]:windowAround(lyBase,7), isDay?`昨年の同日（${lyBase}）`:'昨年の同時期', q); } return answerWeather(dateRange,dateLabel,q); }
  if(wantLastYear) return answerLastYear(field);
  if(material) return answerMaterialName(material,dateRange,dateLabel,field,wantCount);
  if(pest) return answerPest(pest,dateRange,dateLabel,field);
  if(worker&&!field) return answerWorker(worker,dateRange,dateLabel);
  let cat=null; for(const c of CATEGORY_KW){ if(c.kw.some(k=>q.includes(k))){ cat=c; break; } }
  if(wantCompare) return answerCompare(cat&&cat.key==='materials'?'materials':'harvests',dateRange,dateLabel,fields2);
  if((cat&&cat.key==='fields')||(crop&&!cat&&!hasDate)||wantWhere) return answerFields(crop,field);
  if(!cat){ if(field&&!hasDate) return answerFieldSummary(field); if(field||hasDate) cat=CATEGORY_KW.find(c=>c.key==='tasks');
    else return {ok:false,main:'質問の内容を認識できませんでした。',detail:'「今日の作業」「4号の収穫量は？」「一番採れたのは？」「ダコニールは何回使った？」「去年の今頃は？」のように話してください。'}; }
  if(cat.key==='harvests') return answerHarvests(dateRange,dateLabel,field,crop);
  if(cat.key==='materials') return answerMaterials(dateRange,dateLabel,field,wantLatest);
  if(cat.key==='growth') return answerGrowth(dateRange,dateLabel,field,wantTemp,wantHumidity);
  if(cat.key==='tasks') return answerTasks(dateRange,dateLabel,field);
  return {ok:false,main:'該当するデータが見つかりませんでした。',detail:''};
}
const row=(s)=>`<div class="row">${s}</div>`;

function answerCompare(kind,range,label,only){

function matchMaterial(q){ const names=[...new Set(DB.materials.map(r=>r.name).filter(Boolean))].sort((a,b)=>b.length-a.length); for(const n of names){ const core=normalize(n).replace(/[0-9０-９]/g,''); if(q.includes(normalize(n))) return n; if(core.length>=4&&q.includes(core.slice(0,5))) return n; } return null; }
function answerMaterialName(name,range,label,field,wantCount){

function matchPest(q){ for(const p of PESTS){ if(q.includes(normalize(p))) return p; } return null; }
function answerPest(pest,range,label,field){

function answerWorker(worker,range,label){
  const list=sortByDate(filterByDate(DB.tasks,range).filter(r=>String(r.worker||'').includes(worker))); const scope=label||'全期間';
  if(!list.length) return {ok:false,tab:'tasks',main:`${scope}の${worker}さんの作業記録はありません。`,detail:''};
  const byType={}; list.forEach(r=>byType[r.type]=(byType[r.type]||0)+1);
  return {ok:true,tab:'tasks',main:`${scope}の${worker}さんの作業は ${list.length}件です。（直近 ${list[0].date}）`,detail:row(`内訳：${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`${esc(t)} ${n}件`).join('、')}`)+list.slice(0,8).map(r=>row(`${esc(r.date)} ｜ ${esc(r.fieldName)} ｜ <b>${esc(r.type)}</b> ${esc(r.content)||''}`)).join('')};
}
function answerFieldSummary(field){
  const f=DB.fields.find(x=>x.name===field), h=DB.harvests.filter(r=>r.fieldName===field), t=DB.tasks.filter(r=>r.fieldName===field), m=DB.materials.filter(r=>r.fieldName===field), g=DB.growth.filter(r=>r.fieldName===field), last=sortByDate(h)[0];
  return {ok:true,tab:'harvests',main:`${field}は${f&&f.crop?f.crop:'—'}、通算の収穫は ${sumStr(sumHarvest(h))}（${h.length}回）です。`,detail:row(`${esc(field)} ｜ ${esc(f&&f.crop||'')} ${f&&f.variety?'（'+esc(f.variety)+'）':''} ｜ ${esc(f&&f.note||'')}`)+row(`作業 ${t.length}件 ／ 資材・農薬 ${m.length}件 ／ 生育メモ ${g.length}件`)+(last?row(`最終収穫 ${esc(last.date)} … ${esc(last.qty)}${esc(last.unit)}`):'')};
}
function answerWeather(range,label,q){
  let days=Object.keys(WX.d).sort(); if(range) days=days.filter(d=>d>=range[0]&&d<=range[1]); const scope=label||'記録のある全期間';
  if(!days.length) return {ok:false,tab:'lastyear',main:`${scope}の気象データがありません。`,detail:'「去年の今頃」の「気象を取得」で取り込めます。'};
  const maxs=days.map(d=>WX.d[d].max).filter(v=>v!=null), mins=days.map(d=>WX.d[d].min).filter(v=>v!=null), rains=days.map(d=>WX.d[d].rain).filter(v=>v!=null); const avg=a=>a.length?round(a.reduce((x,y)=>x+y,0)/a.length):'—'; let main;
  if(days.length===1){ const w=WX.d[days[0]]; main=`${days[0]}の${WX_LOC.name}は 最高${round(w.max)}℃・最低${round(w.min)}℃`+(w.rain?`、降水${round(w.rain)}mm`:'、降水なし')+'です。'; }
  else if(/最高/.test(q)&&!/最低/.test(q)) main=`${scope}の最高気温は 平均${avg(maxs)}℃、最も高い日で ${round(Math.max(...maxs))}℃ です。`;
  else if(/最低/.test(q)&&!/最高/.test(q)) main=`${scope}の最低気温は 平均${avg(mins)}℃、最も低い日で ${round(Math.min(...mins))}℃ です。`;
  else main=`${scope}（${days.length}日間）は 平均最高${avg(maxs)}℃・平均最低${avg(mins)}℃、降水計${round(rains.reduce((a,b)=>a+b,0))}mm です。`;
  return {ok:true,tab:'lastyear',main,detail:days.slice(-10).map(d=>{const w=WX.d[d];return row(`${d} ｜ 最高<b>${round(w.max)}℃</b> 最低${round(w.min)}℃ ${w.rain?'雨'+round(w.rain)+'mm':''}`);}).join('')};
}
function answerLastYear(field){
  const lyBase=lastYearOf(LY.base||today()), range=windowAround(lyBase,7), items=collectWindow(range,field), h=DB.harvests.filter(r=>r.date>=range[0]&&r.date<=range[1]&&(!field||r.fieldName===field)), w=wxOf(lyBase), scope=field?field+'の':'';
  if(!items.length) return {ok:false,tab:'lastyear',main:`昨年の同時期（${range[0]}〜${range[1]}）の${scope}記録はありません。`,detail:''};
  let main=`昨年の同時期（${lyBase}前後1週間）の${scope}収穫は ${sumStr(sumHarvest(h))}、記録は全${items.length}件です。`; if(w) main+=` この日の気温は最高${round(w.max)}℃・最低${round(w.min)}℃でした。`;
  return {ok:true,tab:'lastyear',main,detail:items.slice(0,10).map(it=>row(`<span class="k muted">${TYPE_LABEL[it.kind]}</span> ${esc(it.rec.date)} ｜ ${esc(it.rec.fieldName)} ｜ ${esc(recText(it.kind,it.rec))}`)).join('')};
}
function fieldVariants(name){ const v=[name,name.replace(/ハウス$/,''),name.replace(/(圃場|ほ場)$/,'')]; return [...new Set(v)].filter(s=>s&&(s.length>=2||s===name)).sort((a,b)=>b.length-a.length); }
function stripMonth(q){ return q.replace(/([0-9０-９]{1,2}|[一二三四五六七八九十]{1,3})月/g,'　'); }
function matchField(q){ const s=stripMonth(q), cand=DB.fields.map(f=>f.name).sort((a,b)=>b.length-a.length); for(const n of cand){ for(const v of fieldVariants(n)){ if(s.includes(normalize(v))) return n; } } return null; }
function matchFields(q){ const s=stripMonth(q), found=[]; DB.fields.map(f=>f.name).forEach(n=>{ for(const v of fieldVariants(n)){ const i=s.indexOf(normalize(v)); if(i>=0){ found.push({n,i}); break; } } }); return [...new Map(found.sort((a,b)=>a.i-b.i).map(x=>[x.n,x])).values()].map(x=>x.n); }
function matchCrop(q){ const crops=[...new Set(DB.fields.map(f=>f.crop).filter(Boolean))].sort((a,b)=>b.length-a.length); for(const c of crops){ if(q.includes(normalize(c))) return c; } return null; }
function sumHarvest(list){ const by={}; list.forEach(r=>{ const u=r.unit||'kg'; by[u]=(by[u]||0)+(parseFloat(r.qty)||0); }); return by; }
function sumStr(by){ const e=Object.entries(by).filter(([,v])=>v>0); return e.length?e.map(([u,v])=>`${fmtNum(v)}${u}`).join('、'):'—'; }

/* --- 日付ユーティリティ --- */
function today(){ return fmt(new Date()); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmt(d); }
function fmt(d){ const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function weekRange(o){ const d=new Date(); const day=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-day+o*7); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return [fmt(mon),fmt(sun)]; }
function monthRange(o){ const d=new Date(); return [fmt(new Date(d.getFullYear(),d.getMonth()+o,1)),fmt(new Date(d.getFullYear(),d.getMonth()+o+1,0))]; }
function yearRange(o){ const y=new Date().getFullYear()+o; return [`${y}-01-01`,`${y}-12-31`]; }
function filterByDate(list,range){ if(!range) return list.slice(); return list.filter(r=>r.date>=range[0]&&r.date<=range[1]); }
function sortByDate(list){ return list.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }

/* ======================================================================
   質問の実行（テキスト・音声）と読み上げ
   ====================================================================== */
let lastAnswerText='';
function askFromInput(){ const el=document.getElementById('cmd'); const q=el.value.trim(); if(!q) return; ask(q); el.select(); }
function ask(q){
  const res=runQuery(q); lastAnswerText=res.main+(res.ok&&res.detail?'。詳細を画面に表示しました。':'');
  const box=document.getElementById('answer'); box.classList.add('show'); box.classList.toggle('warn',!res.ok);
  document.getElementById('answerQ').textContent='Q. '+q; document.getElementById('answerMain').textContent=res.main; document.getElementById('answerDetail').innerHTML=res.detail||'';
  if(PREFS.tts) speak(lastAnswerText);
  if(res.ok&&res.tab&&VIEW!==res.tab){ /* 回答に関連する画面へは移動せず、パネルで完結 */ }
}
function closeAnswer(){ document.getElementById('answer').classList.remove('show'); }
function speak(text){ if(!text||!('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,'')); u.lang='ja-JP'; u.rate=1.05; const jp=(window.speechSynthesis.getVoices()||[]).find(v=>v.lang&&v.lang.startsWith('ja')); if(jp) u.voice=jp; u.onstart=()=>{TTS_ON=true; setVoiceStatus('回答を読み上げ中…');}; u.onend=()=>{TTS_ON=false; setVoiceStatus('');}; window.speechSynthesis.speak(u); }
if('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();

/* --- 音声認識 --- */
let recognition=null, listening=false, TTS_ON=false, lastVoiceError='';
function setVoiceStatus(t){ document.getElementById('voiceStatus').textContent=t; }
function voiceSupport(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; return {api:!!SR, secure:!!window.isSecureContext, proto:location.protocol, framed:window.top!==window.self, online:navigator.onLine}; }
function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ document.getElementById('micBtn').disabled=true; return; }
  recognition=new SR(); recognition.lang='ja-JP'; recognition.interimResults=true; recognition.continuous=false;
  recognition.onstart=()=>{ listening=true; document.getElementById('micBtn').classList.add('rec'); setVoiceStatus('お聞きしています…'); };
  recognition.onend=()=>{ listening=false; document.getElementById('micBtn').classList.remove('rec'); if(!TTS_ON) setVoiceStatus(''); };
  recognition.onerror=e=>{ lastVoiceError=e.error; const msg=VOICE_ERR[e.error]||('認識エラー: '+e.error); setVoiceStatus(msg); toast(msg); if(e.error==='not-allowed'||e.error==='service-not-allowed'){ go('settings'); } };
  recognition.onresult=e=>{ if(TTS_ON) return; let interim='',fin=''; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t; else interim+=t; }
    document.getElementById('cmd').value=fin||interim; if(fin) ask(fin); };
}
const VOICE_ERR={
  'not-allowed':'マイクの使用が許可されていません。アドレスバーのマイク（🔒/🎤）アイコンから「許可」にしてください。',
  'service-not-allowed':'このページではマイクが使えません。プレビュー内ではなく、ファイルを直接 Chrome で開くか、https のURLで開いてください。',
  'no-speech':'音声が聞き取れませんでした。もう一度マイクを押して、はっきり話してください。',
  'audio-capture':'マイクが見つかりません。マイクの接続と、他のアプリが使用中でないか確認してください。',
  'network':'音声認識サービスに接続できません。インターネット接続を確認してください。',
  'aborted':'音声入力を中止しました。',
};
function toggleMic(){
  if(!recognition){ toast('このブラウザは音声入力に非対応です。Chrome または Safari をお使いください。テキスト入力は利用できます。'); document.getElementById('cmd').focus(); return; }
  if(listening){ recognition.stop(); return; }
  try{ recognition.start(); }catch(e){ toast('マイクを開始できませんでした: '+e.message); }
}
function renderVoiceDiag(){
  const el=document.getElementById('voiceDiag'); if(!el) return; const s=voiceSupport();
  const ok=(b)=>b?'<span class="tag good">OK</span>':'<span class="tag crit">NG</span>';
  const issues=[];
  if(!s.api) issues.push('このブラウザは音声認識（Web Speech API）に対応していません。<b>Google Chrome</b>（PC/Android）または <b>Safari</b>（iPhone/iPad）でお使いください。');
  if(s.framed) issues.push('このページは別の画面の中（プレビュー）で表示されています。<b>プレビュー内ではマイクが使えません。</b>HTMLファイルを直接ブラウザで開いてください。');
  if(!s.secure) issues.push('安全な接続（https または file）ではないためマイクが使えません。');
  if(!s.online) issues.push('オフラインです。音声認識にはインターネット接続が必要です（テキスト入力は使えます）。');
  if(lastVoiceError) issues.push('直近のエラー：'+esc(VOICE_ERR[lastVoiceError]||lastVoiceError));
  el.innerHTML=`<div class="kv">
    <div class="k">音声認識API</div><div>${ok(s.api)} ${s.api?'利用可能':'非対応'}</div>
    <div class="k">表示方法</div><div>${ok(!s.framed)} ${s.framed?'プレビュー（埋め込み）内':'直接表示'} <span class="muted">${esc(s.proto)}</span></div>
    <div class="k">安全な接続</div><div>${ok(s.secure)} ${s.secure?'はい':'いいえ'}</div>
    <div class="k">インターネット</div><div>${ok(s.online)} ${s.online?'接続中':'オフライン'}</div>
    <div class="k">読み上げ</div><div>${ok('speechSynthesis' in window)}</div></div>
    ${issues.length?`<div class="callout" style="margin-top:12px">${issues.map(i=>'・'+i).join('<br>')}</div>`:`<div class="callout ok" style="margin-top:12px">音声照会を使える状態です。上のマイクボタンを押して質問してください。初回はブラウザがマイクの許可を求めます。</div>`}
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="toggleMic()">マイクをテスト</button><button class="btn" onclick="speak('読み上げのテストです。')">読み上げをテスト</button></div>
    <div class="muted" style="font-size:12px;margin-top:10px">マイクが使えない環境でも、上部の入力欄に質問を入力して Enter で同じ照会ができます。</div>`;
}

/* ======================================================================
   共通ユーティリティ
   ====================================================================== */
const ICON={
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  download:'<svg viewBox="0 0 24 24"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"/></svg>',
  upload:'<svg viewBox="0 0 24 24"><path d="M12 21V9M6 13l6-6 6 6M4 3h16"/></svg>',
  cloud:'<svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 17.5 18z"/></svg>',
};
function val(id){ const el=document.getElementById(id); return el?String(el.value).trim():''; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v,u){ return (v===''||v==null||isNaN(v))?'—':v+u; }
function round(n){ return Math.round(n*10)/10; }
function normalize(s){ return String(s).replace(/\s+/g,'').toLowerCase(); }
let toastTimer=null; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

/* ======================================================================
   初期化
   ====================================================================== */
(function init(){
  document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>go(n.dataset.view)));
  document.getElementById('cmd').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); askFromInput(); } });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); } if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); document.getElementById('cmd').focus(); } });
  initSpeech();
  renderCounts();
  const cc=loadCloudCfg(); if(cc&&cc.config&&cc.wsId){ cloudConnect(cc.config,cc.wsId,cc.name||''); }
  go('dashboard');
  const s=voiceSupport(); if(s.framed) setVoiceStatus('プレビュー内ではマイクは使えません。テキスト入力は利用できます。');
})();
</script>
