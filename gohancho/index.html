<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>わが家のごはん帖</title>
<meta name="description" content="毎日の献立・冷蔵庫の材料から・定番のひとひねり。家事を励ます料理アプリ">
<meta name="theme-color" content="#22406b">
<script>try{var gs=(JSON.parse(localStorage.getItem('gohancho.v1')||'null')||{}).settings||{},gu=gs.uiLang||'auto';if((gu!=='auto'&&gu!=='ja')||(gu==='auto'&&gs.country!=='JP')){document.documentElement.classList.add('i18n-wait');setTimeout(function(){document.documentElement.classList.remove('i18n-wait')},4000)}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ごはん帖">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* レイアウト: 1カラムの献立帳。主役は「お膳」を真上から見た図（奥左=副菜・奥右=主菜・手前左=ご飯・手前右=汁もの）。
   色: 操作はすべて藍の1色。山吹は「変えたところ・プラス」の目印だけ。器は染付・漆・青磁。書体: 見出しは明朝（品書き）、本文は角ゴシック
   形: 白いカード（.card）1種類・角丸16px・見出しは「章（h2）」と「カードの小見出し（.eyebrow）」の2段だけ */
:root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#e4e9ef;
    --ink:#172033;
    --muted:#5b6679;
    --line:#d4dbe4;
    --accent:#22406b;          /* 藍 */
    --accent-ink:#ffffff;
    --accent-soft:#dde6f2;
    --yolk:#c98e0c;            /* 山吹: 変えたところ・プラスの目印だけ */
    --yolk-soft:#f6ecd2;
    --yolk-ink:#5b3f00;
    --danger:#b23a2a;
    --sun:#b23a2a; --sat:#2d5b9a;
    /* 器と膳（イラスト。どちらのテーマでも同じ色） */
    --tray:#2b211d; --tray-2:#3a2b25; --tray-edge:#7d2a1f; --tray-ink:#f5eee3; --tray-muted:#c9b9a6;
    --porcelain:#fbfaf6; --rim:#2c4c7c; --lacquer:#8f2b1f; --lacquer-dark:#1c1210; --celadon:#a4c3b2; --celadon-dark:#7e9f8d; --rice:#f6f3ea;
    --shadow:0 1px 2px rgba(23,32,51,.06),0 8px 24px rgba(23,32,51,.08);
    --font-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
    --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;
    --r:16px;
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --bg:#10151d;--surface:#18202b;--surface-2:#212b38;--ink:#e6eaf0;--muted:#94a1b3;--line:#2c3746;
        --accent:#9dbbe6;--accent-ink:#0c1522;--accent-soft:#1f2d42;
        --yolk:#e9b53c;--yolk-soft:#33290f;--yolk-ink:#f6e0a6;--danger:#ef8b7a;--sun:#ef8b7a;--sat:#9dbbe6;
        --tray:#231a17;--tray-2:#30241f;
        --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
        color-scheme:dark;
    }
}
:root[data-theme="dark"]{
    --bg:#10151d;--surface:#18202b;--surface-2:#212b38;--ink:#e6eaf0;--muted:#94a1b3;--line:#2c3746;
    --accent:#9dbbe6;--accent-ink:#0c1522;--accent-soft:#1f2d42;
    --yolk:#e9b53c;--yolk-soft:#33290f;--yolk-ink:#f6e0a6;--danger:#ef8b7a;--sun:#ef8b7a;--sat:#9dbbe6;
    --tray:#231a17;--tray-2:#30241f;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;padding-inline:16px}
.wrap{max-width:680px;margin:0 auto;padding-block:18px 124px;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.35;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダー: 品書きの題字＋落款 */
.top{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;flex-shrink:0;border:2px solid var(--lacquer);color:var(--lacquer);border-radius:6px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1;transform:rotate(-4deg)}
.top h1{font-size:1.45rem}
.top .date{font-size:.8rem;color:var(--muted);letter-spacing:.12em}

/* 見出し */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-direction:column;gap:2px}
.sec-head h2{font-size:1.3rem;padding-left:12px;border-left:4px solid var(--accent)}
.sec-head h3{font-size:1rem;margin-top:8px}
.sec-head .hint{font-size:.8rem;color:var(--muted)}
.sec-head h2+.hint{padding-left:16px}
/* カード: 画面の中の囲みはすべてこれ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.16em;color:var(--accent);font-weight:700}
.foot{font-size:.76rem;color:var(--muted);margin:0;line-height:1.7}
.sec-head.split{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label{font-size:.72rem;letter-spacing:.16em;color:var(--accent);font-weight:700}

/* ボタン */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.5rem 1rem;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;transition:background .15s,border-color .15s,transform .1s;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.sm{min-height:34px;padding:.25rem .75rem;font-size:.8rem}
.btn.danger{color:var(--danger)}
.btn.wide{flex:1 1 auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* チップ */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .85rem;font-size:.84rem;display:inline-flex;align-items:center;gap:.35rem;min-height:36px;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .x{border:0;background:transparent;padding:0 0 0 .1rem;font-size:1rem;line-height:1;color:inherit;opacity:.7}
.chip.have{background:var(--accent-soft);border-color:transparent}
.badge{display:inline-block;font-size:.7rem;padding:.02rem .5rem;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-right:4px;vertical-align:1px;white-space:nowrap}
.badge.fav{background:var(--yolk-soft);color:var(--yolk-ink)}
.badge.new{background:var(--accent-soft);color:var(--accent)}

/* お膳 */
.tray{
    background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%);
    border-radius:var(--r);padding:18px 14px 16px;box-shadow:inset 0 0 0 2px var(--tray-edge),inset 0 0 0 7px var(--tray),inset 0 0 0 8px rgba(255,255,255,.06),0 14px 30px rgba(20,12,8,.25);
    display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"side main" "rice soup";gap:14px 10px;color:var(--tray-ink)
}
.spot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.vessel{position:relative;aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--porcelain);transition:transform .2s ease;max-width:100%}
.vessel:hover{transform:translateY(-2px) scale(1.02)}
.vessel .food{position:absolute;border-radius:47% 53% 50% 50%/55% 45% 55% 45%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.4),transparent 42%),var(--food,#a8652b);background-size:cover;background-position:center}
.vessel .food.photo{border-radius:50%;background-image:var(--img);background-size:cover;background-position:center;background-repeat:no-repeat}
/* ChatGPT で作った絵: 器ごと描いてあるので、アプリの器は消して絵だけを出す */
.vessel.gen,.vessel.gen:hover{background:none;box-shadow:none}
.vessel.gen::before{display:none}
.vessel.gen .food.photo,.v-plate.gen .food.photo,.v-kobachi.gen .food.photo{inset:-4%;border-radius:0;background-color:transparent;background-size:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.thumb.gen{background-color:var(--porcelain);background-size:112%}
.hero.gen{background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%)}
.hero.gen img{object-fit:contain;padding:10px 0 26px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.v-plate{width:92%;box-shadow:inset 0 0 0 6px var(--porcelain),inset 0 0 0 8px var(--rim),inset 0 -8px 18px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.45)}
.v-plate .food{inset:20%}.v-plate .food.photo{inset:11%}
.v-donburi{width:92%;background:repeating-conic-gradient(var(--rim) 0 5deg,var(--porcelain) 5deg 15deg);box-shadow:0 8px 16px rgba(0,0,0,.45)}
.v-donburi::before{content:"";position:absolute;inset:7%;border-radius:50%;background:var(--porcelain)}
.v-donburi .food{inset:14%}
.v-donburi.noodle .food:not(.photo){background:repeating-linear-gradient(35deg,rgba(255,255,255,.45) 0 2px,transparent 2px 6px),var(--food)}
.v-kobachi{width:68%;background:radial-gradient(circle,var(--celadon) 0 62%,var(--celadon-dark) 63% 100%);box-shadow:0 6px 12px rgba(0,0,0,.45)}
.v-kobachi .food{inset:22%}.v-kobachi .food.photo{inset:14%}
.v-wan{width:72%;background:var(--lacquer);box-shadow:inset 0 0 0 5px var(--lacquer-dark),0 6px 12px rgba(0,0,0,.5)}
.v-wan .food{inset:13%;border-radius:50%}
.v-chawan{width:62%;box-shadow:inset 0 0 0 4px var(--porcelain),inset 0 0 0 6px var(--rim),inset 0 0 0 9px var(--porcelain),inset 0 0 0 10px var(--rim),0 6px 12px rgba(0,0,0,.45)}
.v-chawan .food{inset:17%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 1.5px,transparent 2px) 0 0/7px 7px,radial-gradient(circle at 70% 60%,#e9e3d3 0 1.5px,transparent 2px) 0 0/9px 9px,var(--rice)}
.v-konomono{width:50%;border-radius:14%;box-shadow:inset 0 0 0 3px var(--porcelain),inset 0 0 0 4px var(--rim),0 5px 10px rgba(0,0,0,.45)}
.v-konomono .food.photo{inset:12%;border-radius:8%}
.v-konomono .food{inset:26%;border-radius:4px;background:repeating-linear-gradient(90deg,#e7c34a 0 7px,#d9af2a 7px 8px)}
.spot-label{display:flex;flex-direction:column;gap:0;min-width:0;max-width:100%}
.spot-label .slot{font-size:.66rem;letter-spacing:.2em;color:var(--tray-muted)}
.spot-label .nm{font-family:var(--font-display);font-weight:700;font-size:.98rem;line-height:1.35;overflow-wrap:anywhere}
.spot-label .mt{font-size:.7rem;color:var(--tray-muted)}
.spot-label .last{font-size:.66rem;color:#f0c874}
.credit{font-size:.7rem;color:var(--muted)}

/* ひとひねり */
.tw-item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.tw-item:first-of-type,.eyebrow+.tw-item{border-top:0;padding-top:0}
.thumb{display:block;width:64px;height:64px;border-radius:50%;background:var(--surface-2);background-size:cover;background-position:center;box-shadow:inset 0 0 0 3px var(--porcelain),0 2px 6px rgba(0,0,0,.15);flex-shrink:0;position:relative}
.thumb.none{background:radial-gradient(circle,var(--food,#a8652b) 0 36%,var(--porcelain) 37%)}
.tw-name{font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.4;cursor:pointer;color:var(--ink)}
.from{font-size:.78rem;color:var(--muted)}
.changes{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.changes li{font-size:.72rem;background:var(--yolk-soft);border-radius:999px;padding:.05rem .55rem;color:var(--yolk-ink)}

/* リスト */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500;cursor:pointer;min-width:0}
.item .t:hover{color:var(--accent)}
.item .s{font-size:.76rem;color:var(--muted);font-weight:400}
.empty{padding:18px 14px;color:var(--muted);font-size:.88rem}
.note{font-size:.85rem;background:var(--accent-soft);border-radius:12px;padding:.7rem .9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* 入力 */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:.8rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .75rem;width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
.inputbar{display:grid;grid-template-columns:1fr auto auto;gap:8px}
@media (max-width:420px){.inputbar{grid-template-columns:1fr auto}.inputbar #mic-btn{grid-column:1/-1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted);cursor:pointer}
.check input{margin-top:.3rem;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}

/* 材料マッチ */
.match{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.match:first-child{border-top:0}
.match .thumb{width:52px;height:52px;cursor:pointer}
.match .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.match .head{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.match .head .name{font-family:var(--font-display);font-weight:700;font-size:1rem}
.meter{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;width:64px;flex-shrink:0}
.meter i{display:block;height:100%;background:var(--accent)}
.ings{font-size:.8rem;color:var(--muted);line-height:1.8}
.ings b{color:var(--accent);font-weight:700}
.ings .miss{color:var(--danger)}
.ings .sub{color:var(--yolk-ink);background:var(--yolk-soft);border-radius:4px;padding:0 .25rem}

/* 週プラン */
.week .item{grid-template-columns:48px 1fr auto}
.day{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.day .dd{font-family:var(--font-display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.day .wd{font-size:.68rem;color:var(--muted)}
.day.sun .wd,.day.sun .dd{color:var(--sun)}.day.sat .wd,.day.sat .dd{color:var(--sat)}
.day.today .dd{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* 統計 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat .n{font-family:var(--font-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:.72rem;color:var(--muted)}

details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:0 16px}
details.box>summary{padding:14px 0;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:'＋';color:var(--muted)}
details.box[open]>summary::after{content:'－'}
details.box .inner{padding-bottom:14px;display:flex;flex-direction:column;gap:12px}

/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:520px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:.35rem 0;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
nav.tabs button[aria-selected="true"] svg{stroke-width:2}

/* 詳細シート */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
.sheet>*{flex-shrink:0}
.hero{position:relative;background:var(--tray);min-height:120px}
.hero img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.hero .noimg{display:grid;place-items:center;padding:28px 0}
.hero .noimg .vessel{width:150px}
.hero .close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;min-height:36px;padding:.2rem .9rem;font-size:.8rem}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.66rem;line-height:1.4}
.hero .cap a{color:#fff}
.sheet-body{padding:18px 16px 0;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:1.5rem}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;background:var(--surface)}
.recipe-ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.recipe-ings li{display:flex;justify-content:space-between;gap:10px;padding:.55rem .9rem;border-top:1px dashed var(--line);font-size:.92rem}
.recipe-ings li:first-child{border-top:0}
.recipe-ings li.add{background:var(--yolk-soft)}
.recipe-ings li .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.recipe-ings li .ok{color:var(--accent);font-weight:700;margin-right:.3rem}
.seasoning{font-size:.86rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .9rem;box-shadow:var(--shadow)}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.9rem;margin-top:1px}
.steps li.add{background:var(--yolk-soft);border-radius:10px;padding:.35rem .5rem .35rem .35rem}
.steps li.add::before{background:var(--yolk);color:#231800}
.confirm{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:.55rem 1.1rem;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.muted{color:var(--muted)}
.small{font-size:.8rem}
/* 料理イラスト */
.vessel .food.svg{background:none;border-radius:0;overflow:visible}
.vessel .food.svg svg,.thumb svg,.hero .noimg svg{width:100%;height:100%;display:block}
.v-plate .food.svg{inset:9%}.v-donburi .food.svg{inset:10%}.v-kobachi .food.svg{inset:12%}.v-wan .food.svg{inset:11%}
.thumb.svg{background:var(--porcelain);overflow:hidden}
.thumb.svg svg{transform:scale(1.08)}
.hero.illust{background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%)}
/* あいさつ */
.greet{display:flex;flex-direction:column;gap:0;margin-top:-6px}
.greet:empty{display:none}
.greet .hello{font-family:var(--font-display);font-weight:700;font-size:1rem}
.greet .line{font-size:.84rem;color:var(--muted);line-height:1.6}
/* ひと手間 */
.skill{gap:6px}
.skill .add{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.skill .plus{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.9rem;margin-right:6px;vertical-align:2px}
.skill .why{font-size:.86rem}
.skill .how{font-size:.82rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:.45rem .6rem}
.skill .how b{color:var(--ink)}
/* 買い足し提案 */
.hint-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.hint-row:first-child{border-top:0}
.hint-row .k{font-family:var(--font-display);font-weight:700;font-size:1rem;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:.15rem .6rem;white-space:nowrap}
.hint-row .v{font-size:.8rem;color:var(--muted)}
.hint-row .v b{color:var(--ink)}
/* ふりかえり・称号 */
.review{gap:10px}
.review p{margin:0;font-family:var(--font-display);font-weight:700;font-size:1rem;line-height:1.6}
.review p.foot{font-family:var(--font-body);font-weight:400;font-size:.76rem}
.titles{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.title-row{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.title-row:first-child{border-top:0}
.title-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.title-name{font-weight:700}
.title-lv{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.title-foot{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.toast.praise{border-radius:14px;padding:.8rem 1.1rem;font-family:var(--font-display);font-weight:700;font-size:.95rem;line-height:1.5}

/* お膳: 品数に合わせて 奥(主菜)・中(副菜)・手前(ご飯と汁) の3段に並べる */
.tray{display:flex;flex-direction:column;gap:14px}
.tray-row{display:flex;justify-content:center;align-items:flex-start;gap:6px}
.tray .spot{width:var(--w,46%);flex:0 1 auto}
.spot.side .v-kobachi{width:78%}
.tray .spot.main .vessel{width:86%}
.swap{border:1px solid rgba(245,238,227,.28);background:transparent;color:var(--tray-ink);border-radius:999px;font-size:.7rem;padding:.1rem .7rem;min-height:30px;cursor:pointer}
.swap:hover{background:rgba(245,238,227,.1)}
.vessel .food.svg{border-radius:50%;overflow:hidden}
/* ヘッダーの設定ボタン */
.top .gear.flagbtn{font-size:1.35rem;line-height:1}
.top .gear.flagbtn+.gear{margin-left:8px}
.country-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:56vh;overflow-y:auto;padding:2px}
.country{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:56px}
.country .fl{grid-row:span 2;font-size:1.6rem;line-height:1}
.country .nm{font-weight:700;font-size:.92rem;line-height:1.3}
.country .sub{font-size:.72rem;color:var(--muted);line-height:1.2}
.country.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.v-staple{width:62%}
.world-head{display:flex;align-items:center;gap:10px;font-size:1.05rem}
.world-head .fl{font-size:1.6rem;line-height:1}
.trial-note{background:var(--yolk-soft);color:var(--yolk-ink)}
.top .gear{margin-left:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.top .gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.plus-mark{font-size:.6rem;font-weight:700;letter-spacing:.06em;background:var(--yolk);color:#231800;border-radius:4px;padding:0 .3rem;margin-left:4px}
.warn{color:var(--danger)}
.tiny{font-size:.7rem;line-height:1.5;margin:0}
/* 設定 */
.settings-head{display:flex;align-items:center;gap:8px}
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.set-group details.box{box-shadow:none;border:1px solid var(--line)}
.set-title{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
/* はじめての設定・プラス案内 */
.sheet-pad{padding:22px 18px 8px;gap:14px}
.sheet-onboard h2,.sheet-paywall h2{font-size:1.4rem}
.ob-dots{display:flex;gap:6px;justify-content:center}
.ob-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ob-dots i.on{background:var(--accent);width:20px;border-radius:4px}
.ob-hero{display:grid;place-items:center;padding:6px 0;background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%);border-radius:16px}
.ob-hero .vessel{width:150px;margin:18px 0}
.ob-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ob-points li{display:flex;flex-direction:column;padding-left:14px;border-left:3px solid var(--accent)}
.ob-points b{font-family:var(--font-display)}
.ob-points span{font-size:.85rem;color:var(--muted)}
.ob-actions{display:flex;gap:8px;margin-top:6px}
.ob-skip{align-self:center}
.pw-head{display:flex;align-items:center;gap:10px}
.pw-badge{background:var(--yolk);color:#231800;font-weight:700;font-size:.72rem;letter-spacing:.14em;border-radius:6px;padding:.15rem .5rem}
.pw-reason{margin:0;font-weight:700}
.pw-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pw-list li{padding-left:26px;position:relative}
.pw-list li::before{content:"";position:absolute;left:4px;top:.45em;width:12px;height:7px;border-left:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg)}
.pw-prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pw-price{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.pw-price.best{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pw-price .l{font-size:.78rem;color:var(--muted)}
.pw-price .p{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.pw-price .n{font-size:.72rem;color:var(--accent);font-weight:700}
.pw-free{margin:0;background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;font-weight:500}

.locked .veil{filter:blur(3px);color:var(--muted);letter-spacing:.1em;user-select:none}
.week .item.locked .t{cursor:pointer}
.hint-row.locked{cursor:pointer}
.btn.msg{--msg:#06c755;color:color-mix(in srgb,var(--msg) 80%,#000);font-weight:700}
.btn.msg.wa{--msg:#25d366}.btn.msg.tg{--msg:#2aabee}.btn.msg.none{--msg:var(--accent)}
.btn.msg::before{content:attr(data-app);background:var(--msg);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:.08rem .35rem}
.btn.msg.none::before{display:none}
.btn.msg:hover{border-color:var(--msg)}
.sheet .btn.msg{background:var(--msg);border-color:var(--msg);color:#fff}
.sheet .btn.msg::before{display:none}
.share-text{min-height:150px;font-size:.88rem;line-height:1.6;background:var(--surface)}
.shop .shop-row{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.shop .shop-row:first-child{border-top:0}
.shop .shop-row input{width:18px;height:18px;accent-color:var(--accent);grid-row:span 2}
.shop .nm{font-weight:700}
.shop .q{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.shop .for{grid-column:2 / 4;font-size:.72rem;color:var(--muted)}
.shop .shop-row.done .nm,.shop .shop-row.done .q{text-decoration:line-through;color:var(--muted)}
/* 料理のイラスト */
.vessel .food.svg{background:#fbf8f1}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.pop{animation:rise .28s ease-out}
.tray .vessel{animation:rise .35s ease-out backwards}
.cond .field{gap:4px}
.cond .chips.scroll{margin-inline:-16px;padding-inline:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{width:100%}
.actions .full{grid-column:1 / -1}
.tray .spot.main .vessel{animation-delay:.04s}.tray .spot.rice .vessel{animation-delay:.08s}.tray .spot.soup .vessel{animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html.i18n-wait body{visibility:hidden}
.sheet-body .name-en{margin-top:-10px;color:var(--muted);font-size:.92rem;line-height:1.4}
nav.tabs button[hidden]{display:none}
[dir="rtl"] .steps li,[dir="rtl"] .recipe-ings li,[dir="rtl"] .country{text-align:right}
</style>
</head>
<body>
<div class="wrap">
    <header class="top">
        <div class="seal" aria-hidden="true">膳</div>
        <div>
            <div class="date" id="today-label"></div>
            <h1>わが家のごはん帖</h1>
        </div>
        <button class="gear flagbtn" data-act="country" aria-label="国・地域を変える" id="flag-btn">🇯🇵</button>
        <button class="gear" data-act="settings" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div class="greet" id="greet"></div>
    <main id="view"></main>
</div>

<nav class="tabs" aria-label="画面の切りかえ">
    <div class="in" role="tablist">
        <button role="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 8 0 0 1-18 0z"/><path d="M9 20h6"/><path d="M8.5 4.5c-1 1.2 1 2.3 0 3.8M12 3.5c-1 1.2 1 2.3 0 3.8M15.5 4.5c-1 1.2 1 2.3 0 3.8"/></svg>今日の献立</button>
        <button role="tab" data-tab="fridge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/><path d="M5.5 9.5h13M8.5 5.5v2M8.5 12.5v3"/></svg>材料から</button>
        <button role="tab" data-tab="twist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>ひとひねり</button>
        <button role="tab" data-tab="world"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></svg>世界のレシピ</button>
        <button role="tab" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 17 21H6z"/><path d="M6 3v18M9.5 8h5.5M9.5 12h5.5M9.5 16h3"/></svg>記録</button>
    </div>
</nav>
<div id="modal-root"></div>
<div id="sheet-root"></div>
<!-- ポップなイラストのための共通フィルター -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- 色を少し鮮やかに -->
    <filter id="pop-fill" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="1.25"/></filter>
    <!-- 料理全体のやわらかい影（皿から少し浮いて見える） -->
    <filter id="pop-shadow" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.1" flood-color="#3a2416" flood-opacity=".32"/>
    </filter>
  </defs>
</svg>
<div id="toast-root"></div>

<script>
'use strict';
/* =========================================================
   レシピデータ（2人分）
   材料は「名前 分量」。末尾に ? を付けたものは「なくても作れる」扱い。
   ========================================================= */
const RECIPES = [];
function R(id, name, genre, type, method, min, ings, seas, steps){
    RECIPES.push({id, name, genre, type, method, min, ings: ings.split('|'), seas, steps: steps.split('|')});
}
// ---- 主菜 ----
R('nikujaga','肉じゃが','和','主菜','煮',30,'豚こま切れ肉 200g|じゃがいも 3個|玉ねぎ 1個|にんじん 1本|しらたき 1袋?','だし 300ml・醤油 大さじ3・砂糖 大さじ2・みりん 大さじ2・酒 大さじ2・サラダ油 大さじ1','じゃがいもは大きめの一口大、玉ねぎはくし切り、にんじんは乱切りにする。しらたきは下ゆでして食べやすく切る。|鍋に油を熱して豚肉を炒め、色が変わったら野菜としらたきを加えて全体に油を回す。|だし・砂糖・酒・みりんを加え、落としぶたをして中火で10分煮る。|醤油を加えてさらに10分、じゃがいもが柔らかくなるまで煮る。火を止めて少しおくと味がしみる。');
R('shogayaki','豚の生姜焼き','和','主菜','焼',15,'豚ロース薄切り肉 250g|玉ねぎ 1/2個|キャベツ 1/8個?','おろし生姜 小さじ2・醤油 大さじ2・みりん 大さじ2・酒 大さじ1・サラダ油 小さじ2','キャベツは千切りにして器に盛る。玉ねぎは薄切りにする。|生姜・醤油・みりん・酒を混ぜてタレを作る。|フライパンに油を熱し、豚肉を広げて両面を焼き、玉ねぎも加えて炒める。|タレを回し入れ、からめながら照りが出るまで煮詰める。');
R('karaage','鶏の唐揚げ','和','主菜','揚',30,'鶏もも肉 2枚（500g）|レモン 1/4個?','醤油 大さじ2・酒 大さじ1・おろしにんにく 小さじ1・おろし生姜 小さじ1・片栗粉 大さじ5・揚げ油 適量','鶏肉は一口大に切り、醤油・酒・にんにく・生姜をもみ込んで15分おく。|汁気を軽く切って片栗粉をまぶす。|170℃の油で3分揚げていったん取り出し、3分休ませる。|190℃に上げて1分、カラッと二度揚げする。');
R('teriyaki','照り焼きチキン','和','主菜','焼',20,'鶏もも肉 1枚（300g）|ブロッコリー 1/2株?','醤油 大さじ2・みりん 大さじ2・砂糖 小さじ1・酒 大さじ1・サラダ油 小さじ1','鶏肉は厚い部分を開き、フォークで皮に穴をあける。ブロッコリーは塩ゆでする。|フライパンに皮目を下にして入れ、中火で6分、皮がパリッとするまで焼く。|裏返してふたをし、弱火で5分蒸し焼きにする。|余分な脂を拭き取り、調味料を加えて煮からめる。切り分けてブロッコリーを添える。');
R('hamburg','ハンバーグ','洋','主菜','焼',30,'合いびき肉 300g|玉ねぎ 1/2個|卵 1個|パン粉 大さじ4?|牛乳 大さじ3?','塩 小さじ1/3・こしょう 少々・ナツメグ 少々・ケチャップ 大さじ3・中濃ソース 大さじ2・サラダ油 小さじ1','玉ねぎはみじん切りにして炒め、冷ます。パン粉は牛乳に浸す。|ひき肉に塩を入れて粘りが出るまでこね、玉ねぎ・卵・パン粉・こしょう・ナツメグを加えて混ぜる。|2等分して空気を抜きながら小判形にし、中央をくぼませる。|中火で両面に焼き色をつけ、ふたをして弱火で8分蒸し焼き。残った肉汁にケチャップとソースを加えて煮立て、ソースにする。');
R('stew','クリームシチュー','洋','主菜','煮',35,'鶏もも肉 250g|じゃがいも 2個|玉ねぎ 1個|にんじん 1本|ブロッコリー 1/2株?|牛乳 200ml|シチュールウ 1/2箱','水 400ml・サラダ油 大さじ1','鶏肉と野菜を一口大に切る。ブロッコリーは小房に分けて下ゆでする。|鍋に油を熱して鶏肉を炒め、玉ねぎ・にんじん・じゃがいもを加えて炒める。|水を加え、アクを取りながら15分煮る。|火を止めてルウを溶かし、牛乳を加えて弱火で5分煮る。ブロッコリーを加える。');
R('mapo','麻婆豆腐','中','主菜','炒',20,'木綿豆腐 1丁|豚ひき肉 150g|長ねぎ 1/2本','豆板醤 小さじ1・甜麺醤 大さじ1・おろしにんにく 小さじ1/2・おろし生姜 小さじ1/2・鶏ガラスープの素 小さじ1・水 150ml・醤油 小さじ2・水溶き片栗粉 大さじ2・ごま油 小さじ1','豆腐は2cm角に切って塩少々を入れた湯で2分ゆで、ざるに上げる。長ねぎはみじん切りにする。|フライパンでひき肉をカリッとするまで炒め、豆板醤・甜麺醤・にんにく・生姜を加えて香りを出す。|水・鶏ガラスープの素・醤油を加えて煮立て、豆腐を入れて3分煮る。|長ねぎを加え、水溶き片栗粉でとろみをつけ、ごま油を回しかける。');
R('hoikoro','回鍋肉','中','主菜','炒',15,'豚バラ薄切り肉 200g|キャベツ 1/4個|ピーマン 2個','甜麺醤 大さじ1.5・豆板醤 小さじ1/2・醤油 小さじ1・酒 大さじ1・おろしにんにく 小さじ1/2・サラダ油 小さじ1','キャベツはざく切り、ピーマンは乱切り、豚肉は4cm幅に切る。調味料は混ぜておく。|豚肉を炒めて脂を出し、いったん取り出す。|同じフライパンでキャベツとピーマンを強火でさっと炒める。|豚肉を戻し、合わせ調味料を加えて手早くからめる。');
R('chinjao','青椒肉絲','中','主菜','炒',15,'豚もも薄切り肉 200g|ピーマン 4個|たけのこ水煮 100g?','醤油・酒・片栗粉 各小さじ1（下味）・オイスターソース 大さじ1・醤油 小さじ1・砂糖 小さじ1/2・ごま油 小さじ1・サラダ油 大さじ1','豚肉・ピーマン・たけのこは細切りにする。豚肉に下味をもみ込む。|油を熱して豚肉をほぐしながら炒め、色が変わったら取り出す。|ピーマンとたけのこを強火で1分炒める。|豚肉を戻し、オイスターソース・醤油・砂糖で味をつけ、ごま油で香りづけする。');
R('gyoza','焼き餃子','中','主菜','焼',40,'豚ひき肉 150g|キャベツ 1/8個|ニラ 1/2束|餃子の皮 24枚','醤油 小さじ2・酒 小さじ1・ごま油 小さじ2・おろし生姜 小さじ1・おろしにんにく 小さじ1/2・塩 少々・サラダ油 大さじ1','キャベツはみじん切りにして塩少々でもみ、水気を絞る。ニラは細かく刻む。|ひき肉と調味料をよく練り、野菜を混ぜてあんを作る。|皮にあんをのせ、ふちに水をつけてひだを寄せながら包む。|油を熱して餃子を並べ、焼き色がついたら水50mlを入れてふたをし、水気がなくなるまで蒸し焼きにする。最後にごま油少々を回してパリッと焼く。');
R('meuniere','鮭のムニエル','洋','主菜','焼',15,'生鮭 2切れ|レモン 1/4個?','塩 少々・こしょう 少々・小麦粉 大さじ1・バター 15g・サラダ油 小さじ1','鮭に塩をふって10分おき、出てきた水気を拭く。|こしょうをふり、小麦粉を薄くまぶす。|油とバター半量を熱し、盛りつける面から中火で3分焼き、裏返して2分焼く。|残りのバターを加えて溶かし、スプーンで鮭にかけながら仕上げる。レモンを添える。');
R('sabamiso','さばの味噌煮','和','主菜','煮',25,'さば 2切れ|生姜 1かけ?','水 150ml・酒 50ml・味噌 大さじ2・砂糖 大さじ1.5・みりん 大さじ1・醤油 小さじ1','さばは皮に切り目を入れ、熱湯を回しかけて臭みを取る。生姜は薄切りにする。|鍋に水・酒・砂糖・生姜を煮立て、さばを皮目を上にして入れる。|落としぶたをして中火で8分煮る。|煮汁で溶いた味噌とみりん・醤油を加え、煮汁をかけながら5分、とろりとするまで煮詰める。');
R('buriteri','ぶりの照り焼き','和','主菜','焼',20,'ぶり 2切れ|ししとう 6本?','醤油 大さじ2・みりん 大さじ2・酒 大さじ1・砂糖 小さじ1・小麦粉 少々・サラダ油 小さじ1','ぶりに塩少々をふって10分おき、水気を拭いて小麦粉を薄くまぶす。|油を熱し、ぶりを両面こんがり焼く。ししとうも一緒に焼いて取り出す。|余分な油を拭き取り、調味料を加えて煮立てる。|ぶりにタレをからめ、照りが出たら盛りつけてししとうを添える。');
R('nanban','チキン南蛮','和','主菜','揚',30,'鶏むね肉 1枚|卵 2個|玉ねぎ 1/4個|キャベツ 1/8個?','小麦粉 大さじ2・酢 大さじ3・砂糖 大さじ2・醤油 大さじ2・マヨネーズ 大さじ4・揚げ油 適量','卵1個はゆで卵にして刻み、玉ねぎのみじん切り・マヨネーズと混ぜてタルタルソースを作る。|鶏肉はそぎ切りにして塩こしょうし、小麦粉をまぶして残りの溶き卵にくぐらせる。|多めの油で両面を揚げ焼きにする。|酢・砂糖・醤油を煮立てた甘酢に熱いうちにくぐらせ、タルタルをかける。千切りキャベツを添える。');
R('butakimu','豚キムチ炒め','韓','主菜','炒',10,'豚バラ薄切り肉 200g|白菜キムチ 150g|玉ねぎ 1/2個|ニラ 1/2束?','醤油 小さじ1・みりん 小さじ1・ごま油 大さじ1','豚肉は4cm幅、玉ねぎは薄切り、ニラは4cm長さに切る。|ごま油で豚肉を炒め、色が変わったら玉ねぎを加える。|キムチを加えて炒め合わせ、醤油・みりんで味をととのえる。|ニラを入れてさっと炒め、火を止める。');
R('japchae','チャプチェ','韓','主菜','炒',20,'牛こま切れ肉 150g|春雨 50g|ピーマン 2個|にんじん 1/3本|しいたけ 3枚?','醤油 大さじ2・砂糖 大さじ1・ごま油 大さじ1・おろしにんにく 小さじ1/2・白ごま 少々','春雨はゆでて食べやすく切る。野菜は細切りにする。|ごま油で牛肉を炒め、野菜を加えてしんなりするまで炒める。|春雨・醤油・砂糖・にんにくを加え、汁気がなくなるまで炒め合わせる。|白ごまをふる。');
R('ebichili','エビチリ','中','主菜','炒',20,'むきえび 200g|長ねぎ 1/2本','片栗粉 大さじ1・酒 小さじ1・ケチャップ 大さじ3・豆板醤 小さじ1/2・鶏ガラスープの素 小さじ1/2・水 100ml・砂糖 小さじ1・おろしにんにく/生姜 各小さじ1/2・水溶き片栗粉 大さじ1・サラダ油 大さじ1','えびは背わたを取り、片栗粉と水少々でもみ洗いして水気を拭く。酒と片栗粉少々をまぶす。|油でえびを両面焼いて取り出す。|にんにく・生姜・豆板醤を炒め、ケチャップ・鶏ガラスープの素・水・砂糖を加えて煮立てる。|えびとみじん切りの長ねぎを戻し、水溶き片栗粉でとろみをつける。');
R('happosai','八宝菜','中','主菜','炒',20,'豚こま切れ肉 150g|白菜 1/8個|にんじん 1/3本|しいたけ 3枚|うずらの卵（水煮） 6個?','鶏ガラスープの素 小さじ2・水 200ml・オイスターソース 大さじ1・醤油 小さじ1・酒 大さじ1・水溶き片栗粉 大さじ2・ごま油 小さじ1','白菜はそぎ切り、にんじんは短冊切り、しいたけは薄切りにする。|油で豚肉を炒め、にんじん・白菜の芯・しいたけを加えて炒める。|白菜の葉・うずらの卵・水と調味料を加えて3分煮る。|水溶き片栗粉でとろみをつけ、ごま油をたらす。');
R('chanchan','鮭のちゃんちゃん焼き','和','主菜','焼',20,'生鮭 2切れ|キャベツ 1/6個|玉ねぎ 1/2個|にんじん 1/3本?|しめじ 1/2パック?','味噌 大さじ2・みりん 大さじ1・酒 大さじ1・砂糖 小さじ1・バター 15g','キャベツはざく切り、玉ねぎは薄切り、にんじんは短冊切り、しめじはほぐす。|味噌・みりん・酒・砂糖を混ぜる。|フライパンに野菜を広げ、中央に鮭をのせて合わせ味噌をかける。|ふたをして中弱火で10分蒸し焼きにし、バターをのせて崩しながら混ぜる。');
R('champuru','ゴーヤチャンプルー','和','主菜','炒',15,'ゴーヤ 1/2本|木綿豆腐 1/2丁|豚バラ薄切り肉 120g|卵 2個','醤油 小さじ2・かつお節 1パック・塩 少々・ごま油 大さじ1','ゴーヤは種とわたを取って薄切りにし、塩少々でもんで5分おき、水気を絞る。豆腐は水切りする。|ごま油で豆腐を手でちぎって焼き色をつけ、取り出す。|豚肉とゴーヤを炒め、豆腐を戻して醤油で味をつける。|溶き卵を回し入れてざっくり混ぜ、かつお節をふる。');
R('reishabu','冷しゃぶサラダ','和','主菜','和え',15,'豚しゃぶしゃぶ用肉 200g|レタス 3枚|トマト 1個|きゅうり 1本?','酒 少々・ポン酢 大さじ3・ごま油 小さじ1','野菜を食べやすく切って器に盛る。|沸騰直前（80℃くらい）の湯に酒を入れ、豚肉を1枚ずつ広げて色が変わるまでゆでる。|ざるに上げて自然に冷ます（氷水に入れると固くなる）。|野菜の上に盛り、ポン酢とごま油を合わせてかける。');
R('atsuage','厚揚げと豚肉の味噌炒め','和','主菜','炒',15,'厚揚げ 1枚|豚こま切れ肉 150g|キャベツ 1/6個|ピーマン 2個?','味噌 大さじ1.5・みりん 大さじ1・酒 大さじ1・砂糖 小さじ1・醤油 小さじ1・サラダ油 小さじ2','厚揚げは熱湯をかけて油抜きし、一口大に切る。キャベツはざく切り、ピーマンは乱切りにする。|調味料を混ぜておく。|油で豚肉を炒め、厚揚げを加えて焼き色をつける。|野菜を加えて炒め、合わせ調味料を回し入れてからめる。');
R('gratin','マカロニグラタン','洋','主菜','焼',35,'マカロニ 80g|鶏もも肉 150g|玉ねぎ 1/2個|しめじ 1/2パック?|牛乳 400ml|ピザ用チーズ 50g','バター 30g・小麦粉 大さじ3・コンソメ 小さじ1・塩 こしょう 少々・パン粉 少々','マカロニは表示どおりゆでる。鶏肉は一口大、玉ねぎは薄切りにする。|バターで鶏肉・玉ねぎ・しめじを炒め、小麦粉をふり入れて粉っぽさがなくなるまで炒める。|牛乳を少しずつ加えて混ぜ、コンソメ・塩・こしょうを入れてとろみがつくまで煮る。マカロニを混ぜる。|耐熱皿に入れてチーズとパン粉をのせ、トースターで焼き色がつくまで10分焼く。');
R('negishio','鶏むね肉のねぎ塩焼き','中','主菜','焼',15,'鶏むね肉 1枚|長ねぎ 1本|レモン 1/4個?','片栗粉 大さじ1・酒 小さじ1・ごま油 大さじ2・鶏ガラスープの素 小さじ1/2・塩 小さじ1/4・黒こしょう 少々','長ねぎはみじん切りにし、ごま油大さじ1・鶏ガラスープの素・塩・黒こしょうと混ぜてねぎ塩だれを作る。|鶏肉はそぎ切りにして酒をもみ込み、片栗粉をまぶす。|残りのごま油で鶏肉を両面焼き、ふたをして弱火で3分蒸し焼きにする。|器に盛ってねぎ塩だれをのせ、レモンを添える。');
R('subuta','酢豚','中','主菜','揚',30,'豚肩ロース肉 250g|玉ねぎ 1/2個|ピーマン 2個|にんじん 1/2本?','醤油・酒 各小さじ1（下味）・片栗粉 大さじ2・ケチャップ 大さじ2・酢 大さじ2・砂糖 大さじ2・醤油 大さじ1・水 大さじ4・片栗粉 小さじ1・揚げ油 適量','豚肉は一口大に切って下味をもみ込み、片栗粉をまぶす。野菜は乱切りにし、にんじんは下ゆでする。|甘酢の材料（ケチャップ・酢・砂糖・醤油・水・片栗粉）を混ぜておく。|多めの油で豚肉をカリッと揚げ焼きにし、野菜もさっと炒める。|甘酢を加えて手早く混ぜ、とろみとつやが出たら火を止める。');
R('rollcabbage','ロールキャベツ','洋','主菜','煮',50,'キャベツ 6枚|合いびき肉 250g|玉ねぎ 1/2個|卵 1個?|ベーコン 2枚?','パン粉 大さじ3・塩 こしょう 少々・コンソメ 小さじ2・水 500ml・ローリエ 1枚','キャベツの葉は芯をそいでゆで、しんなりさせる。|ひき肉・みじん切りの玉ねぎ・卵・パン粉・塩・こしょうを練り、6等分する。|キャベツでたねを包み、巻き終わりを下にして鍋にすき間なく並べる。|ベーコン・水・コンソメ・ローリエを加え、落としぶたをして弱火で30分煮る。');
R('chikuzen','筑前煮','和','主菜','煮',40,'鶏もも肉 1枚|れんこん 100g|ごぼう 1/2本|にんじん 1/2本|こんにゃく 1/2枚?|しいたけ 3枚?','だし 200ml・醤油 大さじ2.5・砂糖 大さじ1.5・みりん 大さじ2・酒 大さじ2・サラダ油 大さじ1','鶏肉と野菜は一口大の乱切りにする。こんにゃくはちぎって下ゆでする。|油で鶏肉を炒め、野菜とこんにゃくを加えて全体に油を回す。|だし・酒・砂糖を加え、落としぶたをして10分煮る。|醤油・みりんを加え、煮汁が少なくなるまで鍋をゆすりながら煮からめる。');
R('buridaikon','ぶり大根','和','主菜','煮',45,'ぶり 2切れ|大根 1/3本|生姜 1かけ?','水 400ml・酒 100ml・醤油 大さじ3・砂糖 大さじ2・みりん 大さじ2','大根は2cm厚さの半月切りにし、米のとぎ汁（または水）で15分下ゆでする。|ぶりは熱湯を回しかけて臭みを取る。|鍋に水・酒・砂糖・生姜を煮立て、大根とぶりを入れて落としぶたで10分煮る。|醤油・みりんを加え、ときどき煮汁をかけながらさらに15分煮る。');
R('okonomi','お好み焼き','和','主菜','焼',25,'キャベツ 1/4個|豚バラ薄切り肉 100g|卵 2個|天かす 大さじ3?','小麦粉 100g・だし 120ml・お好みソース/マヨネーズ/かつお節/青のり 各適量・サラダ油 小さじ2','キャベツは粗みじん切りにする。|小麦粉とだしを混ぜ、卵・キャベツ・天かすを加えてざっくり混ぜる。|油を熱して生地を丸く広げ、豚肉をのせて中火で4分焼く。|裏返してふたをし、弱火で5分焼く。ソース・マヨネーズ・かつお節・青のりをかける。');
R('mabonasu','麻婆なす','中','主菜','炒',20,'なす 3本|豚ひき肉 150g|長ねぎ 1/2本?','豆板醤 小さじ1・甜麺醤 大さじ1・醤油 小さじ2・鶏ガラスープの素 小さじ1・水 120ml・水溶き片栗粉 大さじ1・サラダ油 大さじ2・ごま油 少々','なすは乱切りにし、多めの油で焼いてしんなりさせて取り出す。|ひき肉を炒め、豆板醤・甜麺醤を加えて香りを出す。|水・鶏ガラスープの素・醤油を加えて煮立て、なすを戻して2分煮る。|みじん切りの長ねぎを加え、水溶き片栗粉でとろみをつけ、ごま油をたらす。');

R('curry','カレーライス','洋','ごはん','煮',40,'豚こま切れ肉 200g|じゃがいも 2個|玉ねぎ 2個|にんじん 1本|カレールウ 1/2箱|ご飯 2杯分','水 600ml・サラダ油 大さじ1','野菜と肉を一口大に切る。|鍋に油を熱し、玉ねぎを炒めてしんなりしたら肉・にんじん・じゃがいもを炒める。|水を加えて沸騰したらアクを取り、弱めの中火で15分煮る。|火を止めてルウを溶かし、とろみがつくまで5分煮る。ご飯にかける。');
R('oyakodon','親子丼','和','ごはん','煮',15,'鶏もも肉 200g|玉ねぎ 1/2個|卵 3個|ご飯 2杯分|三つ葉 少々?','だし 150ml・醤油 大さじ2・みりん 大さじ2・砂糖 小さじ1','鶏肉は小さめの一口大、玉ねぎは薄切りにする。|小さめのフライパンにだしと調味料を煮立て、鶏肉と玉ねぎを入れて5分煮る。|溶き卵の2/3を回し入れ、ふたをして30秒。残りを加えて半熟で火を止める。|ご飯にすべらせるようにのせ、三つ葉を散らす。');

R('tonkatsu','とんかつ','和','主菜','揚',30,'豚ロース厚切り肉 2枚|卵 1個|キャベツ 1/6個?','塩 こしょう 少々・小麦粉 大さじ2・パン粉 1カップ・揚げ油 適量・とんかつソース 適量','豚肉は脂身と赤身の境目の筋を数か所切り、塩こしょうをふる。|小麦粉→溶き卵→パン粉の順に衣をつけ、手で軽く押さえる。|170℃の油で4分、返して2分揚げる。|油を切って3分休ませてから切り、千切りキャベツとソースを添える。');
R('sabashio','さばの塩焼き','和','主菜','焼',20,'さば 2切れ|大根 3cm?','塩 小さじ1/2・醤油 少々','さばの両面に塩をふって10分おき、出てきた水気を拭く。|皮に浅く切り目を入れる。|魚焼きグリルで盛りつける面から中火で6分、返して4分焼く。|大根おろしを添え、醤油を少したらす。');

R('ajifry','あじフライ','和','主菜','揚',30,'あじ（開いたもの） 4枚|卵 1個|キャベツ 1/6個?','塩 こしょう 少々・小麦粉 大さじ2・パン粉 1カップ・揚げ油 適量・中濃ソース 適量','あじは水気を拭き、塩こしょうをふる。|小麦粉→溶き卵→パン粉の順に衣をつける。|170℃の油で3分、きつね色になるまで揚げる。|千切りキャベツを添え、ソース（またはタルタル）で食べる。');
R('iwashiume','いわしの梅煮','和','主菜','煮',30,'いわし 4尾|梅干し 2個|生姜 1かけ?','水 200ml・酒 50ml・醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1','いわしは頭と内臓を除き、よく洗って水気を拭く。生姜は薄切りにする。|鍋に調味料と水を煮立て、いわし・梅干し・生姜を並べ入れる。|落としぶたをして中弱火で15分煮る。|煮汁をかけながら、とろみが出るまで煮詰める（骨までやわらかく食べられる）。');
R('kareini','かれいの煮付け','和','主菜','煮',20,'かれい 2切れ|生姜 1かけ?|ごぼう 1/3本?','水 150ml・酒 50ml・醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1','かれいは皮に切り目を入れ、熱湯を回しかけて臭みを取る。ごぼうは5cm長さに切る。|フライパンに調味料と水、生姜を煮立てる。|かれいとごぼうを入れ、落としぶたをして中火で10分煮る。|煮汁をかけながら2〜3分煮て、照りを出す。');
R('hoilyaki','鮭のホイル焼き','洋','主菜','焼',20,'生鮭 2切れ|玉ねぎ 1/4個|しめじ 1/2パック|ピーマン 1個?','塩 こしょう 少々・バター 20g・醤油 小さじ2・レモン 適量','鮭に塩こしょうをふる。玉ねぎは薄切り、しめじはほぐす。|アルミホイルに玉ねぎを敷き、鮭・しめじ・ピーマンをのせてバターをのせる。|口をしっかり閉じ、フライパンに並べてふたをし、中火で12分蒸し焼きにする。|開いて醤油をたらし、レモンを添える。');
R('amazu_sakana','白身魚の甘酢あんかけ','中','主菜','揚',25,'生だら 2切れ|玉ねぎ 1/4個|にんじん 1/4本|ピーマン 1個?','塩 少々・片栗粉 大さじ2・揚げ油 適量・酢 大さじ2・砂糖 大さじ2・醤油 大さじ1・ケチャップ 大さじ1・水 大さじ4・片栗粉 小さじ1','たらは一口大に切って塩をふり、水気を拭いて片栗粉をまぶす。野菜は細切りにする。|多めの油でたらを揚げ焼きにして取り出す。|同じフライパンで野菜を炒め、甘酢の材料（酢・砂糖・醤油・ケチャップ・水・片栗粉）を加えてとろみをつける。|たらにあんをかける。');
R('tebasappari','手羽元のさっぱり煮','和','主菜','煮',35,'鶏手羽元 8本|ゆで卵 2個?','水 200ml・酢 100ml・醤油 大さじ3・砂糖 大さじ2・おろしにんにく 小さじ1','手羽元は骨に沿って切り目を入れる。|フライパンで手羽元の表面を焼きつける。|水・酢・醤油・砂糖・にんにくを加え、ふたをして中火で20分煮る。|ゆで卵を加え、煮汁をからめながら5分煮詰める（酢の酸味はとんでまろやかになる）。');
R('yurinchi','油淋鶏','中','主菜','揚',25,'鶏もも肉 1枚|長ねぎ 1/2本','塩 こしょう 少々・片栗粉 大さじ3・揚げ油 適量・醤油 大さじ2・酢 大さじ1.5・砂糖 大さじ1・おろし生姜 小さじ1・ごま油 小さじ1','鶏肉は厚みを均一に開き、塩こしょうをして片栗粉をまぶす。|長ねぎはみじん切りにし、醤油・酢・砂糖・生姜・ごま油と混ぜてねぎだれを作る。|多めの油で皮目から鶏肉を揚げ焼きにし、両面カリッとさせる。|食べやすく切って、ねぎだれをたっぷりかける。');
R('piccata','鶏むね肉のピカタ','洋','主菜','焼',15,'鶏むね肉 1枚|卵 1個','塩 こしょう 少々・小麦粉 大さじ1・粉チーズ 大さじ1・サラダ油 大さじ1・ケチャップ 適量','鶏肉はそぎ切りにして塩こしょうをふり、小麦粉をまぶす。|溶き卵に粉チーズを混ぜる。|鶏肉を卵液にくぐらせ、油を熱したフライパンで弱めの中火で両面焼く。|残った卵液をからめながら焼き、ケチャップを添える。');
R('nikudango','肉団子の甘酢あん','中','主菜','揚',30,'豚ひき肉 250g|玉ねぎ 1/4個|卵 1個?','片栗粉 大さじ1・塩 少々・揚げ油 適量・ケチャップ 大さじ2・酢 大さじ2・砂糖 大さじ2・醤油 大さじ1・水 大さじ4・片栗粉 小さじ1','玉ねぎはみじん切りにし、ひき肉・卵・片栗粉・塩とよく練る。|一口大に丸め、170℃の油で4分揚げる（多めの油で転がしながら焼いてもよい）。|甘酢の材料をフライパンで煮立て、とろみをつける。|肉団子を入れてからめる。');
R('butadaikon','豚バラ大根','和','主菜','煮',35,'豚バラ薄切り肉 150g|大根 1/3本|生姜 1かけ?','だし 300ml・醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1・酒 大さじ1・ごま油 小さじ1','大根は1cm幅のいちょう切り、豚肉は4cm幅に切る。|ごま油で豚肉を炒め、大根を加えて全体に油を回す。|だしと調味料、せん切りの生姜を加え、落としぶたで20分煮る。|大根が透き通ったら火を止め、少しおいて味を含ませる。');
R('kakuni','豚の角煮','和','主菜','煮',90,'豚バラかたまり肉 400g|長ねぎの青い部分 1本?|生姜 1かけ?|ゆで卵 2個?','水 600ml・酒 100ml・醤油 大さじ4・砂糖 大さじ3・みりん 大さじ2','豚肉は4cm角に切り、フライパンで全面に焼き色をつける。|鍋にたっぷりの水と長ねぎ・生姜を入れて豚肉を40分下ゆでし、ゆで汁を捨てる。|水600mlと調味料を加え、落としぶたで30分煮る。|ゆで卵を加え、煮汁が半分になるまで10分煮詰める。');
R('nasumiso','なすと豚肉の味噌炒め','和','主菜','炒',15,'なす 2本|豚バラ薄切り肉 150g|ピーマン 2個?','味噌 大さじ1.5・みりん 大さじ1・砂糖 小さじ2・酒 大さじ1・サラダ油 大さじ2','なすは乱切り、ピーマンは乱切り、豚肉は4cm幅に切る。調味料を混ぜておく。|油でなすを焼き、しんなりしたら取り出す。|豚肉を炒め、なすとピーマンを戻す。|合わせ味噌を加えて炒めからめる。');
R('shigureni','牛肉とごぼうのしぐれ煮','和','主菜','煮',20,'牛こま切れ肉 200g|ごぼう 1/2本|生姜 1かけ','醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1・酒 大さじ2・水 50ml','ごぼうはささがきにして水にさらし、生姜はせん切りにする。|鍋に調味料と水、生姜を煮立て、ごぼうを3分煮る。|牛肉をほぐしながら加え、アクを取る。|汁気がほとんどなくなるまで煮詰める（作り置きにも向く）。');
R('nikudofu','肉豆腐','和','主菜','煮',20,'牛こま切れ肉 150g|木綿豆腐 1丁|長ねぎ 1本|しらたき 1袋?','だし 200ml・醤油 大さじ3・みりん 大さじ2・砂糖 大さじ1.5・酒 大さじ2','豆腐は8等分に切り、長ねぎは斜め切りにする。しらたきは下ゆでする。|鍋にだしと調味料を煮立て、牛肉を入れてアクを取る。|豆腐・長ねぎ・しらたきを加え、落としぶたで10分煮る。|火を止めて少しおき、豆腐に味を含ませる。');
R('bulgogi','プルコギ','韓','主菜','炒',20,'牛こま切れ肉 200g|玉ねぎ 1/2個|にんじん 1/3本|ピーマン 2個?|ニラ 1/3束?','醤油 大さじ2・砂糖 大さじ1・ごま油 大さじ1・おろしにんにく 小さじ1・酒 大さじ1・白ごま 少々','牛肉に醤油・砂糖・にんにく・酒をもみ込んで10分おく。|玉ねぎは薄切り、にんじんとピーマンは細切り、ニラは4cm長さに切る。|ごま油で牛肉を炒め、色が変わったら野菜を加えて炒め合わせる。|ニラを加えてさっと混ぜ、白ごまをふる。');
R('dakgalbi','タッカルビ','韓','主菜','炒',25,'鶏もも肉 1枚|キャベツ 1/6個|玉ねぎ 1/2個|さつまいも 1/2本?|ピザ用チーズ 50g?','コチュジャン 大さじ2・醤油 大さじ1・砂糖 大さじ1・酒 大さじ1・おろしにんにく 小さじ1・ごま油 大さじ1','鶏肉は一口大に切り、調味料をもみ込んで10分おく。|キャベツはざく切り、玉ねぎはくし切り、さつまいもは1cm幅の半月切りにする。|ごま油で鶏肉を焼き、野菜を加えてふたをし、中火で8分蒸し焼きにする。|全体を混ぜ、チーズをのせてふたをし、溶けたら完成。');
R('banbanji','棒棒鶏','中','主菜','和え',20,'鶏むね肉 1枚|きゅうり 1本|トマト 1個?','酒 大さじ1・塩 少々・練りごま 大さじ2・醤油 大さじ1・酢 大さじ1・砂糖 小さじ2・ごま油 小さじ1','鶏肉に酒と塩をふり、ふたをして弱火で8分蒸し焼きにし、そのまま冷ます。|きゅうりは細切り、トマトは薄切りにする。|鶏肉を手で細く裂く。|器に野菜と鶏肉を盛り、練りごま・醤油・酢・砂糖・ごま油を混ぜたたれをかける。');
R('tofuhamburg','豆腐ハンバーグ','和','主菜','焼',30,'鶏ひき肉 150g|木綿豆腐 1/2丁|玉ねぎ 1/4個|しめじ 1/2パック?','パン粉 大さじ3・塩 少々・サラダ油 小さじ1・大根おろし 適量・ポン酢 大さじ3','豆腐はキッチンペーパーで包み、10分重しをして水切りする。玉ねぎはみじん切り。|ひき肉・豆腐・玉ねぎ・パン粉・塩をよく練り、4等分して小判形にする。|油を熱して両面に焼き色をつけ、ふたをして弱火で6分蒸し焼き。しめじも一緒に焼く。|大根おろしをのせ、ポン酢をかける。');
R('pimannikuzume','ピーマンの肉詰め','洋','主菜','焼',30,'ピーマン 4個|合いびき肉 200g|玉ねぎ 1/4個|卵 1個?','パン粉 大さじ3・牛乳 大さじ2・塩 こしょう 少々・小麦粉 少々・サラダ油 小さじ2・ケチャップ 大さじ2・中濃ソース 大さじ2','ピーマンは縦半分に切って種を取り、内側に小麦粉をふる。|ひき肉・みじん切りの玉ねぎ・卵・パン粉・牛乳・塩こしょうを練る。|ピーマンに肉だねをすき間なく詰める。|肉の面から焼き、焼き色がついたら返してふたをし、弱火で6分。ケチャップとソースを加えてからめる。');
R('torinotomatoni','鶏肉のトマト煮','洋','主菜','煮',30,'鶏もも肉 1枚|玉ねぎ 1/2個|トマト缶 1缶|しめじ 1パック?','塩 こしょう 少々・オリーブオイル 大さじ1・おろしにんにく 小さじ1・コンソメ 小さじ1・砂糖 小さじ1','鶏肉は一口大に切り、塩こしょうをふる。玉ねぎは薄切り、しめじはほぐす。|オリーブオイルとにんにくで鶏肉を皮目から焼く。|玉ねぎ・しめじを加えて炒め、トマト缶・コンソメ・砂糖を入れる。|ふたをして15分煮て、塩こしょうで味をととのえる。');
R('ikasatoimo','いかと里芋の煮物','和','主菜','煮',35,'いか 1杯|里芋 6個','だし 300ml・醤油 大さじ2・砂糖 大さじ1.5・みりん 大さじ1・酒 大さじ2','いかは内臓と軟骨を除き、胴は輪切り、足は食べやすく切る。|里芋は皮をむいて塩もみし、水で洗ってぬめりを取る。|だしと調味料で里芋を15分煮る。|いかを加えて5分煮る（煮すぎると固くなる）。火を止めて味を含ませる。');
R('atsuagesoboro','厚揚げのそぼろあんかけ','和','主菜','煮',15,'厚揚げ 1枚|鶏ひき肉 100g|長ねぎ 少々?','だし 200ml・醤油 大さじ1.5・みりん 大さじ1.5・砂糖 小さじ1・水溶き片栗粉 大さじ1','厚揚げは熱湯をかけて油抜きし、一口大に切る。|鍋でひき肉を炒め、だしと調味料を加える。|厚揚げを入れて5分煮る。|水溶き片栗粉でとろみをつけ、小口切りのねぎを散らす。');

R('soborodon','鶏そぼろ丼','和','ごはん','炒',20,'鶏ひき肉 200g|卵 2個|さやいんげん 6本?|ご飯 2杯分','醤油 大さじ2・砂糖 大さじ1.5・みりん 大さじ1・酒 大さじ1・おろし生姜 小さじ1・（卵用）砂糖 小さじ2・塩 少々','鍋にひき肉と調味料・生姜を入れ、火にかける前によく混ぜる。|中火で菜箸4〜5本を使って混ぜながら、汁気がなくなるまで炒る。|卵に砂糖と塩を混ぜ、別の鍋で同じように炒り卵にする。いんげんはゆでて斜め切り。|ご飯にそぼろ・炒り卵・いんげんを彩りよくのせる。');

R('bibimbap','ビビンバ','韓','ごはん','和え',25,'牛こま切れ肉 120g|もやし 1/2袋|ほうれん草 1/2束|にんじん 1/3本|卵 2個?|ご飯 2杯分','ごま油 大さじ2・醤油 大さじ1.5・砂糖 小さじ2・おろしにんにく 小さじ1/2・塩 少々・白ごま 適量・コチュジャン 適量','もやし・ほうれん草・細切りのにんじんをそれぞれゆで、ごま油・塩・白ごまで和えてナムルにする。|牛肉をごま油で炒め、醤油・砂糖・にんにくで甘辛く味をつける。|卵は目玉焼き（または温泉卵）にする。|ご飯にナムルと牛肉、卵をのせ、コチュジャンを添えて混ぜて食べる。');

function norm(s){
    return String(s).normalize('NFKC').toLowerCase()
        .replace(/[（(][^）)]*[）)]/g,'')
        .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
        .replace(/[\s　]/g,'');
}
// 長い表記から順に照合する（「たまねぎ」を「ねぎ」より先に、「牛乳」を「牛」より先に）
const VARIANTS = [];
function rebuildVariants(){
    VARIANTS.length = 0;
    CANON.forEach(([c, vs], order) => vs.forEach(v => VARIANTS.push({c, v: norm(v), order})));
    VARIANTS.sort((a,b) => b.v.length - a.v.length || a.order - b.order);
}
rebuildVariants();
function canonOf(name){
    const n = norm(name);
    for (const {c, v} of VARIANTS) if (n.includes(v)) return c;
    return null;
}
function keyOf(name){ return canonOf(name) || norm(name); }
const PACK_NAMES = {};   // 食材キー → 表示名（国のパックを使っているとき。日本は空）
function labelOf(name){ const c = canonOf(name); return c ? (PACK_NAMES[c] || c) : String(name).replace(/[（(][^）)]*[）)]/g,'').trim(); }
// 自由入力（「豚肉と玉ねぎとキャベツ」など）から食材を取り出す
function extractIngredients(text){
    const out = [];
    String(text).split(/[、,，。・\/\n]+|\s+/).forEach(tok => {
        tok = tok.trim(); if (!tok) return;
        let t = norm(tok); const found = [];
        for (const {c, v} of VARIANTS){
            if (t.includes(v)){ found.push(c); t = t.split(v).join('｜'); }
        }
        if (found.length) found.map(c => PACK_NAMES[c] || c).forEach(c => { if (!out.includes(c)) out.push(c); });
        else if (tok.length <= 12 && !out.includes(tok)) out.push(tok);
    });
    return out;
}
function parseIng(s){
    const opt = s.endsWith('?'); if (opt) s = s.slice(0,-1);
    const i = s.indexOf(' ');
    const name = i < 0 ? s : s.slice(0,i), qty = i < 0 ? '' : s.slice(i+1);
    return {name, qty, opt, key: keyOf(name), label: labelOf(name)};
}

   新しい言語: i18n/<lang>.js を作り（GOHAN_I18N('<lang>', {...})）、I18N_FILES に足す。
   tools/i18n/extract.mjs --check <lang> で、足りない訳を確かめられる。 */
const I18N_FILES = ['en', 'fr', 'de', 'it', 'es', 'pt-BR', 'pl', 'tr', 'ar', 'hi', 'id', 'fil', 'th', 'zh-Hans', 'zh-Hant', 'ko', 'vi'];                 // i18n/ にある辞書

    'zh-Hans':'简体中文', 'zh-Hant':'繁體中文', ko:'한국어', th:'ไทย', vi:'Tiếng Việt', id:'Bahasa Indonesia', fil:'Filipino', 'pt-BR':'Português (Brasil)'};
const I18N = {};
window.GOHAN_I18N = (lang, dict) => { if (lang && dict) I18N[lang] = Object.assign(I18N[lang] || {}, dict); };
let LANG = 'ja';
function t(ja, vars){
    let s = ja;
    if (LANG !== 'ja'){
        const d = I18N[LANG], en = I18N.en;
        const own = d && d[ja] != null;
        s = own ? d[ja] : en && en[ja] != null ? en[ja] : ja;
        if (s && typeof s === 'object'){
            let cat = 'other';
            try{ cat = new Intl.PluralRules(own ? LANG : 'en').select(Number(vars && vars.n)); }catch(e){}
            s = s[cat] != null ? s[cat] : s.other != null ? s.other : ja;
        }
    }
    if (!vars) return s;
    // {n} は値に置きかえる。訳の中の {n:# day:# days} は数で単数・複数を選ぶ（# が数になる）
    return String(s).replace(/\{(\w+)(?::([^:{}]*):([^:{}]*))?\}/g, (m, k, one, other) => {
        if (!Object.prototype.hasOwnProperty.call(vars, k)) return m;
        const v = String(vars[k]);
        if (one === undefined) return v;
        let cat = 'other';
        try{ cat = new Intl.PluralRules(LANG).select(Number(v)); }catch(e){}
        return (cat === 'one' ? one : other).replace(/#/g, v);
    });
}

// データの区分（主菜・副菜・汁物…）や調理法・ジャンルは日本語のコードのまま持ち、表示するときだけ訳す

        '卵':t('卵'), '加工肉':t('ハム・ベーコン'), '野菜':t('野菜')}[f] || f;

function ymd(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function daysBetween(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const WD = ['日','月','火','水','木','金','土'];
// 日付の表示。日本語は「10月20日（火）」、ほかの言語はその言語の書き方（Intl）
function jpDate(s, withWeekday=true){

    try{ return new Intl.DateTimeFormat(LANG, withWeekday ? {month:'long', day:'numeric', weekday:'short'} : {month:'long', day:'numeric'}).format(d); }
    catch(e){ return s; }
}

}
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 最後に食べた日からの日数（食べていなければ Infinity）
function daysSince(id){
    let best = Infinity;
    for (const h of S.history) if (h.id === id){ const d = daysBetween(h.d, TODAY); if (d >= 0 && d < best) best = d; }
    return best;
}

    }

}

/* =========================================================
   材料マッチ
   ========================================================= */
function matchRecipe(r, have){
    const req = r.items.filter(i => !i.opt && !PANTRY.has(i.key));
    const got = [], miss = [], subs = [];
    req.forEach(i => {
        if (have.has(i.key)) got.push(i);
        else {
            const alt = (SUBS[i.key]||[]).find(k => have.has(k));
            if (alt) subs.push({i, alt}); else miss.push(i);
        }
    });
    const optGot = r.items.filter(i => i.opt && have.has(i.key));
    const ratio = req.length ? (got.length + subs.length*0.6) / req.length : 0;
    return {r, got, miss, subs, optGot, ratio, used: got.length + subs.length + optGot.length};
}

/* =========================================================
   献立の提案（同じ料理が続かない仕組み）
   - 決まった日数以内に作った料理は候補から外す
   - その倍の期間内なら点数を下げる
   - 前日・直近の主菜と同じ肉・魚、同じジャンルは点数を下げる
   - 「今は出さない」にした料理は出さない
   ========================================================= */
let session = {rejected:new Set(), mood:'all', useFridge:false, menu:null, twist:null};
const MOODS = [
    {k:'all', get label(){ return t('おまかせ'); }}, {k:'quick', get label(){ return t('20分以内'); }}, {k:'和', get label(){ return t('和食'); }}, {k:'洋', get label(){ return t('洋食'); }},
    {k:'中', get label(){ return t('中華'); }}, {k:'asia', get label(){ return t('韓国・エスニック'); }}, {k:'fish', get label(){ return t('魚の日'); }}, {k:'meat', get label(){ return t('がっつり肉'); }},
];
function moodOk(r, mood){
    switch(mood){
        case 'quick': return r.min <= 20;
        case 'asia': return r.genre === '韓' || r.genre === 'エスニック';
        case 'fish': return ['魚','魚介'].includes(r.family);
        case 'meat': return ['豚','鶏','牛','ひき肉'].includes(r.family);
        case '和': case '洋': case '中': return r.genre === mood;
        default: return true;
    }
}
function scoreRecipe(r, ctx){
    if (S.hidden.includes(r.id) || session.rejected.has(r.id) || isAvoided(r)) return -Infinity;
    const avoid = S.settings.avoidDays;
    const ds = daysSince(r.id);
    if (ds < avoid && !ctx.relax) return -Infinity;
    let s = 1;
    if (ds < avoid*2) s -= 0.35 * (1 - (ds - avoid) / avoid);
    if (ds === Infinity) s += 0.1;
    if (S.favs.includes(r.id)) s += 0.3;
    if (ctx.recent){
        ctx.recent.forEach(x => {
            if (x.family === r.family && r.family !== '野菜') s -= x.ago <= 1 ? 0.6 : 0.2;
            if (x.genre === r.genre && x.ago <= 1) s -= 0.2;
        });
    }
    if (ctx.main){
        if (ctx.main.genre === r.genre) s += 0.3;
        else if ((ctx.main.genre === '韓' && r.genre === '中') || (ctx.main.genre === 'エスニック' && r.genre === '中')) s += 0.15;
        if (r.family === ctx.main.family && r.family !== '野菜') s -= 0.5;
        const overlap = r.items.filter(i => ctx.main.items.some(m => m.key === i.key)).length;
        s -= overlap * 0.15;
    }
    (ctx.others || []).forEach(o => {
        if (o.method === r.method) s -= 0.25;
        if (o.family === r.family && r.family !== '野菜') s -= 0.3;
        s -= r.items.filter(i => o.items.some(m => m.key === i.key)).length * 0.15;
    });
    if (ctx.fridge && ctx.fridge.size){ s += matchRecipe(r, ctx.fridge).ratio * 0.8; }
    return s;
}
function pick(cands, ctx){
    let scored = cands.map(r => ({r, s: scoreRecipe(r, ctx)})).filter(x => x.s > -Infinity);
    if (!scored.length) scored = cands.filter(r => !S.hidden.includes(r.id) && !isAvoided(r)).map(r => ({r, s: scoreRecipe(r, Object.assign({}, ctx, {relax:true}))})).filter(x => x.s > -Infinity);
    if (!scored.length) return null;
    scored.forEach(x => x.s += Math.random() * 0.7);
    scored.sort((a,b) => b.s - a.s);
    return scored[0].r;
}
function suggestMain(){
    const cands = RECIPES.filter(r => r.main && moodOk(r, session.mood));
    return pick(cands, {recent: recentMainFamilies(3), fridge: session.useFridge ? fridgeKeys() : null});
}

/* =========================================================
   ひとひねり（アレンジ）生成
   id 形式: a~元のID~味~かたち~主役  → いつでも同じレシピに戻せる
   ========================================================= */
function twistOptions(base){
    const flavors = Object.entries(FLAVORS).filter(([k,f]) =>
        f.methods.includes(base.method) && !(f.skipGenre||[]).includes(base.genre) && !(f.skipId||[]).includes(base.id)).map(([k]) => k);
    const forms = Object.entries(FORMS).filter(([k,f]) =>
        f.types.includes(base.type) && f.methods.includes(base.method) && !(f.skipFamily||[]).includes(base.family)).map(([k]) => k);
    const swaps = (SWAPS[base.family] || []).map((s,i) => `${base.family}:${i}`)
        .filter(k => { const s = swapOf(k); return !base.items.some(i => i.key === s.to); });
    return {flavors, forms, swaps};
}
function flavorLabel(k){
    return {kr:t('韓国風'), it:t('イタリアン風'), cn:t('中華風'), et:t('エスニック風'), wa:t('和風'), curry:t('カレー風味'), misobutter:t('味噌バター'), garlic:t('ガーリックバター'), ume:t('梅しそ')}[k] || (FLAVORS[k] ? FLAVORS[k].label : k);
}
function formLabel(k){
    return {don:t('丼にする'), gratin:t('グラタンにする'), harumaki:t('春巻きにする'), pasta:t('パスタにする'), omelet:t('オムレツにする'), sand:t('サンドにする'), cheese:t('チーズ焼きにする'), nabe:t('鍋にする'), onigiri:t('焼きおにぎりにする')}[k] || (FORMS[k] ? FORMS[k].label : k);
}
function swapOf(k){ if (!k) return null; const [f,i] = k.split(':'); return (SWAPS[f]||[])[+i] || null; }
function twistId(baseId, fl, fo, sw){ return ['a', baseId, fl||'', fo||'', sw||''].join('~'); }
function buildTwist(id){
    const [, baseId, fl, fo, sw] = String(id).split('~');
    const base = RECIPES.find(r => r.id === baseId); if (!base) return null;
    const F = FLAVORS[fl], M = FORMS[fo], W = swapOf(sw);
    const re = W ? FAMILY_RE[base.family] : null;
    const repl = t => re ? t.replace(re, W.word) : t;
    const items = base.items.map(i => {
        if (W && i.key === base.protein) return Object.assign({}, i, {name:W.word, key:keyOf(W.word), label:labelOf(W.word), changed:true});
        return i;
    });
    const addItems = [...(F ? F.add : []), ...(M ? M.add : [])].map(s => Object.assign(parseIng(s), {opt:false, added:true}));
    const steps = base.steps.map(t => ({t: repl(t)}));
    if (F){
        steps.splice(Math.max(steps.length-1, 1), 0, {t:F.step, add:true});
    }
    if (M) M.steps.forEach(t => steps.push({t, add:true}));
    if (F && F.garnish) steps.push({t:`仕上げに${F.garnish}を添える。`, add:true});
    let name = base.name;
    if (W && ['豚肉','鶏肉','牛肉'].includes(W.to)) name = name.replace(/^(豚|鶏|牛)の/, W.to[0] + 'の');
    if (M) name = name + M.suffix;
    if (F) name = `${F.prefix} ${name}`;
    if (W) name = `${name}（${W.label}）`;
    const changes = [];
    if (F) changes.push(t('味: {v}', {v:flavorLabel(fl)}));
    if (M) changes.push(t('かたち: {v}', {v:formLabel(fo)}));
    if (W) changes.push(t('主役: {v}に', {v:W.to}));
    const genreMap = {kr:'韓', it:'洋', cn:'中', et:'エスニック', wa:'和'};
    const r = {
        id, name, base, isTwist:true, changes,
        genre: (F && genreMap[fl]) || base.genre,
        type: M && ['don','onigiri'].includes(fo) ? 'ごはん' : M && fo === 'pasta' ? '麺' : base.type,
        method: base.method, min: base.min + (M ? 10 : 0),
        items: [...items, ...addItems], seas: base.seas, steps: steps,
        note: W ? W.note : '',
    };
    const p = r.items.find(i => FAMILY[i.key] && i.key !== '卵');
    r.protein = p ? p.key : null; r.family = p ? FAMILY[p.key] : '野菜';
    r.main = ['主菜','ごはん','麺'].includes(r.type);
    return r;
}
// 変化の数: 1=ちょっとだけ 2=しっかり 3=大胆に
function generateTwists(opts={}){
    const {baseId=null, level=2, flavor='any', form='any', swap='any', count=3, fromIds=null} = opts;
    let bases = baseId ? [RECIPES.find(r => r.id === baseId)] :
        (fromIds && fromIds.length ? fromIds.map(id => RECIPES.find(r => r.id === id)) : RECIPES.filter(r => r.type !== '汁物'));
    bases = bases.filter(r => r && !isAvoided(r));
    const all = [];
    bases.forEach(b => {
        const o = twistOptions(b);
        const fls = flavor === 'none' ? [''] : flavor === 'any' ? ['', ...o.flavors] : (o.flavors.includes(flavor) ? [flavor] : []);
        const fos = form === 'none' ? [''] : form === 'any' ? ['', ...o.forms] : (o.forms.includes(form) ? [form] : []);
        const sws = swap === 'none' ? [''] : swap === 'any' ? ['', ...o.swaps] : o.swaps;
        fls.forEach(fl => fos.forEach(fo => sws.forEach(sw => {
            const n = [fl,fo,sw].filter(Boolean).length;
            if (!n) return;
            all.push({id: twistId(b.id, fl, fo, sw), n, base:b});
        })));
    });
    const seen = new Set(S.seenTwists);
    const eaten = new Set(S.history.map(h => h.id));
    const scored = all.map(x => {
        let s = Math.random();
        s -= Math.abs(x.n - level) * 0.8;
        if (seen.has(x.id)) s -= 1.2;
        if (eaten.has(x.id)) s -= 1.5;
        if (S.favs.includes(x.base.id)) s += 0.25;
        if (daysSince(x.base.id) < 3) s -= 0.3;
        return {x, s};
    }).sort((a,b) => b.s - a.s);
    // 同じ元料理ばかりにならないように
    const out = [], usedBase = new Set();
    for (const {x} of scored){
        if (out.length >= count) break;
        if (usedBase.has(x.base.id) && !baseId) continue;
        usedBase.add(x.base.id); out.push(buildTwist(x.id));
    }
    for (const {x} of scored){
        if (out.length >= count) break;
        if (!out.some(t => t.id === x.id)) out.push(buildTwist(x.id));
    }
    return out;
}
function markSeen(list){
    list.forEach(t => { if (t && !S.seenTwists.includes(t.id)) S.seenTwists.push(t.id); });
    if (S.seenTwists.length > 300) S.seenTwists = S.seenTwists.slice(-300);
    save();
}
function suggestTwist(){
    // よく作る定番やお気に入りをベースに、今日のひとひねりを1品
    const counts = {};
    S.history.forEach(h => { if (!String(h.id).startsWith('a~')) counts[h.id] = (counts[h.id]||0) + 1; });
    const favBases = [...new Set([...S.favs.filter(id => !String(id).startsWith('a~')), ...Object.keys(counts)])];
    const res = generateTwists({level:2, count:1, fromIds: favBases.length ? shuffle(favBases).slice(0,8) : null});
    return res[0] || null;
}

/* =========================================================
   1週間の主菜プラン
   ========================================================= */
function makeWeek(){
    const days = [], used = new Set();
    for (let i = 0; i < 7; i++){
        const d = addDays(TODAY, i);
        const recent = [];
        for (let k = 1; k <= 2 && days.length - k >= 0; k++){ const r = byId(days[days.length-k].id); if (r) recent.push({ago:k, family:r.family, genre:r.genre}); }
        if (i === 0) recent.push(...recentMainFamilies(2).map(x => Object.assign({}, x, {ago:x.ago+1})));
        const cands = RECIPES.filter(r => r.main && !used.has(r.id));
        const r = pick(cands, {recent, fridge: i < 2 && session.useFridge ? fridgeKeys() : null});
        if (r){ used.add(r.id); days.push({d, id:r.id}); }
    }
    S.week = {start:TODAY, days}; save();
}
function weekToday(){
    if (!S.week) return null;
    const x = S.week.days.find(x => x.d === TODAY);
    return x ? byId(x.id) : null;
}

function record(id, slot, d=TODAY){

    if (S.history.some(h => h.id === id && h.d === d)) return;
    S.history.push({d, id, name:r.name, slot});
    S.history.sort((a,b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0);
    if (r.isTwist && !S.seenTwists.includes(id)) S.seenTwists.push(id);
    save();
}

const PHOTO_KEY = 'gohancho.photos.v2';

function stripHtml(h){ try{ return (new DOMParser().parseFromString(String(h||''), 'text/html').body.textContent || '').trim().replace(/\s+/g,' '); }catch(e){ return ''; } }
async function loadPhotos(){
    if (photoStatus === 'done' || photoStatus === 'loading') return;
    photoStatus = 'loading';
    // 同梱の絵がある料理は、Wikipedia に問い合わせない
    const need = Object.entries(WIKI).filter(([id]) => !GEN[id]);
    if (!need.length){ photoStatus = 'done'; return; }
    try{
        const titles = [...new Set(need.map(([, ts]) => ts).flat())], fileOf = {};
        for (let k = 0; k < titles.length; k += 40){
            const chunk = titles.slice(k, k+40);
            const url = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=name&titles=' + encodeURIComponent(chunk.join('|'));
            const j = await (await fetch(url)).json();
            const map = {}; [...(j.query.normalized||[]), ...(j.query.redirects||[])].forEach(n => map[n.from] = n.to);
            const byTitle = {}; (j.query.pages||[]).forEach(pg => { if (pg.pageimage) byTitle[pg.title] = pg.pageimage; });
            chunk.forEach(t => { let x = t; for (let n = 0; n < 3 && map[x]; n++) x = map[x]; if (byTitle[x]) fileOf[t] = byTitle[x]; });
        }
        const files = [...new Set(Object.values(fileOf))].filter(f => /\.(jpe?g|png|webp)$/i.test(f));
        const info = {};
        for (let k = 0; k < files.length; k += 40){
            const chunk = files.slice(k, k+40);
            const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=720&iiextmetadatafilter=Artist|LicenseShortName&titles=' + encodeURIComponent(chunk.map(f => 'File:' + f).join('|'));
            const j = await (await fetch(url)).json();
            const back = {}; (j.query.normalized||[]).forEach(n => back[n.to] = n.from);
            (j.query.pages||[]).forEach(pg => {
                const ii = pg.imageinfo && pg.imageinfo[0]; if (!ii || pg.missing) return;

/* ---- わが家の写真（作った料理を撮って登録。このブラウザの IndexedDB に保存） ---- */
let MINE = {};
function openDb(){
    return openDb.p || (openDb.p = new Promise((res, rej) => {
        const q = indexedDB.open('gohancho', 2);
        q.onupgradeneeded = () => { const db = q.result; ['photos', 'sketches'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    }));
}
async function idbDo(mode, fn, store='photos'){
    const db = await openDb();
    return new Promise((res, rej) => { const tx = db.transaction(store, mode); const out = fn(tx.objectStore(store)); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); });
}
async function loadMine(){
    try{
        const db = await openDb();
        await new Promise((res, rej) => {
            const tx = db.transaction('photos', 'readonly'); const cur = tx.objectStore('photos').openCursor();
            cur.onsuccess = () => { const c = cur.result; if (!c) return; MINE[c.key] = {src: URL.createObjectURL(c.value.blob), d: c.value.d, mine: true}; c.continue(); };
            tx.oncomplete = res; tx.onerror = () => rej(tx.error);
        });
        if (Object.keys(MINE).length){ render(); if (modalId) renderModal(); }
    }catch(e){}
}
async function shrinkImage(file){
    const url = URL.createObjectURL(file);
    try{
        const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
        const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return await new Promise(res => c.toBlob(res, 'image/jpeg', .82));
    } finally { URL.revokeObjectURL(url); }
}
async function saveMine(id, file){
    try{
        const blob = await shrinkImage(file); if (!blob) throw 0;
        await idbDo('readwrite', st => st.put({blob, d: TODAY}, id));
        if (MINE[id]) URL.revokeObjectURL(MINE[id].src);
        MINE[id] = {src: URL.createObjectURL(blob), d: TODAY, mine: true};
        toast(t('わが家の一枚を登録しました。献立にもこの写真が出ます'), true);
    }catch(e){ toast(t('写真を保存できませんでした。別の写真で試してください')); }
    render(); if (modalId) renderModal();
}
async function removeMine(id){
    try{ await idbDo('readwrite', st => st.delete(id)); }catch(e){}
    if (MINE[id]){ URL.revokeObjectURL(MINE[id].src); delete MINE[id]; }
    toast(t('写真を外しました')); render(); if (modalId) renderModal();
}
function photoOf(r){
    if (!r) return null;
    if (MINE[r.id]) return MINE[r.id];               // 自分で撮った写真はそのまま
    const id = r.isTwist ? r.base.id : r.id;

/* ---- アプリに同梱した料理の絵 ----
   img/dish/manifest.json に並んだ絵を使う。via が 'svg' は tools/illustrations/draw で描いたイラスト、
   'api' / 'chatgpt' は ChatGPT（OpenAI の画像生成）で前もって作った画像。アプリから外部へは通信しない。 */
const GEN = {};
async function loadGenerated(){
    try{
        const res = await fetch('img/dish/manifest.json', {cache:'no-cache'});
        if (!res.ok) return;
        const m = await res.json(), items = (m && m.items) || {};
        Object.keys(items).forEach(id => {
            const it = items[id]; if (!it || !it.file || !/^[\w.-]+$/.test(it.file)) return;
            GEN[id] = {src: 'img/dish/' + it.file + '?v=' + encodeURIComponent(it.date || ''), gen: true, ai: it.via === 'api' || it.via === 'chatgpt'};
        });

}

/* ---- 参考写真をもとに、ポップなイラストに描き直す ----
   Wikipedia の写真は、端末の中で一度だけ「細部をなめらかに → 明るさを数段階のぬり分けにして鮮やかに → くっきりした輪郭に太い線」でイラスト化して保存し、以後はそれを表示する。
   変換が終わるまで・変換できない写真は、アプリが描くイラストを表示する（元の写真そのものは出さない）。 */
const SKETCH = {};          // 元の写真URL → イラスト化した画像のURL（null は変換できなかった）
const sketchQueue = [];
let sketchBusy = false;
function sketchOf(ph){
    if (!ph) return null;
    const u = SKETCH[ph.src];
    if (u) return Object.assign({}, ph, {src: u, sketch: true});
    if (u === undefined) requestSketch(ph.src);
    return null;
}
function requestSketch(src){
    if (SKETCH[src] !== undefined || sketchQueue.includes(src)) return;
    sketchQueue.push(src); pumpSketches();
}
async function pumpSketches(){
    if (sketchBusy) return; sketchBusy = true;
    while (sketchQueue.length){
        const src = sketchQueue.shift();
        try{
            const key = 'pop3:' + src;
            let blob = await idbDo('readonly', st => st.get(key), 'sketches').catch(() => null);
            if (!blob){ blob = await popIllustrate(src); idbDo('readwrite', st => st.put(blob, key), 'sketches').catch(() => {}); }
            SKETCH[src] = URL.createObjectURL(blob);
        }catch(e){ SKETCH[src] = null; }
        scheduleRender();
    }
    sketchBusy = false;
}
let renderTimer = null;
function scheduleRender(){
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
        const a = document.activeElement;
        if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
        if (modalId) renderModal();
    }, 250);
}
function popIllustrate(src){
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onerror = () => reject(new Error('load'));
        img.onload = () => {
            try{
                const k = Math.min(1, 520 / Math.max(img.naturalWidth, img.naturalHeight));
                const W = Math.max(1, Math.round(img.naturalWidth * k)), H = Math.max(1, Math.round(img.naturalHeight * k)), n = W * H;
                const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
                const ctx = cv.getContext('2d', {willReadFrequently: true});
                ctx.drawImage(img, 0, 0, W, H);
                const im = ctx.getImageData(0, 0, W, H), d = im.data;     // 許可のない画像はここで例外 → イラスト表示
                // 1) 細部をなめらかに（輪郭は残すぼかし）
                let px = new Float32Array(n * 3);
                for (let i = 0; i < n; i++){ px[i*3] = d[i*4]; px[i*3+1] = d[i*4+1]; px[i*3+2] = d[i*4+2]; }
                for (let it = 0; it < 3; it++) px = smoothKeepEdges(px, W, H, 3, 26);
                // 2) 色（色み）はそのままに、明るさだけを数段階にそろえて「ぬり分け」にする → 赤いトマトは赤、緑の野菜は緑のまま
                const LEVELS = 5, lumS = new Float32Array(n);
                for (let i = 0; i < n; i++){
                    const r = px[i*3], g = px[i*3+1], b = px[i*3+2];
                    const L = .3 * r + .59 * g + .11 * b; lumS[i] = L;
                    const band = Math.min(LEVELS - 1, Math.floor(L / 256 * LEVELS));
                    const Lq = (band + .62) * 256 / LEVELS;                 // 段階の中ほどへ（少し明るめ）
                    const f = Lq / Math.max(8, L);
                    let R = r * f, G = g * f, B = b * f;
                    const l2 = .3 * R + .59 * G + .11 * B;                   // 鮮やかに
                    R = l2 + (R - l2) * 1.55; G = l2 + (G - l2) * 1.55; B = l2 + (B - l2) * 1.55;
                    d[i*4] = Math.max(0, Math.min(255, R + 6)); d[i*4+1] = Math.max(0, Math.min(255, G + 4)); d[i*4+2] = Math.max(0, Math.min(255, B));
                    d[i*4+3] = 255;
                }
                // 3) くっきりした輪郭だけに太い線（明るさの変化が大きい所）
                const thr = 22, edge = new Uint8Array(n);
                for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){
                    const i = y * W + x;
                    const gx = -lumS[i-W-1] - 2*lumS[i-1] - lumS[i+W-1] + lumS[i-W+1] + 2*lumS[i+1] + lumS[i+W+1];
                    const gy = -lumS[i-W-1] - 2*lumS[i-W] - lumS[i-W+1] + lumS[i+W-1] + 2*lumS[i+W] + lumS[i+W+1];
                    if (Math.hypot(gx, gy) / 4 > thr) edge[i] = 1;
                }
                const thick = Math.max(1, Math.round(W / 300));
                for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
                    if (!edge[y*W+x]) continue;
                    for (let dy = -thick; dy <= thick; dy++) for (let dx = -thick; dx <= thick; dx++){
                        const yy = y + dy, xx = x + dx; if (yy < 0 || yy >= H || xx < 0 || xx >= W) continue;
                        const q = (yy * W + xx) * 4; d[q] = 74; d[q+1] = 46; d[q+2] = 31;
                    }
                }
                ctx.putImageData(im, 0, 0);
                cv.toBlob(bl => bl ? resolve(bl) : reject(new Error('blob')), 'image/png');
            }catch(e){ reject(e); }
        };
        img.src = src;
    });
}
// 似た色どうしだけを混ぜるぼかし（バイラテラルフィルターの簡易版）。輪郭は残り、面はなめらかになる
function smoothKeepEdges(px, W, H, r, sigma){
    const out = new Float32Array(px.length), s2 = 2 * sigma * sigma;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
        const i = (y * W + x) * 3, R = px[i], G = px[i+1], B = px[i+2];
        let sr = 0, sg = 0, sb = 0, sw = 0;
        for (let dy = -r; dy <= r; dy += 1) for (let dx = -r; dx <= r; dx += 1){
            const yy = Math.min(H - 1, Math.max(0, y + dy)), xx = Math.min(W - 1, Math.max(0, x + dx)), j = (yy * W + xx) * 3;
            const dr = px[j] - R, dg = px[j+1] - G, db = px[j+2] - B;
            const w = Math.exp(-(dr*dr + dg*dg + db*db) / s2);
            sr += px[j] * w; sg += px[j+1] * w; sb += px[j+2] * w; sw += w;
        }
        out[i] = sr / sw; out[i+1] = sg / sw; out[i+2] = sb / sw;
    }
    return out;
}

function cssUrl(u){ return `url('${String(u).replace(/['"()\\\s]/g, c => encodeURIComponent(c))}')`; }

    const ph = photoOf(r);
    return ph ? `<span class="thumb${ph.gen ? ' gen' : ''}" style="${esc('background-image:' + cssUrl(ph.src))}" role="img" aria-label="${esc(t('{name}の写真', {name:r.name}))}"></span>`
              : `<span class="thumb svg" aria-hidden="true">${dishSvg(r)}</span>`;
}

/* ---- 料理のイラスト（SVG・真上から見た盛りつけ） ----
   材料の名前から具材の絵を選び、料理IDを種にして毎回同じ配置に並べる。
   写真がなくても、どの料理（アレンジ・わが家のレシピ含む）にも絵が付く。 */
function seeded(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
