function dishSvg(r, opts={}){
    if (!r) return '';
    const rng = seeded(String(r.id));
    const R = 34, cx = 50, cy = 50;
    const layers = [];
    const place = (item) => {
        const [g, c, c2, s, n, rot0, ox, oy] = item;
        let out = '';
        for (let k = 0; k < n; k++){
            let x, y, tries = 0;
            do { const a = rng()*Math.PI*2, d = Math.sqrt(rng()) * (R - s*.55); x = cx + ox + Math.cos(a)*d; y = cy + oy + Math.sin(a)*d; tries++; }
            while (tries < 6 && Math.hypot(x-cx, y-cy) > R - s*.4);
            const rot = rot0 + (n > 1 ? (rng()-.5)*140 : 0);
            out += G[g](x, y, s, rot, c, c2 || c);
        }
        return out;
    };
    let base, items;
    const art = r.isTwist ? null : DISH_ART[r.id];
    if (art){ base = art.base; items = art.items.map(i => ({z: i[0]==='dot' && i[3] > 20 ? 0 : 2, item:i})); }
    else {
        base = baseColor(r);
        items = [];
        const seen = new Set();
        r.items.forEach(i => {
            const a = ING_ART[i.key] || ING_ART[i.label]; if (!a || seen.has(i.key)) return; seen.add(i.key);
            const n = i.opt ? Math.max(1, Math.round(a.n*.6)) : a.n;
            items.push({z:a.z, item:[a.g, a.c, a.c2, a.s, n, 0, 0, 0]});
        });
        if (!items.length) items.push({z:2, item:['chunk', '#b57a52', '#e9c4a4', 12, 4, 0, 0, 0]});
    }
    // かたちのアレンジ: ご飯・麺・パン・卵・チーズなどを足す
    let under = '', over = '';
    const fo = r.isTwist ? String(r.id).split('~')[3] : '';
    const fl = r.isTwist ? String(r.id).split('~')[2] : '';
    const riceUnder = `<circle cx="50" cy="50" r="${R}" fill="#f7f3e8"/>${Array.from({length:26},()=>{const a=rng()*6.28,d=Math.sqrt(rng())*30;return `<ellipse cx="${(50+Math.cos(a)*d).toFixed(1)}" cy="${(50+Math.sin(a)*d).toFixed(1)}" rx="2.2" ry="1.3" transform="rotate(${(rng()*180).toFixed(0)} ${(50+Math.cos(a)*d).toFixed(1)} ${(50+Math.sin(a)*d).toFixed(1)})" fill="#ffffff" stroke="#e3dccb" stroke-width=".4"/>`;}).join('')}`;
    const isRiceDish = !art && (r.type === 'ごはん');
    const isNoodle = !art && (r.type === '麺');
    if (fo === 'don' || isRiceDish || (art && art.rice)){ under = riceUnder; }
    if (art && art.roux){ under += `<path d="M46,14 C70,10 90,30 86,56 C82,78 62,88 44,84 C60,70 62,30 46,14 Z" fill="#8a5a2b"/>`; }
    if (fo === 'pasta' || isNoodle){ under = `<circle cx="50" cy="50" r="${R}" fill="#f1e6c2"/>` + Array.from({length:12},()=>G.strand(50+(rng()-.5)*40, 50+(rng()-.5)*40, 22, rng()*180, '#f1de9a')).join(''); }
    if (fo === 'sand'){ under = `<rect x="14" y="14" width="72" height="72" rx="6" fill="#e8c98f"/><rect x="18" y="18" width="64" height="64" rx="4" fill="#f5e6c8"/>`; }
    if (fo === 'omelet'){ over = `<path d="M22,58 Q20,30 50,28 Q80,30 78,58 Q50,70 22,58 Z" fill="#f7cf3f" opacity=".92"/><path d="M30,56 Q50,64 70,56" stroke="#e9b62a" stroke-width="1.4" fill="none"/>`; }
    if (fo === 'gratin' || fo === 'cheese' || fl === 'it'){ over += Array.from({length: fo ? 7 : 4},()=>G.dot(50+(rng()-.5)*44, 50+(rng()-.5)*44, 7+rng()*5, 0, '#f6d76a')).join('') + (fo ? Array.from({length:5},()=>G.dot(50+(rng()-.5)*40, 50+(rng()-.5)*40, 4, 0, '#b96b2a')).join('') : ''); }
    if (fo === 'harumaki'){ over = Array.from({length:3},(_,k)=>G.roll(50, 36+k*14, 40, -12, '#e0a85a', '#f3d4a0')).join(''); }
    if (fo === 'onigiri'){ under = `<circle cx="50" cy="50" r="${R}" fill="#f0e8d4"/>`; over = G.tri(38,52,26,0,'#f7f3e8','#2a2f2a') + G.tri(64,48,26,0,'#f7f3e8','#2a2f2a'); }
    if (fo === 'nabe'){ under = `<circle cx="50" cy="50" r="${R}" fill="#d9c9a6"/>` + G.leaf(30,40,14,20,'#dbe6b7','#f5f8e6') + G.leaf(66,62,14,-30,'#dbe6b7','#f5f8e6') + G.cube(60,36,10,10,'#faf7ef','#fff') + G.cube(36,64,10,-8,'#faf7ef','#fff'); }
    const tint = {kr:'rgba(200,50,30,.28)', curry:'rgba(230,170,30,.35)', cn:'rgba(120,60,20,.18)', et:'rgba(240,120,40,.2)', misobutter:'rgba(150,100,40,.25)', wa:'rgba(90,60,30,.12)', garlic:'rgba(250,220,120,.25)', ume:'rgba(200,40,60,.15)'}[fl] || '';
    const garnish = {kr:Array.from({length:12},()=>G.dot(50+(rng()-.5)*50, 50+(rng()-.5)*50, 1.6, 0, '#f6efd8')).join('') + G.strand(60,40,10,20,'#c8323c'),
        et:G.leaf(62,36,8,20,'#3f8a45','#a8d69d')+G.leaf(36,62,8,-40,'#3f8a45','#a8d69d')+G.wedge(70,66,8,0,'#f6e05a','#fbf2a8'),
        wa:G.dot(62,38,10,0,'#f7f3ea')+G.leaf(36,60,8,-30,'#3f8a45','#a8d69d'),
        ume:G.round(60,38,6,0,'#c8323c','#e8848c')+G.leaf(38,60,9,-30,'#3f8a45','#a8d69d'),
        garlic:G.crescent(62,38,6,20,'#f6f0dc','#d9cfa8')+G.crescent(38,62,6,-50,'#f6f0dc','#d9cfa8')+G.dot(50,50,2,0,'#2a2a2a'),
        misobutter:G.cube(58,42,7,10,'#f8e58a','#fdf6c6'),
        cn:Array.from({length:5},()=>G.ring(50+(rng()-.5)*44, 50+(rng()-.5)*44, 3.4, 0, '#5e9a4f','#eef7e6')).join(''),
        it:G.leaf(62,36,8,20,'#2f7a3a','#7fbb75')+Array.from({length:10},()=>G.dot(50+(rng()-.5)*50, 50+(rng()-.5)*50, 1.8, 0, '#f8efc8')).join(''),
        curry:''}[fl] || '';
    items.sort((a,b) => a.z - b.z);
    const body = items.map(x => place(x.item)).join('');
    const plated = !art && !under && r.type === '主菜' && (r.method === '焼' || r.method === '揚');   // 焼き物・揚げ物は白い皿にキャベツを添えて盛る
    const baseOp = art ? .95 : plated ? 0 : ({'煮':.95,'炒':.8,'和え':.6,'炊':.9,'汁':1}[r.method] || .7);
    const baseShape = under || (opts.plain ? '' : `<path opacity="${baseOp}" d="M50,${cy-R} C${cx+R*.9},${cy-R*.9} ${cx+R*1.05},${cy+R*.5} ${cx+R*.55},${cy+R*.85} C${cx-R*.2},${cy+R*1.1} ${cx-R*1.05},${cy+R*.4} ${cx-R*.95},${cy-R*.3} C${cx-R*.85},${cy-R*.95} ${cx-R*.2},${cy-R*1.05} 50,${cy-R} Z" fill="${base}"/>`);
    const tintShape = tint ? `<circle cx="50" cy="50" r="${R}" fill="${tint}"/>` : '';
    // 仕上げ: 太い輪郭（ぬりの下に引くので、重なった具材の線は隠れる）＋鮮やかなぬり＋つや＋影で、ポップなイラストに
    const side = plated ? sideGarnish(rng) : '';
    const shapes = (under || baseShape) + side + body + over + garnish;
    // 輪郭は「ぬりのある形」だけ（線だけの飾りや細部はなぞらない）
    const asLines = t => t.replace(/<(path|line)\b[^>]*fill="none"[^>]*\/>/g, '').replace(/<line\b[^>]*\/>/g, '')
        .replace(/fill="(?!none)[^"]*"/g, 'fill="none"').replace(/stroke="[^"]*"/g, '').replace(/stroke-width="[^"]*"/g, '').replace(/opacity="[^"]*"/g, '');
    const shine = `<ellipse cx="38" cy="32" rx="9" ry="4.5" fill="#fff" opacity=".35" transform="rotate(-30 38 32)"/><circle cx="31" cy="38" r="1.6" fill="#fff" opacity=".5"/>`;
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="dish pop" aria-hidden="true">
        <g filter="url(#pop-shadow)">
            <g fill="none" stroke="#4a2e1f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">${asLines(shapes)}</g>
            <g filter="url(#pop-fill)">${shapes}${tintShape}</g>
        </g>
        ${under ? '' : shine}
    </svg>`;
}
function sideGarnish(rng){
    let out = '';
    for (let k = 0; k < 22; k++){ const x = 66 + (rng()-.5)*20, y = 64 + (rng()-.5)*16; out += `<path d="M${x.toFixed(1)},${y.toFixed(1)} q${(4+rng()*4).toFixed(1)},${(-2+rng()*4).toFixed(1)} ${(9+rng()*5).toFixed(1)},${(-1+rng()*2).toFixed(1)}" stroke="${rng() < .5 ? '#d9eab0' : '#bcd98a'}" stroke-width="1.3" fill="none" stroke-linecap="round" transform="rotate(${(-30+rng()*60).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
    return `<g>${out}</g><circle cx="76" cy="48" r="4.6" fill="#e2412f"/><circle cx="74.8" cy="46.6" r="1.3" fill="#fff" opacity=".6"/><path d="M76,43.6 l1.2,-1.4 M76,43.6 l-1.4,-.9" stroke="#3f7a35" stroke-width=".9" stroke-linecap="round"/>`;
}
function mixHex(a, b, t){
    const h = x => { x = String(x).replace('#',''); if (x.length === 3) x = x.split('').map(c => c + c).join(''); return [0,2,4].map(i => parseInt(x.slice(i, i+2), 16)); };
    try{ const A = h(a), B = h(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2,'0')).join(''); }catch(e){ return a; }
}

// 買い足すとレパートリーが広がる食材: その1品を足すと「今すぐ作れる」に変わる料理を数える
function shoppingHints(have, limit=3){
    const gain = {};
    RECIPES.forEach(r => {
        if (S.hidden.includes(r.id)) return;
        const m = matchRecipe(r, have);
        if (m.miss.length === 1 && (m.got.length + m.subs.length) >= 1){
            const k = m.miss[0].key, lbl = m.miss[0].label;
            (gain[k] = gain[k] || {label:lbl, names:[]}).names.push(r.name);
        }
    });
    return Object.entries(gain).map(([k,v]) => ({key:k, label:v.label, n:v.names.length, names:v.names.slice(0,3)}))
        .sort((a,b) => b.n - a.n).slice(0, limit);
}

   ========================================================= */
function recordedDays(){ return [...new Set(S.history.map(h => h.d))].sort().reverse(); }
function streak(){
    const days = new Set(S.history.map(h => h.d));
    let n = 0, d = TODAY;
    if (!days.has(d)) d = addDays(d, -1);
    while (days.has(d)){ n++; d = addDays(d, -1); }
    return n;
}
function weekStart(d=TODAY){ const dt = parseYmd(d); const wd = (dt.getDay() + 6) % 7; return addDays(d, -wd); }   // 月曜はじまり
function weekStats(){
    const from = weekStart();
    const hs = S.history.filter(h => h.d >= from && h.d <= TODAY);
    const days = new Set(hs.map(h => h.d)).size;
    const firstOf = {};
    S.history.slice().sort((a,b) => a.d < b.d ? -1 : 1).forEach(h => { if (!firstOf[h.id]) firstOf[h.id] = h.d; });
    const fresh = [...new Set(hs.map(h => h.id))].filter(id => firstOf[id] >= from);
    const skills = S.skills.filter(s => s.d >= from).length;
    const genres = new Set(hs.map(h => { const r = byId(h.id); return r && r.genre; }).filter(Boolean)).size;
    return {days, dishes:hs.length, fresh, skills, genres};
}
function greeting(){
    const h = new Date().getHours();
    const hello = h < 5 ? t('こんばんは。遅くまでおつかれさまです') : h < 11 ? t('おはようございます') : h < 17 ? t('こんにちは') : t('こんばんは');
    const todayDone = S.history.some(x => x.d === TODAY);
    const st = streak();
    const ws = weekStats();
    let line;
    if (!S.history.length) line = t('まずは今日の献立を決めるところから。決めるだけでも、立派なひと仕事です。');
    else if (todayDone && st >= 3) line = t('{n}日続けて献立が決まっています。この調子は、ちゃんとすごいことです。', {n:st});
    else if (todayDone) line = t('今日の献立は決まっています。あとは作るだけ。');
    else if (st >= 3) line = t('{n}日続いています。今日の分を決めれば{m}日目です。', {n:st, m:st+1});
    else if (ws.days) line = t('今週は{n}日分、{d}品を記録しています。今日はどうしましょう。', {n:ws.days, d:ws.dishes});
    else line = t('きのうまでのごはん、おつかれさまでした。今日の分をいっしょに考えましょう。');
    return {hello, line};
}

function praiseFor(ids){
    const st = streak();
    const firstTimers = ids.filter(id => S.history.filter(h => h.id === id).length === 1);
    if (firstTimers.length) return t('初めての料理に挑戦です。レパートリーが{n}品増えました。', {n:firstTimers.length});

function parseIntro(pr){
    const ip = pr && pr.introPrice; if (!ip) return null;

function autoCount(){
    const rng = seeded('count' + TODAY + '#' + (session.countSalt || 0));
    const wd = parseYmd(TODAY).getDay(), x = rng();

    if (session.mood === 'quick') return t('急ぎの日なので少なめの{n}品', {n});

function suggestFor(slot, items, main){
    if (!main) return null;
    const used = items.map(x => x.r && x.r.id).filter(Boolean);
    const others = items.map(x => x.r).filter(r => r && r !== main);
    const ctx = {main, others, fridge: session.useFridge ? fridgeKeys() : null};
    if (slot === '汁物'){
        if (main.id === 'nikuudon' || main.type === '汁物') return null;
        return pick(RECIPES.filter(r => r.type === '汁物' && !used.includes(r.id)), ctx);
    }
    if (slot === '副菜') return pick(RECIPES.filter(r => r.type === '副菜' && !used.includes(r.id)), ctx);
    // 2品目の主菜: 1品目と違う肉・魚で、手のかからないもの
    const mainProteins = new Set(main.items.filter(i => !i.opt && FAMILY[i.key]).map(i => i.key));
    return pick(RECIPES.filter(r => r.type === '主菜' && !used.includes(r.id) && r.family !== main.family && r.min <= 30
        && !r.items.some(i => !i.opt && mainProteins.has(i.key))), ctx);
}

/* =========================================================
   人数に合わせて分量を変える（レシピは2人分で書いてある）
   ========================================================= */
const FRAC = {0.25:'1/4', 0.5:'1/2', 0.75:'3/4'};
function fmtAmount(v, unit){
    if (unit === 'g' || unit === 'ml'){
        const step = v >= 100 ? 10 : 5;
        return String(Math.max(step, Math.round(v / step) * step));
    }
    const and = LANG === 'ja' ? 'と' : ' ';   // 帯分数のつなぎ（1と1/2 / 1 1/2）
    if (v >= 3){ const h = Math.round(v * 2) / 2; return Number.isInteger(h) ? String(h) : `${Math.floor(h)}${and}1/2`; }
    const t3 = Math.round(v * 3);   // 1/3・2/3 はそのまま表す（レシピに多い）
    if (t3 % 3 !== 0 && Math.abs(v * 3 - t3) < 0.06){ const w3 = Math.floor(t3 / 3), r3 = t3 % 3; return (w3 ? `${w3}${and}` : '') + `${r3}/3`; }
    const q = Math.round(v * 4) / 4;
    if (q === 0) return '1/8';
    const w = Math.floor(q), f = +(q - w).toFixed(2);
    if (!f) return String(w);
    return w ? `${w}${and}${FRAC[f]}` : FRAC[f];
}
function scaleText(str, factor){
    if (!str || factor === 1) return str;
    return String(str).replace(/(（[^）]*）|\([^)]*\))|(\d+(?:\.\d+)?)(?:\/(\d+))?(倍|℃|%|枚切り|cm|mm|g|ml)?/g, (m, paren, a, b, unit) => {
        if (paren) return paren;
        if (unit && !['g','ml'].includes(unit)) return m;
        const v = (b ? Number(a) / Number(b) : Number(a)) * factor;
        return fmtAmount(v, unit) + (unit || '');
    });
}
function servingFactor(){ return (Number(S.settings.servings) || 2) / 2; }

function visiblePlanDays(){

    return hasPro() ? days : days.slice(0, PLAN.freeLimits.weekDays);

function shoppingList(){
    const have = fridgeKeys(), fac = servingFactor(), map = new Map();
    visiblePlanDays().forEach(x => {
        const r = byId(x.id); if (!r) return;
        r.items.forEach(i => {
            if (i.opt || PANTRY.has(i.key) || have.has(i.key)) return;
            const e = map.get(i.key) || {key:i.key, label:i.label, qty:[], dishes:[]};
            if (i.qty) e.qty.push(scaleText(i.qty, fac));
            if (!e.dishes.includes(r.name)) e.dishes.push(r.name);
            map.set(i.key, e);
        });
    });
    return [...map.values()].sort((a, b) => b.dishes.length - a.dishes.length || a.label.localeCompare(b.label, LANG));
}
// 同じ単位の分量は足し合わせる（例: 1/3本＋1/3本 → 2/3本、150g＋200g → 350g）
function sumQty(list){
    const groups = new Map(), rest = [];
    list.forEach(q => {
        const m = String(q).match(/^(\D*?)(?:(\d+)[と ])?(\d+(?:\.\d+)?)(?:\/(\d+))?(\D*)$/);
        if (!m){ rest.push(q); return; }
        const v = (m[2] ? Number(m[2]) : 0) + (m[4] ? Number(m[3]) / Number(m[4]) : Number(m[3]));
        const key = m[1] + '|' + m[5];
        groups.set(key, (groups.get(key) || 0) + v);
    });
    const out = [...groups.entries()].map(([k, v]) => { const [pre, unit] = k.split('|'); const f = fmtAmount(v, unit); return pre + (f === '1/8' ? t('少々') : f) + unit; });
    return [...out, ...rest];
}

function menuShareText(){
    const m = session.menu; if (!m) return '';
    const lines = [t('【{date}の献立】', {date:jpDate(TODAY)})];
    m.items.forEach(x => { if (x.r) lines.push(t('{slot}：{name}', {slot:slotLabel(x.slot), name:x.r.name})); });
    const main = m.items[0] && m.items[0].r;
    const st = stapleSpot();
    if (!(main && (main.type === 'ごはん' || main.type === '麺'))){ if (PACK){ if (st) lines.push(st.local || st.name); } else lines.push(t('ご飯')); }
    lines.push('', t('― わが家のごはん帖'));
    return lines.join('\n');
}
function weekShareText(){
    const days = visiblePlanDays(); if (!days.length) return '';
    const lines = [t('【献立の予定】')];
        days.forEach(x => { const r = byId(x.id); if (r) lines.push(`${jpDate(x.d)}${GAP()}${r.name}`); });
    const list = shoppingList(); const done = shopDoneSet();
    const rest = list.filter(e => !done.has(e.key));
    if (rest.length){ lines.push('', t('【買い物メモ】')); rest.forEach(e => lines.push(`□ ${e.label}${e.qty.length ? t('（{qty}）', {qty:sumQty(e.qty).join(t('＋'))}) : ''}`)); }
    lines.push('', t('― わが家のごはん帖'));
    return lines.join('\n');
}
function lineShareUrl(text){ return 'https://line.me/R/share?text=' + encodeURIComponent(text); }
// 国でよく使われる家族の連絡アプリ（リンクで開けるものだけボタンにする。ほかは「ほかのアプリで送る」）
function msgLabel(){ const m = messengerFor(); return m ? m.label : ''; }
function msgBtnClass(){ const m = messengerFor(); return 'btn msg ' + (m ? m.cls : 'none'); }
function messengerFor(){
    const app = PACK ? PACK.share : 'line';
    if (app === 'line') return {label:'LINE', cls:'', url: lineShareUrl};
    if (app === 'whatsapp') return {label:'WhatsApp', cls:'wa', url: t => 'https://wa.me/?text=' + encodeURIComponent(t)};
    if (app === 'telegram') return {label:'Telegram', cls:'tg', url: t => 'https://t.me/share/url?url=&text=' + encodeURIComponent(t)};
    return null;
}
function openShare(kind){
    const text = kind === 'week' ? weekShareText() : menuShareText();
    if (!text){ toast(t('送る献立がありません')); return; }
    sheet = {kind:'share', text, title: kind === 'week' ? t('献立の予定と買い物メモ') : t('今日の献立')}; renderSheet();
}
async function systemShare(text, title){
    const P = nativePlugin('Share');
    try{
        if (P){ await P.share({title, text, dialogTitle:t('家族に送る')}); return; }
        if (navigator.share){ await navigator.share({title, text}); return; }
    }catch(e){ if (e && (e.name === 'AbortError' || /cancel/i.test(String(e.message)))) return; }
    copyText(text);
}
function copyText(text){
    const done = () => toast(t('コピーしました。LINE などに貼りつけて送れます'));
    const fallback = () => { const ta = $('#share-text'); if (ta){ ta.select(); toast(t('文字を選択しました。コピーしてください')); } };
    try{ navigator.clipboard.writeText(text).then(done, fallback); }
    catch(e){ fallback(); }
}
function shareSheetHtml(){
    const canSystem = !!(nativePlugin('Share') || navigator.share);
    return `<h2>${esc(t('{title}を送る', {title:sheet.title}))}</h2>
        <textarea id="share-text" class="share-text" readonly aria-label="${esc(t('送る内容'))}">${esc(sheet.text)}</textarea>
        ${(m => m ? `<a class="btn msg ${m.cls} wide" href="${esc(m.url(sheet.text))}" target="_blank" rel="noopener">${esc(t('{app} で送る', {app:m.label}))}</a>` : '')(messengerFor())}
        <div class="row">
            ${canSystem ? `<button class="btn wide" data-act="share-system">${esc(t('ほかのアプリで送る'))}</button>` : ''}
            <button class="btn wide" data-act="share-copy">${esc(t('コピーする'))}</button>
        </div>
        ${messengerFor() ? `<p class="tiny muted">${esc(t('{app} を押すと、送り先（家族やグループ）を選ぶ画面が開きます。', {app:messengerFor().label}))}</p>` : ''}
        <button class="btn ghost" data-act="sheet-close">${esc(t('閉じる'))}</button>`;
}

/* =========================================================
   毎日のお知らせ（iPhone アプリ版のみ。端末の通知で献立を決める時間を知らせる）
   ========================================================= */
const NOTIFY_ID = 1001;
async function setReminder(hour){
    const P = nativePlugin('LocalNotifications');
    if (!P){ toast(t('お知らせは iPhone アプリ版で使えます')); return; }
    try{
        await P.cancel({notifications:[{id: NOTIFY_ID}]}).catch(() => {});
        if (hour === null){ S.settings.remind = null; save(); toast(t('お知らせを止めました')); render(); return; }
        const perm = await P.requestPermissions();
        if (perm && perm.display && perm.display !== 'granted'){ toast(t('通知が許可されていません。iPhone の「設定」→「ごはん帖」→「通知」で許可してください')); return; }
        await P.schedule({notifications:[{id: NOTIFY_ID, title:t('今日の献立を決めましょう'), body:t('おまかせで、主菜・副菜・汁ものをすぐに提案します。'), schedule:{on:{hour, minute:0}, allowWhileIdle:true}}]});
        S.settings.remind = hour; save(); toast(t('毎日{time}にお知らせします', {time:hourLabel(hour)})); render();
    }catch(e){ toast(t('お知らせを設定できませんでした')); }
}
function reminderHtml(){
    if (!isNative()) return `<p class="small muted" style="margin:0">${esc(t('毎日のお知らせ（献立を決める時間の通知）は iPhone アプリ版で使えます。'))}</p>`;
    const cur = S.settings.remind;
    return `<div class="field"><label>${esc(t('毎日のお知らせ'))}</label>
        <div class="chips">${[['off',t('なし')],[15,hourLabel(15)],[16,hourLabel(16)],[17,hourLabel(17)],[18,hourLabel(18)]].map(([v,l]) => `<button class="chip" data-act="remind" data-v="${v}" aria-pressed="${v==='off' ? !cur : cur===v}">${esc(l)}</button>`).join('')}</div>
        <span class="small muted">${esc(t('献立を決める時間に、端末の通知でお知らせします。'))}</span></div>`;
}

function addIngredients(text){
    const found = extractIngredients(text);
    let added = 0;
    found.forEach(f => { if (!S.fridge.some(x => keyOf(x) === keyOf(f))){ S.fridge.push(f); added++; } });
    save();
    if (found.length) toast(added ? t('{list} を追加しました', {list:joinNames(found)}) : t('すでに登録されています'));
    else toast(t('食材の名前が読み取れませんでした'));
}
let recog = null;
function startMic(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ toast(t('この端末では声の入力が使えません。文字で入力してください')); return; }
    if (recog){ recog.stop(); return; }
    try{
        recog = new SR(); recog.lang = PACK ? (PACK.speechLang || navigator.language || 'en-US') : 'ja-JP'; recog.interimResults = false; recog.maxAlternatives = 1;
        const btn = $('#mic-btn'); if (btn) btn.textContent = t('聞いています…');
        recog.onresult = e => { const t = e.results[0][0].transcript; addIngredients(t); };
        recog.onerror = e => { toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? t('マイクが使えませんでした。文字で入力してください') : t('聞き取れませんでした。もう一度どうぞ')); };
        recog.onend = () => { recog = null; render(); };
        recog.start();
    }catch(e){ recog = null; toast(t('マイクが使えませんでした。文字で入力してください')); }
}

        const el = document.createElement('script');
        el.src = `packs/i18n/${cc.toLowerCase()}.${lang}.js`;
        el.onload = () => res(PACK_TR[k] || null);
        el.onerror = () => { PACK_TR[k] = null; res(null); };
        document.head.appendChild(el);
    }));
}
function trLangFor(cc){ return cc === 'JP' ? (LANG === 'ja' ? null : LANG) : (LANG === 'en' ? null : LANG); }
async function ensureTr(cc){
    const l = trLangFor(cc); if (!l) return null;
    const d = await loadPackTr(cc, l);
    if (!d && cc === 'JP' && l !== 'en') return loadPackTr('JP', 'en');
    return d;
}
function trOf(cc){
    const l = trLangFor(cc); if (!l) return null;
    return PACK_TR[cc + '.' + l] || (cc === 'JP' ? PACK_TR['JP.en'] : null) || null;
}
// 日本のレシピに訳を重ねる（食材のキーはそのまま。表示の名前・分量・作り方だけ入れかえる）
function jpRecipe(r, tr){
    const rt = tr && tr.recipes && tr.recipes[r.id]; if (!rt) return r;
    const items = r.items.map((i, k) => { const v = rt.ings && rt.ings[k]; return v ? Object.assign({}, i, {name: v[0], label: v[0], qty: v[1] != null ? String(v[1]).replace(/[?？]\s*$/, "") : i.qty}) : i; });
    return Object.assign({}, r, {name: rt.name || r.name, nameEn: r.name, items, seas: rt.seas != null ? rt.seas : r.seas, steps: rt.steps || r.steps, tip: rt.tip || r.tip || null, trLang: LANG});
}
function packRecipe(pk, x, tr){
    const rt = tr && tr.recipes && tr.recipes[x.id];
    const items = x.ings.map((s, k) => {
        const opt = s.endsWith('?'); if (opt) s = s.slice(0, -1);
        let [key, label, qty] = s.split('|');
        const v = rt && rt.ings && rt.ings[k];
        if (v){ label = v[0]; if (v[1] != null) qty = String(v[1]).replace(/[?？]\s*$/, ''); }
        else if (tr && tr.names && tr.names[(key || '').trim().toLowerCase()]) label = tr.names[(key || '').trim().toLowerCase()];
        return {name: label || key, qty: qty || '', opt, key: (key || '').trim().toLowerCase(), label: label || key};
    });
    const family = PACK_FAMILY[x.protein] || '野菜';
    const re = PROTEIN_WORDS[x.protein];
    const p = family === '野菜' ? null : (items.find(i => re && re.test(i.key)) || items[0]);
    const name = rt && rt.name ? rt.name : (x.local || x.name);
    return {id: x.id, name, nameEn: name === (x.local || x.name) ? x.name : (x.local || x.name), genre: 'local', type: PACK_TYPE[x.type] || '主菜', method: PACK_METHOD[x.method] || '煮',
        min: Number(x.min) || 30, ings: x.ings, items, seas: rt && rt.seas != null ? rt.seas : (x.seas || ''), steps: (rt && rt.steps ? rt.steps : (x.steps || [])).slice(),
        tip: (rt && rt.tip) || x.tip || null, pack: pk.country,
        protein: p ? p.key : null, family, main: ['main', 'rice', 'noodle'].includes(x.type)};
}
function replaceList(arr, list){ arr.length = 0; list.forEach(v => arr.push(v)); }
function replaceObj(obj, src){ Object.keys(obj).forEach(k => delete obj[k]); Object.assign(obj, src); }
function applyCountry(cc){
    if (!JP_DATA) JP_DATA = {recipes: RECIPES.slice(), canon: CANON.slice(), pantry: [...PANTRY], family: Object.assign({}, FAMILY), subs: Object.assign({}, SUBS),
        quick: QUICK.slice(), stapleQuick: STAPLE_QUICK.slice(), avoidQuick: AVOID_QUICK.slice(), moods: MOODS.slice()};
    const pk = cc === 'JP' ? null : PACKS[cc];
    PACK = pk || null;
    const tr = trOf(cc);
    if (!pk){
        replaceList(RECIPES, tr ? JP_DATA.recipes.map(r => jpRecipe(r, tr)) : JP_DATA.recipes); replaceList(MOODS, JP_DATA.moods);
        PANTRY.clear(); JP_DATA.pantry.forEach(v => PANTRY.add(v)); replaceObj(FAMILY, JP_DATA.family); replaceObj(SUBS, JP_DATA.subs);
        if (tr && tr.names){
            // 日本の食材の名前を訳で表示し、訳の名前でも冷蔵庫に入れられるようにする
            const nm = tr.names, names = {}, extra = [];
            JP_DATA.recipes.forEach(r => r.items.forEach(i => { const v = nm[i.name] || nm[i.key]; if (v && !names[i.key]){ names[i.key] = v; extra.push([i.key, [i.name, v]]); } }));
            JP_DATA.canon.forEach(([c]) => { if (nm[c]) names[c] = nm[c]; });
            replaceObj(PACK_NAMES, names);
            replaceList(CANON, [...JP_DATA.canon.map(([c, vs]) => [c, nm[c] ? [...vs, nm[c]] : vs]), ...extra]);
            const disp = q => nm[q] || q;
            replaceList(QUICK, JP_DATA.quick.map(disp)); replaceList(STAPLE_QUICK, JP_DATA.stapleQuick.map(disp)); replaceList(AVOID_QUICK, JP_DATA.avoidQuick.map(disp));
        } else {
            replaceList(CANON, JP_DATA.canon); replaceList(QUICK, JP_DATA.quick); replaceList(STAPLE_QUICK, JP_DATA.stapleQuick);
            replaceList(AVOID_QUICK, JP_DATA.avoidQuick); replaceObj(PACK_NAMES, {});
        }
    } else {
        const recipes = pk.recipes.map(x => packRecipe(pk, x, tr));
        replaceList(RECIPES, recipes);
        const names = Object.assign({}, pk.names || {}, (tr && tr.names) || {});
        const aliases = Object.assign({}, pk.aliases || {});
        if (tr && tr.names) Object.entries(pk.names || {}).forEach(([k, v]) => { aliases[k] = [...(aliases[k] || []), v]; });
        recipes.forEach(r => r.items.forEach(i => { if (!names[i.key]) names[i.key] = i.label; if (!aliases[i.key]) aliases[i.key] = []; }));
        replaceObj(PACK_NAMES, names);
        replaceList(CANON, Object.entries(aliases).map(([k, vs]) => [k, [...new Set([k, names[k], ...vs].filter(Boolean))]]));
        const fam = {}; recipes.forEach(r => { if (r.protein) fam[r.protein] = r.family; });
        replaceObj(FAMILY, fam); replaceObj(SUBS, {});
        PANTRY.clear();
        const disp = k => names[k] || k;
        replaceList(QUICK, (pk.quick || []).map(disp));
        replaceList(STAPLE_QUICK, (pk.pantry || []).map(disp));
        replaceList(AVOID_QUICK, (pk.quick || []).slice(0, 14).map(disp));
        replaceList(MOODS, JP_DATA.moods.filter(m => ['all', 'quick', 'fish', 'meat'].includes(m.k)));
    }
    rebuildVariants();
    session.menu = null; session.twist = null; session.mood = 'all'; twistState.results = null;
    for (const k in BROWSE) delete BROWSE[k];
    updateTabs();
}
// 「ひとひねり」は日本のレシピを日本語で組み立てるしくみなので、日本＋日本語のときだけ出す
function twistAvailable(){ return !PACK && LANG === 'ja'; }
function updateTabs(){
    const tw = document.querySelector('nav.tabs [data-tab="twist"]'); if (tw) tw.hidden = !twistAvailable();
    const n = document.querySelectorAll('nav.tabs button[data-tab]:not([hidden])').length;
    document.querySelector('nav.tabs .in').style.gridTemplateColumns = `repeat(${n},1fr)`;
    if (!twistAvailable() && tab === 'twist') tab = 'today';
}
// 言語や国を変えたあと、いまの献立は同じ料理のまま、表示だけ新しい言語にする
async function refreshRecipes(){
    const cc = currentCountry();
    await ensureTr(cc);
    const m = session.menu, ids = m ? m.items.map(x => ({slot: x.slot, id: x.r && x.r.id})) : null;
    applyCountry(cc);
    if (m && ids) session.menu = {n: m.n, items: ids.map(x => ({slot: x.slot, r: x.id ? RECIPES.find(r => r.id === x.id) || null : null}))};
}

/* ---- 世界のレシピ（自分の国の献立はそのままで、ほかの国の家庭料理を見る） ---- */
const BROWSE = {};
let worldCC = null;
function buildBrowse(cc){
    if (cc === 'JP'){ const tr = trOf('JP'); return JP_DATA.recipes.map(r => tr ? jpRecipe(r, tr) : r); }
    const pk = PACKS[cc]; if (!pk) return [];
    const tr = trOf(cc);
    return pk.recipes.map(x => packRecipe(pk, x, tr));
}
async function loadBrowse(cc){
    try{ if (cc !== 'JP') await loadPack(cc); await ensureTr(cc); BROWSE[cc] = buildBrowse(cc); }catch(e){ BROWSE[cc] = []; }
    if (tab === 'world') render();
}
function viewWorld(){
    const home = currentCountry();
    const others = COUNTRIES.filter(c => c.cc !== home);
    if (!worldCC || worldCC === home) worldCC = others[0].cc;
    const list = BROWSE[worldCC];
    if (!list) loadBrowse(worldCC);
    const c = countryOf(worldCC);
    const group = (code, title) => {
        const rs = (list || []).filter(r => code.includes(r.type)); if (!rs.length) return '';
        return `<div class="sec-head"><h3>${esc(title)}</h3></div>
            <div class="list">${rs.map(r => `<div class="match" data-act="open" data-id="${esc(r.id)}">
                <span>${thumbHtml(r)}</span>
                <div class="info"><div class="head"><span class="name">${esc(r.name)}</span></div>
                    ${r.nameEn && r.nameEn !== r.name ? `<div class="small muted">${esc(r.nameEn)}</div>` : ''}
                    <div class="small muted">${esc(t('{n}分', {n: r.min}))}</div></div></div>`).join('')}</div>`;
    };
    return `
    <section class="sec">
        <div class="sec-head"><h2>${esc(t('世界のレシピ'))}</h2><span class="hint">${esc(t('ほかの国の家庭料理を見られます。毎日の献立は、選んだ国のままです。'))}</span></div>
        <div class="chips scroll" role="group" aria-label="${esc(t('国・地域'))}">${others.map(o => `<button class="chip" data-act="world-cc" data-cc="${o.cc}" aria-pressed="${o.cc === worldCC}"><span aria-hidden="true">${o.flag}</span> <span lang="${esc(o.lang)}">${esc(o.nameLocal)}</span></button>`).join('')}</div>
        <div class="world-head"><span class="fl" aria-hidden="true">${c.flag}</span><b lang="${esc(c.lang)}">${esc(c.nameLocal)}</b>${LANG === 'ja' ? (c.nameJa !== c.nameLocal ? `<span class="muted small">${esc(c.nameJa)}</span>` : '') : (c.name !== c.nameLocal ? `<span class="muted small">${esc(c.name)}</span>` : '')}</div>
        ${list ? group(['主菜', 'ごはん', '麺'], t('主菜')) + group(['副菜'], t('副菜')) + group(['汁物'], t('汁もの')) : `<div class="list"><div class="empty">${esc(t('読みこんでいます…'))}</div></div>`}
    </section>`;
}
// 国ごとに、冷蔵庫・常備品・苦手な食材を分けて持つ（食材の呼び名が国で違うため）
async function setCountry(cc){
    const first = !S.settings.country;
    const old = currentCountry();
    if (old !== cc){
        S.countryData = S.countryData || {};
        S.countryData[old] = {fridge: S.fridge, staples: S.staples, avoid: S.settings.avoid};
        const d = S.countryData[cc] || {};
        S.fridge = d.fridge || []; S.staples = d.staples || []; S.settings.avoid = d.avoid || [];
        S.week = null;
    }
    try{ await loadPack(cc); }catch(e){ toast(t('この国のデータを読みこめませんでした')); return false; }
    S.settings.country = cc; save();
    await setLang(wantLang());
    await ensureTr(cc);
    applyCountry(cc);
    if (first){ S.firstUse = TODAY; save(); }   // 無料期間は国を選んで使いはじめた日から
    return true;
}
function stapleSpot(){
    if (!PACK) return null;
    return PACK.staple || null;
}
function countrySheetHtml(){
    const cur = S.settings.country || guessCountry();
    const subOf = c => LANG === 'ja' ? (c.nameLocal === c.nameJa ? '' : c.nameJa) : (c.nameLocal === c.name ? '' : c.name);
    return `<h2>${esc(t('国・地域を選んでください'))}</h2>
        <p class="muted small">${esc(t('選んだ国の家庭料理で、毎日の献立を提案します。あとから設定で変えられます。'))}</p>
        <div class="country-list">${COUNTRIES.map(c => `<button class="country${c.cc === cur ? ' on' : ''}" data-act="pick-country" data-cc="${c.cc}">
            <span class="fl" aria-hidden="true">${c.flag}</span><span class="nm" lang="${esc(c.lang)}">${esc(c.nameLocal)}</span><span class="sub">${esc(subOf(c))}</span></button>`).join('')}</div>
        ${S.settings.country ? `<button class="btn ghost" data-act="sheet-close">${esc(t('閉じる'))}</button>` : ''}`;
}
// 言語を切りかえたとき、作ってある案（ひとひねりの「変えたところ」など）を新しい言語で作り直す
function relocalize(){
    const re = r => r && r.isTwist ? buildTwist(r.id) : r;
    if (twistState.results) twistState.results = twistState.results.map(re).filter(Boolean);
    if (session.twist) session.twist = re(session.twist);
    if (session.menu) session.menu.items.forEach(x => { x.r = re(x.r); });
    if (modalId) renderModal();
}
function openCountrySheet(){ sheet = {kind:'country'}; renderSheet(); }
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (sheet && sheet.kind !== 'onboard' && !(sheet.kind === 'country' && !S.settings.country)) closeSheet(); else if (modalId) closeModal(); });
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
if (!S.settings.country && S.onboarded) S.settings.country = 'JP';   // 以前から使っている人は日本
(async () => {
    const cc = S.settings.country;
    if (cc && cc !== 'JP'){ try{ await loadPack(cc); }catch(e){ S.settings.country = 'JP'; } }
    await setLang(wantLang());
    await ensureTr(currentCountry());
    applyCountry(currentCountry());
    scheduleTrialReminder();
    setTab(tab);
    if (!S.settings.country) openCountrySheet();
    else if (!S.onboarded) startOnboard();
})();
if (!(S.usedDays || []).includes(TODAY)){ S.usedDays = [...(S.usedDays || []), TODAY].slice(-400); save(); }
(() => { const r = rcInit(); if (r) r.then(P => P.getCustomerInfo()).then(res => applyCustomerInfo(res && res.customerInfo)).catch(() => {}); })();
loadGenerated().then(loadPhotos);
loadMine();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && document.querySelector('link[rel="manifest"]')){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
